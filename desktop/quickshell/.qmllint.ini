# qmllint configuration for the Quickshell shell. Only the deliberate
# deviations from qmllint's own defaults are listed; everything else keeps
# whatever the installed Qt considers right, so a Qt upgrade can still teach
# us something new. Regenerate the full default set for reference with
# `qmllint-qt6 --write-defaults` in a scratch directory.
#
# Run through tests/qml-lint (batched qmllint over parallel slices of the tree).

[Warnings]

# Quickshell exposes several types to QML that qmllint cannot resolve from the
# qmltypes alone. None of these are actionable from this repo:
#   PanelWindow — created by Quickshell itself, reported as not creatable
#   BluetoothAdapter, UntypedObjectModel, FileViewAdapter, QList<NotificationAction*>
#   the `margins` group on PanelWindow
UncreatableType=disable
UnresolvedType=disable

# Process.exited(int exitCode, QProcess::ExitStatus exitStatus) — the enum is
# not registered with QML, so qmllint cannot type the second parameter and
# flags every onExited binding regardless of how it is written. Not fixable
# from here. Note the trap: `function onExited(exitCode) {}` silences the
# warning because qmllint stops seeing a signal handler at all, and the
# runtime stops calling it too (verified against a live Quickshell instance).
BadSignalHandlerParameters=disable

# Loader, Repeater, and module boundaries carry explicit contracts. A missing
# member at any of those boundaries is now a deploy-blocking regression.
MissingProperty=error

# Cleared in WP0.2/WP0.3 and at zero since — errors, so they stay there.
# UnqualifiedAccess especially: under ComponentBehavior: Bound a delegate that
# reads model data it never declared renders nothing at all, and this warning
# is the only thing that reports it. Where qmllint is genuinely wrong, an
# inline `// qmllint disable unqualified` at the site is the escape hatch.
Comma=error
UnqualifiedAccess=error
UnusedImports=error

# A required property left unset throws when the component is created, so the
# default warning only tells us after a reload has already broken the bar.
# It also carries the bar's own contract: BarIcon/BarChip/BarTooltip require
# `host` because that is what dismisses a tooltip when a layer surface eats
# the MouseArea's exit event, and the one module that omitted it (idle) had a
# tooltip that stayed on screen indefinitely.
RequiredProperty=error
