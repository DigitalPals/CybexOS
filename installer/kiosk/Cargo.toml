[package]
name = "nerdos-installer"
version = "0.1.0"
edition = "2021"
# The pinned Nixpkgs builds this crate; keep dependencies within its rustc.
rust-version = "1.95"
publish = false
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The KMS backend (libinput, libseat) also supplies the SVG decoder, so it is
# part of every build, including tests and the headless preview.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-path", "backend-linuxkms"] }
tz-rs = "0.7"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
default = []
# Headless PNG renders of every screen for design review.
preview = ["dep:image"]

[[bin]]
name = "nerdos-installer"
path = "src/main.rs"

[[bin]]
name = "installer-preview"
path = "src/preview.rs"
required-features = ["preview"]

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
