name: Qualified immutable release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing semantic tag (v1.2.3 or v1.2.3-beta.1)
        required: true
      qualification_url:
        description: HTTPS URL of the same-revision complete physical and lifecycle qualification report
        required: true
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - id: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]
          test "${TAG#v}" = "$(cat VERSION)"
          revision=$(git rev-parse HEAD)
          test "$revision" = "$(git rev-parse "$TAG^{commit}")"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
  qualify:
    needs: resolve
    uses: ./.github/workflows/nixos.yml
    with:
      source_ref: ${{ needs.resolve.outputs.revision }}
  publish:
    needs: [resolve, qualify]
    runs-on: [self-hosted, linux, x64, nerdos-isolated]
    environment: nerdos-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 4
      - run: python3 -B scripts/check-ci-capacity --vm
      - name: Verify tag and exact qualification identity
        env:
          TAG: ${{ inputs.tag }}
          REPORT_URL: ${{ inputs.qualification_url }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]
          test "${TAG#v}" = "$(cat VERSION)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$TAG^{commit}")"
          test -z "$(git status --porcelain)"
          mkdir -p release-output
          curl --proto '=https' --fail --location "$REPORT_URL" -o release-output/qualification.json
          nix flake metadata --json > source-metadata.json
          python3 release/manage.py gate release-output/qualification.json "$(git rev-parse HEAD)" "$(jq -r .locked.narHash source-metadata.json)"
          nix flake check -L
          staging=$(mktemp -d "$RUNNER_TEMP/nerdos-release-image-XXXXXX")
          revision=$(git rev-parse HEAD)
          image="/data/pxe/iso/nerdos-$revision-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.iso"
          trap 'rm -rf "$staging"; sudo rm -f "$image" "$image.sha256"' EXIT
          nix build .#iso -L --out-link "$staging/result"
          sudo install -d -m 0755 /data/pxe/iso
          sudo install -m 0644 "$staging"/result/iso/*.iso "$image"
          (cd /data/pxe/iso; sha256sum "$(basename "$image")") > "$staging/checksum"
          sudo install -m 0644 "$staging/checksum" "$image.sha256"
          (cd /data/pxe/iso; sha256sum -c "$image.sha256")
          nix develop -c scripts/check-image-parity "$image" . --output release-output/image-parity.json
          nix develop -c scripts/qualify-installations "$image" --output release-output/installation-evidence.json
          cp "$image" "release-output/nerdos-${TAG#v}-x86_64-linux.iso"
      - name: Prepare immutable assets and manifest
        env:
          TAG: ${{ inputs.tag }}
          SIGNING_KEY: ${{ secrets.RELEASE_ED25519_PRIVATE_KEY }}
          KEY_ID: ${{ vars.RELEASE_KEY_ID }}
        run: |
          set -euo pipefail
          trap 'rm -f signing-key' EXIT
          umask 077
          printf '%s\n' "$SIGNING_KEY" > signing-key
          git archive --format=tar.gz --prefix=nerdos/ HEAD > release-output/nerdos-source.tar.gz
          cp release/notes.md release-output/release-notes.md
          (cd release-output; sha256sum ./*.iso nerdos-source.tar.gz > SHA256SUMS)
          python3 release/manage.py manifest release-output "${TAG#v}" "$(git rev-parse HEAD)" "$(jq -r .locked.narHash source-metadata.json)" release/notes.md
          python3 release/manage.py sign release-output/manifest.json signing-key "$KEY_ID" --trust release/keys/trust.json --purpose release
          python3 release/verify-assets.py release-output/manifest.json release/keys/trust.json --local
      - name: Publish all assets together and verify public delivery
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABILITY_CHECK_TOKEN: ${{ secrets.IMMUTABILITY_CHECK_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release/require-immutable-releases
          gh release create "$TAG" --draft --verify-tag --title "NerdOS ${TAG#v}" --notes-file release/notes.md
          gh release upload "$TAG" release-output/*
          release/require-immutable-releases
          gh release edit "$TAG" --draft=false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)" = true
          python3 release/verify-assets.py release-output/manifest.json release/keys/trust.json
