name: Qualified immutable release

on:
  push:
    tags:
      # The build step applies the repository's strict SemVer validator.
      - "v*"

permissions:
  contents: read

# Never cancel a release in flight; a second run for the same tag waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prerequisites:
    name: Release prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require reviewed license, version and older ISO
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BASELINE_ISO: ${{ vars.CYBEXOS_BASELINE_ISO }}
        run: |
          set -euo pipefail
          test -s LICENSE || test -s LICENSE.md
          test -n "$BASELINE_ISO"
          version=${RELEASE_TAG#v}
          scripts/semver validate "$version"
          test "$(cat VERSION)" = "$version"

  source:
    name: Source contract
    # The exact job that gates main: same packages, same verified COPR key.
    uses: ./.github/workflows/tests.yml

  image-source:
    name: Image source contract
    uses: ./.github/workflows/live-image.yml

  vm:
    name: Generic Fedora VM install
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          sudo apt-get update
          sudo apt-get install -y cloud-image-utils qemu-system-x86 qemu-utils
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - run: ./tests/fedora-vm-convergence

  iso:
    name: ISO install, upgrade and recovery
    needs: [prerequisites, source, image-source, vm]
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ github.ref_name }}
      baseline_iso: ${{ vars.CYBEXOS_BASELINE_ISO }}
    secrets: inherit

  publish:
    name: Build, attest, and publish release asset
    needs: [source, vm, iso]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download qualified desktop assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cybexos-desktop-release
          path: dist/desktop-release
      - name: Require a repository distribution license
        run: test -s LICENSE || test -s LICENSE.md
      - name: Install release build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible-core jq zstd
      - name: Build the versioned source asset
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          [[ $RELEASE_TAG == v$version ]]
          scripts/semver validate "$version"
          root="dist/cybexos-$version"
          mkdir -p "$root"
          git archive HEAD | tar -x -C "$root"
          printf '%s\n' "$version" >"$root/VERSION"
          jq --arg version "$version" '. + {version:$version}' \
            "$root/release-manifest.json" >"$root/release-manifest.json.new"
          mv "$root/release-manifest.json.new" "$root/release-manifest.json"
          tar --create --zstd --file "dist/cybexos-$version.tar.zst" \
            --directory dist "cybexos-$version"
          (
            cd dist
            sha256sum "cybexos-$version.tar.zst" >SHA256SUMS
          )
          mkdir dist/verify
          tar --extract --zstd --file "dist/cybexos-$version.tar.zst" \
            --directory dist/verify --strip-components=1
          test "$(tr -d '[:space:]' <dist/verify/VERSION)" = "$version"
          test -x dist/verify/install
          test -x dist/verify/scripts/manage-agent-skills
          test -r dist/verify/agent-skills/cybexos/SKILL.md
          ansible-playbook dist/verify/site.yml --syntax-check
      - name: Attest the exact release archive
        id: attest
        # actions/attest v4.2.2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/cybexos-*.tar.zst
      # Installed systems verify updates offline from this bundle, so checking
      # for and applying a release needs no GitHub login or API token.
      - name: Package the provenance bundle for offline verification
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          bundle="dist/cybexos-$version.tar.zst.sigstore.jsonl"
          jq -c . "$BUNDLE_PATH" >"$bundle"
          test -s "$bundle"
          # The same pinned, offline check the updater runs, without a token.
          env -u GH_TOKEN -u GITHUB_TOKEN gh attestation verify \
            "dist/cybexos-$version.tar.zst" --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$RELEASE_TAG" --deny-self-hosted-runners
          (
            cd dist
            sha256sum "cybexos-$version.tar.zst.sigstore.jsonl" >>SHA256SUMS
          )
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          prerelease=()
          [[ $version != *-* ]] || prerelease+=(--prerelease)
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --generate-notes --title "CybexOS $version" "${prerelease[@]}"
          gh release upload "$RELEASE_TAG" \
            "dist/cybexos-$version.tar.zst" \
            "dist/cybexos-$version.tar.zst.sigstore.jsonl" dist/SHA256SUMS \
            dist/desktop-release/assets/*
          gh release edit "$RELEASE_TAG" --draft=false
          for _attempt in $(seq 1 12); do
            if test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .immutable)" = true; then
              exit 0
            fi
            sleep 5
          done
          echo "GitHub did not make $RELEASE_TAG immutable after publication" >&2
          exit 1

  pages:
    name: Publish signed desktop repository metadata
    needs: publish
    # Prerelease assets are downloadable but must never advance stable clients.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cybexos-desktop-release
          path: desktop-release
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: desktop-release/pages
      - name: Deploy verified metadata after RPM assets exist
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
