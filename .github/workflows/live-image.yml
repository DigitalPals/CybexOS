name: Live image integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  welcome-and-accounts:
    name: Image tooling, installer fixtures and account isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # The image tooling follows the release the installation contract targets.
      - name: Read the targeted Fedora release
        run: |
          release=$(python3 image/fedora_target.py)
          echo "FEDORA_RELEASE=$release" >>"$GITHUB_ENV"
      - name: Build Fedora test environment
        run: |
          docker build --build-arg FEDORA_RELEASE="$FEDORA_RELEASE" \
            -f image/Containerfile.tests -t "cybexos-image-tests:$FEDORA_RELEASE" image
      - name: Exercise source fixtures without building or booting an ISO
        run: docker run --rm -v "$PWD:/source:ro" "cybexos-image-tests:$FEDORA_RELEASE"
      - name: Validate installer configuration and launchers
        run: |
          docker run --rm -e FEDORA_RELEASE -v "$PWD:/source:ro" \
            -v "$PWD/image/live-rootfs/usr/share/anaconda:/usr/share/anaconda:ro" \
            "cybexos-image-tests:$FEDORA_RELEASE" bash -euc '
            ksvalidator --version "F$FEDORA_RELEASE" image/live.ks
            ksvalidator -i --version "F$FEDORA_RELEASE" /usr/share/anaconda/interactive-defaults.ks
            shellcheck image/build-in-guest image/rootfs/usr/bin/hyprland-quickshell \
              image/rootfs/usr/bin/cybex image/live-rootfs/usr/libexec/cybexos-live-setup
            desktop-file-validate image/rootfs/usr/share/applications/*.desktop
          '
