name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml gates a release on this same job.
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running check;
# a release's run is never cancelled. The prefix keeps this group apart from
# the caller's own when release.yml calls this workflow, where github.workflow
# names the caller.
concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Branch protection requires this check by name and release.yml gates on it.
  # Its container and name follow inventory fedora_release only when the
  # targeted release changes (tests/fedora-release.py checks they agree);
  # the next release is previewed, non-blocking, in fedora-preview.yml.
  fedora-44:
    name: Fedora 44 source contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: fedora:44
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software

    steps:
      # actions/checkout needs Git in the container for a real work tree; the
      # shared environment step installs everything else.
      - name: Install Git for the checkout
        run: dnf install -y git-core

      # actions/checkout v4.4.0; pin the reviewed action code, not its moving
      # major tag. Dependabot/manual review can advance this commit explicitly.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Dependencies, the fingerprint-verified Hyprland COPR, and an assertion
      # that this container is the release inventory/group_vars/all.yml
      # targets. Shared with the non-blocking fedora-preview.yml job.
      - name: Prepare the Fedora source-test environment
        uses: ./.github/actions/fedora-source-environment

      - name: Run every required source check
        run: ./tests/run
