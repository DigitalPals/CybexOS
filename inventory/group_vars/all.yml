---
# Opinionated product defaults. The interactive installer records machine-specific
# answers in /etc/cybexos/config.yml and passes that file as extra vars.
# Direct developer runs use the current account and avoid changing identity or
# relaxing security unless explicitly requested.
fedora_release: "44"
config_schema_version: 1
machine_hostname: "{{ ansible_facts.hostname | default('fedora') }}"
machine_timezone: UTC
machine_locale: en_US.UTF-8
regional_locale: en_US.UTF-8
machine_keyboard_layout: us
machine_keyboard_variant: ""
manage_system_identity: false
manage_personal_dotfiles: false
cleanup_legacy_xps_artifacts: false
cybexos_xps_2026: false
plymouth_theme: cybex
primary_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
primary_group: "{{ primary_user }}"
primary_home: "{{ lookup('env', 'HOME') }}"
# Root of this checkout; roles copy managed scripts and assets from it.
config_repo: "{{ playbook_dir }}"

# Strict vendor/user layering. Only the runtime root is reconciled by desktop
# convergence; the namespaced config, theme, and plugin roots belong to the
# user and are never pruned by an update.
cybexos_data_root: "{{ primary_home }}/.local/share/cybexos"
cybexos_runtime_root: "{{ cybexos_data_root }}/runtime"
cybexos_user_config_root: "{{ primary_home }}/.config/cybexos"
cybexos_state_root: "{{ primary_home }}/.local/state/cybexos"

# XPS 2026 hardware-role preferences. The camera stack is attempted only when
# both OVTI08F4 and Intel 8086:b05d are detected; build failure is diagnostic,
# not fatal to the rest of the play. Haptic intensity: low, mid, or high.
xps_2026_camera_enabled: true
xps_2026_haptic_intensity: high

# Explicitly accepted local-machine security tradeoffs.
passwordless_wheel: false
passwordless_local_polkit: false
# Saved gdm_autologin answers remain a compatibility alias. New installations
# write desktop_autologin directly; boot-time policy also verifies encryption.
desktop_autologin: "{{ gdm_autologin | default(false) }}"
# Hardware-backed daemons should start immediately on the physical laptop.
# Hardware-neutral convergence profiles can leave them enabled for boot while
# avoiding perpetual start attempts against devices the VM cannot provide.
start_optional_hardware_services: true
# sccache has no transport upgrade for the existing private-LAN scheduler.
# Setting this true is an explicit acceptance that its bearer token and build
# traffic cross that network without TLS. Set false (or use an https://
# scheduler URL) to keep compilation local instead.
allow_insecure_sccache_transport: false

# Install every application group by default. Hardware/private integration and
# network access remain separate machine choices. Explicit opt-outs are honored.
features:
  tailscale: true
  docker: true
  podman: true
  steam: true
  private_hooks: false
  apple_display: false
  source_builds: true
  # Inbound LocalSend, mDNS, Steam, and source-server ports are a deliberate
  # workstation trust decision. Disable this on machines used on untrusted
  # networks; feature-specific ports are additionally gated below.
  local_network_services: false
  developer_tools: true
  connected_widgets: true
  proprietary_apps: true

private_services:
  portal_binary: ""
  sccache_scheduler_url: ""
  # The token itself is never read by Ansible. This hook merely tests for this file.
  sccache_token_file: /etc/sccache/client-token

firewall_zone: cybexos
firewall_ports:
  - { port: "53317", protocol: tcp, comment: LocalSend }
  - { port: "53317", protocol: udp, comment: LocalSend }
  - { port: "5353", protocol: udp, comment: mDNS }
  - { port: "27036-27037", protocol: tcp, comment: Steam Remote Play, feature: steam }
  - { port: "10400-10401", protocol: udp, comment: Steam Remote Play, feature: steam }
  - { port: "27031-27036", protocol: udp, comment: Steam Remote Play, feature: steam }
  - { port: "27015", protocol: tcp, comment: Source dedicated server, feature: steam }
  - { port: "27015", protocol: udp, comment: Source dedicated server, feature: steam }

# Toolchain channels are policy, not an implicit moving target. Updating this
# date is the explicit review point for a new nightly compiler.
rust_toolchain: nightly-2026-08-23

# User-managed developer tools retain a working version on update failure.
# Claude Code's pin is a minimum (a newer install is not downgraded); OpenCode
# is pinned exactly; Codex follows the latest stable npm release.
claude_code_version: "2.1.247"
opencode_version: "1.18.27"
codex_cli_version: latest

# The starter is copied only for a genuinely absent Neovim configuration. This
# revision matches the starter already used by this machine; subsequent plugin
# resolution remains governed by Neovim's own lazy-lock.json when present.
lazyvim_starter_commit: 803bc181d7c0d6d5eeba9274d9be49b287294d99

# Distroboxes are created lazily and are never destroyed just because a pin is
# changed. These manifest digests were resolved from the named upstream tags on
# 2026-08-27; recreate a box explicitly after reviewing a refreshed digest.
distrobox_images:
  - name: fedora
    source_tag: registry.fedoraproject.org/fedora-toolbox:44
    image: registry.fedoraproject.org/fedora-toolbox@sha256:752f99bd5ae59c95bbb2a8f1fd3c1c7126e0c31b1db1e60f1303f7db2e36dd45
  - name: arch
    source_tag: docker.io/library/archlinux:latest
    image: docker.io/library/archlinux@sha256:b860afd5823683f7ea389ba5f00d812f4fe55f6f286dea329d2abeefa535e309
  - name: debian
    source_tag: docker.io/library/debian:latest
    image: docker.io/library/debian@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1

# Source builds are tied to immutable source tags/commits and an immutable base
# image. Fedora packages installed inside the build remain Fedora 44 content.
source_build_container_image: docker.io/library/fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80

# Required desktop editor, built natively even when optional source tools are off.
omawrite_version: v0.5.0
omawrite_commit: 8f98892b26768236b2c20f4e637cf4b102d898bf
omawrite_checksum: sha256:7277c05472930f15a5b13842a88260b0abe3a26bb0e7db9f9c852681e515842e

