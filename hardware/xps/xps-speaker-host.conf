# Minimal, isolated PipeWire client used only to host the XPS speaker graph.
# Keeping this out of pipewire.conf.d means a malformed optional tuning cannot
# prevent the user's PipeWire daemon from starting.
context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
      args = { }
      flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
]
