[defaults]
inventory = inventory/hosts.yml
roles_path = roles
callback_plugins = plugins/callback
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = cybexos
force_color = True
# Every invocation validates the machine it is running on from fresh setup
# facts. A persistent cache is unsafe for a local workstation inventory alias:
# it can outlive a kernel update or even follow the checkout to another host.
gathering = explicit
fact_caching = memory

[privilege_escalation]
become = True
