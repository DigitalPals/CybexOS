[defaults]
inventory = inventory/hosts.yml
roles_path = roles
callback_plugins = plugins/callback
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = cybexos
force_color = True
# Every invocation validates the machine it is running on from fresh setup
# facts. A persistent cache is unsafe for a local workstation inventory alias:
# it can outlive a kernel update or even follow the checkout to another host.
gathering = explicit
fact_caching = memory
# A notified handler is otherwise lost when a later task fails: the retry sees
# its triggering task as unchanged, so an initramfs rebuild, daemon-reload, or
# service restart would never happen. Run already-notified handlers first.
force_handlers = True

[privilege_escalation]
become = True

[connection]
# Feed modules to the interpreter over stdin instead of writing, chmodding,
# and deleting a temporary file per task. Fedora's sudo has no requiretty.
# Async tasks and file transfers still use temporary files, which the base
# role's acl package makes readable to an unprivileged become_user.
pipelining = True
