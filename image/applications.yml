---
- name: Prepare the complete offline application payload in the disposable builder
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../inventory/group_vars/all.yml
  vars:
    primary_user: cybex-seed
    primary_group: cybex-seed
    primary_home: /home/cybex-seed
    config_repo: /home/builder/source
  pre_tasks:
    - name: Create the disposable application seed account
      ansible.builtin.user:
        name: "{{ primary_user }}"
        home: "{{ primary_home }}"
        shell: /bin/bash

    - name: Read the seed account identity for application handlers
      ansible.builtin.getent:
        database: passwd
        key: "{{ primary_user }}"

    - name: Install application installer prerequisites
      ansible.builtin.dnf:
        name: [flatpak, gnupg2, curl, unzip, tar, zstd, fontconfig, java-25-openjdk-devel]
        state: present

    - name: Create application ownership state
      ansible.builtin.file:
        path: /var/lib/cybexos/features
        state: directory
        mode: "0755"

    - name: Create application seed directories
      ansible.builtin.file:
        path: "{{ primary_home }}/{{ item }}"
        state: directory
        owner: "{{ primary_user }}"
        group: "{{ primary_group }}"
        mode: "0755"
      loop: [.local/bin, .config/voxtype, .config/nvim]

    - name: Install the default dictation configuration before model setup
      ansible.builtin.copy:
        src: ../roles/dotfiles/files/voxtype.toml
        dest: "{{ primary_home }}/.config/voxtype/config.toml"
        owner: "{{ primary_user }}"
        group: "{{ primary_group }}"
        mode: "0644"

  roles:
    - apps

  tasks:
    - name: Install the T3 Code download helper
      ansible.builtin.template:
        src: ../roles/dotfiles/templates/t3code-update.j2
        dest: "{{ primary_home }}/.local/bin/t3code-update"
        owner: "{{ primary_user }}"
        group: "{{ primary_group }}"
        mode: "0755"

    - name: Include the complete T3 Code application for offline first launch
      become: true
      become_user: "{{ primary_user }}"
      ansible.builtin.command: "{{ primary_home }}/.local/bin/t3code-update"
      register: image_t3_install
      changed_when: "'CHANGED:' in image_t3_install.stdout"

    - name: Include the pinned Neovim starter
      ansible.builtin.git:
        repo: https://github.com/LazyVim/starter.git
        dest: "{{ primary_home }}/.config/nvim"
        version: "{{ lazyvim_starter_commit }}"
      become: true
      become_user: "{{ primary_user }}"
