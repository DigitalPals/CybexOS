---
- name: Fedora Hyprland and Quickshell workstation
  hosts: workstation
  gather_facts: true
  become: true
  pre_tasks:
    - name: Read the Dell product SKU for portable desktop defaults
      ansible.builtin.slurp:
        src: /sys/class/dmi/id/product_sku
      register: cybexos_product_sku_file
      failed_when: false
      check_mode: false
      tags: [always]

    - name: Detect the supported XPS 2026 desktop policy
      ansible.builtin.set_fact:
        cybexos_xps_2026: >-
          {{ ansible_facts.system_vendor | default('') == 'Dell Inc.'
             and (cybexos_product_sku_file.content | default('') | b64decode | trim) in ['0DB9', '0DBA']
             and ansible_facts.product_name | default('') is regex('(?i)(XPS (14|16)|DA14260|DA16260)')
             and ansible_facts.processor | default([]) | join(' ') is regex('(?i)(Intel.*(Ultra|X7)|Panther Lake)') }}
      tags: [always]

    - name: Validate the installation configuration schema
      ansible.builtin.assert:
        that:
          - config_schema_version | int == 1
        fail_msg: >-
          Unsupported CybexOS schema {{ config_schema_version | default('missing') }};
          run the current installer to migrate the saved configuration.
      tags: [always]

    - name: Validate the feature contract
      ansible.builtin.assert:
        that:
          - features[item] is defined
          - features[item] is boolean
        fail_msg: "features.{{ item }} must be an explicit boolean in inventory/group_vars/all.yml"
      loop:
        - tailscale
        - docker
        - podman
        - steam
        - private_hooks
        - apple_display
        - source_builds
        - local_network_services
        - developer_tools
        - connected_widgets
        - proprietary_apps
      tags: [always]

    - name: Validate feature dependencies
      ansible.builtin.assert:
        that:
          - not features.source_builds | bool or features.podman | bool
          - not features.apple_display | bool or features.private_hooks | bool
        fail_msg: >-
          source_builds requires podman, and apple_display requires
          private_hooks; make the inventory feature state internally consistent.
      tags: [always]

    - name: Validate explicit security trade-offs
      ansible.builtin.assert:
        that:
          - allow_insecure_sccache_transport is boolean
          - start_optional_hardware_services is boolean
          - manage_system_identity is boolean
          - manage_personal_dotfiles is boolean
          - desktop_autologin is boolean
          - cleanup_legacy_xps_artifacts is boolean
          - machine_keyboard_layout is string
          - machine_keyboard_layout | length > 0
          - machine_keyboard_variant is string
        fail_msg: >-
          allow_insecure_sccache_transport and start_optional_hardware_services
          must be explicit booleans; insecure transport and immediate hardware
          activation are never inferred.
      tags: [always]

    - name: Refuse unsupported operating systems
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Fedora'
          - ansible_facts.distribution_major_version == fedora_release
          - ansible_facts.architecture == 'x86_64'
        fail_msg: >-
          This playbook targets Fedora {{ fedora_release }} x86_64 only; found
          {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }}
          {{ ansible_facts.architecture }}.
      tags: [always]

    - name: Verify target user exists
      ansible.builtin.getent:
        database: passwd
        key: "{{ primary_user }}"
      tags: [always]

    - name: Move a fedora-config installation to the CybexOS names
      ansible.builtin.command:
        argv:
          - "{{ config_repo }}/scripts/migrate-legacy-names"
          - --user
          - "{{ primary_user }}"
          - --home
          - "{{ primary_home }}"
      register: cybexos_legacy_migration
      changed_when: "'CHANGED:' in cybexos_legacy_migration.stdout"
      when: not ansible_check_mode
      tags: [always]

  roles:
    - { role: base, tags: [base] }
    - { role: desktop, tags: [desktop] }
    - { role: apps, tags: [apps] }
    # Runs after apps because the XPS camera uses Fedora's RPM Fusion akmod and
    # v4l2-relayd packages. The role is safe on generic hardware and activates
    # each workaround only after its precise DMI and device gates match.
    - { role: xps-2026, tags: [xps-2026, hardware] }
    - { role: dotfiles, tags: [dotfiles] }
    # The role also removes its managed privileges/artifacts when disabled.
    - { role: private-hooks, tags: [private-hooks] }
    - { role: boot, tags: [boot] }
    # Retires files still named fedora-config once their replacements exist.
    - { role: legacy-names, tags: [legacy-names] }
    - { role: finalize, tags: [finalize] }
