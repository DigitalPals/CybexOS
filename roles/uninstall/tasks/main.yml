      .config/kitty/cybexos.conf
      .config/cybexos/gitconfig
      .ssh/config.d/cybexos.conf
      .gitconfig
      .ssh/config
      .config/user-dirs.dirs
      .npmrc
    )
    for relative in "${items[@]}"; do
      source_path="$backup/$relative"
      [[ -e $source_path || -L $source_path ]] || continue
      destination={{ primary_home | quote }}/$relative
      mkdir -p "$(dirname -- "$destination")"
      if [[ -d $source_path && ! -L $source_path ]]; then
        mkdir -p "$destination"
        cp -a -- "$source_path/." "$destination/"
      else
        cp -a -- "$source_path" "$destination"
      fi
    done
  args:
    executable: /bin/bash
  changed_when: true

- name: Preserve or remove CybexOS user state
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ primary_home }}/.local/state/cybexos"
    state: absent
  when: not cybexos_keep_user_data | bool

- name: Remove staged CybexOS source artifacts when user data is not retained
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ cybexos_data_root }}/current"
    - "{{ cybexos_data_root }}/releases"
    - "{{ cybexos_data_root }}/channel"
  when: not cybexos_keep_user_data | bool

- name: Reload systemd after unit removal
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload the user manager after unit removal
  ansible.builtin.command:
    argv: [systemctl, --user, "--machine={{ primary_user }}@.host", daemon-reload]
  changed_when: false
  failed_when: false
