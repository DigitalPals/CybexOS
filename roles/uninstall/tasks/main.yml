- name: Remove the vendor desktop runtime without touching user customization
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ cybexos_runtime_root }}"
    state: absent

- name: Remove project-owned system files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/hyprland-quickshell
    - /usr/share/wayland-sessions/hyprland-quickshell.desktop
    - /usr/local/libexec/cybexos-hyprland-session-start
    - /usr/local/libexec/cybexos-session-action
    - /usr/local/libexec/cybexos-system-snapshot
    - /usr/local/sbin/cybexos-system-snapshot
    - /usr/local/libexec/cybexos-common.sh
    - /etc/sysctl.d/60-cybexos-hardening.conf
    - /etc/systemd/system/cybexos-btrfs-scrub.service
    - /etc/systemd/system/cybexos-btrfs-scrub.timer
    - /etc/sudoers.d/10-wheel-nopasswd
    - /etc/polkit-1/rules.d/49-wheel-local.rules
    - /etc/brave/policies/managed/cybexos.json
    - /etc/fonts/conf.d/49-cybexos-defaults.conf
    - /usr/local/libexec/cybexos-github-release-install
    - /usr/local/libexec/cybexos-source-app-build
    - /usr/local/libexec/cybexos-android-sdk-update
    - /etc/tuned/profiles/xps-performance
    - /usr/local/share/xps-2026
    - /usr/local/libexec/xps-speaker-tuning
    - /usr/local/libexec/xps-haptic-touchpad
    - /usr/local/libexec/xps-fingerprint-check
    - /usr/local/libexec/xps-ipu7-build
    - /usr/local/libexec/xps-ipu7-abi-check
    - /usr/local/libexec/xps-ipu7-userspace-check
    - /usr/local/libexec/xps-ipu7-camera-init
    - /usr/local/libexec/xps-ipu7-camera-check
    - /usr/local/libexec/xps-ipu7-refresh-wireplumber
    - /usr/lib/systemd/system-sleep/xps-ipu7-camera
    - /etc/xps-haptic-touchpad.conf
    - /etc/udev/rules.d/80-xps-haptic-touchpad.rules
    - /etc/udev/rules.d/71-xps-ipu7-hide-isys.rules
    - /etc/udev/rules.d/90-xps-ipu7-psys.rules
    - /etc/modprobe.d/xps-ipu7-camera.conf
    - /etc/wireplumber/wireplumber.conf.d/90-xps-ipu7-v4l2.conf
    - /etc/v4l2-relayd.d/ipu7.conf
    - /etc/dkms/framework.conf.d/90-xps-akmods-signing.conf
