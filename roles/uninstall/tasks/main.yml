    - /etc/systemd/system/xps-ipu7-camera-init.service
    - /etc/systemd/system/xps-ipu7-camera.service
    - /etc/systemd/system/xps-ipu7-camera-resume.service
    - /etc/systemd/system/v4l2-relayd@ipu7.service.d/override.conf

# Recovery points themselves stay: they are data on the user's filesystem and
# `cybexos-system-snapshot` can be reinstalled to restore from them.
- name: Remove recovery booting from the boot chain
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/grub.d/42_cybexos_recovery
    - /etc/kernel/install.d/95-cybexos-recovery.install
    - /etc/systemd/system/cybexos-recovery-refresh.service
    - /usr/lib/dracut/modules.d/90cybexos-recovery
    - /etc/dracut.conf.d/90-cybexos-recovery.conf
    - /boot/grub2/cybexos-recovery.cfg
    - /run/cybexos-snapshots
  register: uninstall_recovery_boot

- name: Rebuild grub.cfg without the recovery submenu
  ansible.builtin.command:
    cmd: grub2-mkconfig -o /boot/grub2/grub.cfg
    removes: /boot/grub2/grub.cfg
  changed_when: true
  when: uninstall_recovery_boot.results[0] is changed

- name: Rebuild initramfs images without the recovery overlay module
  ansible.builtin.command: dracut --regenerate-all --force
  changed_when: true
  when: uninstall_recovery_boot.results[3] is changed or uninstall_recovery_boot.results[4] is changed

- name: Remove the managed mpv defaults
  ansible.builtin.blockinfile:
    path: /etc/mpv/mpv.conf
    marker: "# {mark} CYBEXOS MANAGED DEFAULTS"
    state: absent
  failed_when: false

- name: Inspect system configuration preserved before XPS adoption
  ansible.builtin.stat:
    path: "/var/lib/cybexos/backups/system/{{ item }}"
  loop:
    - etc/tuned/ppd.conf
    - etc/v4l2-relayd.d/icamerasrc.conf
  register: uninstall_xps_system_backups

- name: Restore system configuration preserved before XPS adoption
  ansible.builtin.copy:
    src: "/var/lib/cybexos/backups/system/{{ item.item }}"
    dest: "/{{ item.item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ uninstall_xps_system_backups.results }}"
  loop_control:
    label: "/{{ item.item }}"
  when: item.stat.exists

- name: Restart TuneD PPD after restoring its vendor configuration
  ansible.builtin.systemd_service:
    name: tuned-ppd.service
    state: restarted
    daemon_reload: true
  when:
    - uninstall_xps_system_backups.results[0].stat.exists
    - not ansible_check_mode

- name: Restore shared system configuration preserved before first adoption
  ansible.builtin.shell: |
    set -euo pipefail
    backup=/var/lib/cybexos/backups/system
    marker=/var/lib/cybexos/backups/initial-system.complete
    absent=/var/lib/cybexos/backups/initial-system.absent
    [[ -f $marker ]] || exit 0
    items=(
      etc/gdm/custom.conf
      var/lib/AccountsService/users/{{ primary_user | quote }}
      etc/sudoers.d/10-wheel-nopasswd
      etc/polkit-1/rules.d/49-wheel-local.rules
    )
    for relative in "${items[@]}"; do
      destination=/$relative
      if [[ -e $backup/$relative || -L $backup/$relative ]]; then
        install -d -m 0755 "$(dirname -- "$destination")"
        cp -a -- "$backup/$relative" "$destination"
      elif [[ -f $absent ]] && grep -Fqx -- "$relative" "$absent"; then
        rm -f -- "$destination"
      fi
    done
  args:
    executable: /bin/bash
  changed_when: true

- name: Restore the login manager preserved before SDDM adoption
  ansible.builtin.shell: |
    set -euo pipefail
    backup=/var/lib/cybexos/backups/login
    marker=/var/lib/cybexos/backups/login-initial.complete
    absent=/var/lib/cybexos/backups/login-initial.absent
    [[ -f $marker ]] || exit 0
    items=(
      etc/systemd/system/display-manager.service
      etc/sddm.conf
      etc/pam.d/sddm-autologin
      etc/systemd/system/sddm.service.d/50-cybexos.conf
      etc/cybexos/login.json
      usr/libexec/cybexos-login-prepare
    )
    for relative in "${items[@]}"; do
      destination=/$relative
      if [[ -e $backup/$relative || -L $backup/$relative ]]; then
        install -d -m 0755 "$(dirname -- "$destination")"
        rm -f -- "$destination"
        cp -a -- "$backup/$relative" "$destination"
        restorecon -F "$destination"
      elif grep -Fqx -- "$relative" "$absent"; then
        rm -f -- "$destination"
      fi
    done
    # Only empty project-created directories are removed. Preserve unrelated
    # SDDM drop-ins and all running login sessions; restore the next-boot alias.
    rmdir /etc/systemd/system/sddm.service.d 2>/dev/null || true
    rm -f /run/cybexos-login/autologin-used /run/cybexos-login/prepare.lock /run/cybexos-login/status.json
    rmdir /run/cybexos-login 2>/dev/null || true
  args:
    executable: /bin/bash
  changed_when: true
  when: not ansible_check_mode

- name: Restore first-adoption NetworkManager profile zones
  ansible.builtin.shell: |
    set -euo pipefail
    state=/var/lib/cybexos/firewall/profiles
    [[ -d $state ]] || exit 0
    while IFS= read -r -d '' marker; do
      uuid=${marker##*/}
      [[ $uuid =~ ^[0-9A-Fa-f-]{36}$ ]] || continue
      current=$(nmcli -g connection.zone connection show "$uuid" 2>/dev/null) || continue
      [[ $current == "$MANAGED_ZONE" ]] || continue
      prior=$(<"$marker")
      nmcli connection modify "$uuid" connection.zone "$prior"
      printf '%s\n' "$uuid"
    done < <(find "$state" -mindepth 1 -maxdepth 1 -type f -print0)
  args:
    executable: /bin/bash
  environment:
    MANAGED_ZONE: "{{ firewall_zone }}"
  register: uninstall_restored_firewall_profiles
  changed_when: uninstall_restored_firewall_profiles.stdout_lines | length > 0

- name: Find physical NetworkManager profiles still assigned to the project zone
  ansible.builtin.shell: |
    set -o pipefail
    nmcli -t -f UUID,TYPE connection show |
      while IFS=: read -r uuid type; do
        case "$type" in
          802-3-ethernet|802-11-wireless)
            zone=$(nmcli -g connection.zone connection show "$uuid")
            [[ $zone == {{ firewall_zone | quote }} ]] && printf '%s\n' "$uuid"
            ;;
        esac
      done
  args:
    executable: /bin/bash
  register: uninstall_remaining_firewall_profiles
  changed_when: false
  failed_when: false

- name: Clear unrecorded project-zone bindings from physical profiles
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ item }}"
      - connection.zone
      - ""
  loop: "{{ uninstall_remaining_firewall_profiles.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item }}"
  changed_when: true

- name: Read active physical network devices before firewall restoration
  ansible.builtin.shell: |
    set -o pipefail
    LC_ALL=C nmcli -t -f DEVICE,TYPE,STATE device status |
      awk -F: '($2 == "ethernet" || $2 == "wifi") && $3 == "connected" {print $1}'
  args:
    executable: /bin/bash
  register: uninstall_active_physical_devices
  changed_when: false
  failed_when: false

- name: Reapply restored firewall bindings without reconnecting
  ansible.builtin.command:
    argv:
      - nmcli
      - device
      - reapply
      - "{{ item }}"
  loop: "{{ uninstall_active_physical_devices.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  failed_when: false
  when: >-
    uninstall_restored_firewall_profiles.changed or
    uninstall_remaining_firewall_profiles.stdout_lines | default([]) | length > 0

- name: Read the first-adoption default firewalld zone
  ansible.builtin.command: cat /var/lib/cybexos/firewall/default-zone
  register: uninstall_saved_default_firewall_zone
  changed_when: false
  failed_when: false

- name: Read the default firewalld zone before removal
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: uninstall_default_firewall_zone
  changed_when: false
  failed_when: false

- name: Select the recorded or safe fallback default firewall zone
  ansible.builtin.set_fact:
    uninstall_restore_default_firewall_zone: >-
      {{ (uninstall_saved_default_firewall_zone.rc == 0 and
          (uninstall_saved_default_firewall_zone.stdout | trim)
            is regex('^[A-Za-z0-9_-]+$'))
         | ternary(uninstall_saved_default_firewall_zone.stdout | trim, 'public') }}

- name: Restore the first-adoption default zone before removing the project zone
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - "--set-default-zone={{ uninstall_restore_default_firewall_zone }}"
  when: uninstall_default_firewall_zone.stdout | default('') | trim == firewall_zone
  changed_when: true

- name: Remove the project firewalld zone after changing the default
  ansible.builtin.file:
    path: "/etc/firewalld/zones/{{ firewall_zone }}.xml"
    state: absent

- name: Reload firewalld after project-zone removal
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false
  failed_when: false

- name: Remove CybexOS system state when it is not retained
  ansible.builtin.file:
    path: /var/lib/cybexos
    state: absent
  when: not cybexos_keep_user_data | bool

- name: Remove the project-built XPS camera package
  ansible.builtin.dnf:
    name: xps-ipu7-camera-stack
    state: absent

- name: Read the active Plymouth theme
  ansible.builtin.command: plymouth-set-default-theme
  register: uninstall_plymouth_theme
  changed_when: false
  failed_when: false

- name: Restore Fedora's default Plymouth theme when Cybex is active
  ansible.builtin.command: plymouth-set-default-theme -R bgrt
  register: uninstall_plymouth_reset
  changed_when: true
  when: uninstall_plymouth_theme.stdout | default('') | trim == 'cybex'

- name: Remove the project-installed Plymouth theme and caches
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/plymouth/themes/cybex
    - /var/cache/cybexos-upstream/omarchy-cybex
    - /var/lib/cybexos-upstream/omarchy-cybex

- name: Remove only the CybexOS Firefox policy entry
  ansible.builtin.command: /usr/local/libexec/cybexos-firefox-policy disable
  changed_when: false
  failed_when: false

- name: Remove the Firefox policy editor after cleanup
  ansible.builtin.file:
    path: /usr/local/libexec/cybexos-firefox-policy
    state: absent

- name: Restore user configuration preserved before first adoption
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    backup={{ (primary_home + '/.local/state/cybexos/backups/initial') | quote }}
