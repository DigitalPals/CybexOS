---
- name: Restore agent skill discovery slots preserved before adoption
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command:
    argv:
      - "{{ config_repo }}/scripts/manage-agent-skills"
      - uninstall
      - --home
      - "{{ primary_home }}"
  register: uninstall_agent_skills
  changed_when: >-
    (uninstall_agent_skills.stdout | default('')) is match('^CHANGED:')

- name: Stop CybexOS user services
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - "--machine={{ primary_user }}@.host"
      - disable
      - --now
      - "{{ item }}"
  loop:
    - quickshell.service
    - hypridle.service
    - hyprpolkitagent.service
    - voxtype.service
    - external-monitor-toggle.service
    - hermes-menubar-bridge.service
    - cybexos-session-lock.service
    - xps-speaker-tuning.service
  changed_when: false
  failed_when: false

- name: Stop and disable project-owned system units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - cybexos-btrfs-scrub.timer
    - cybexos-recovery-refresh.service
    - xps-haptic-touchpad.service
    - xps-ipu7-camera-init.service
    - xps-ipu7-camera.service
    - xps-ipu7-camera-resume.service
  failed_when: false

- name: Remove the managed Kitty include
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.blockinfile:
    path: "{{ primary_home }}/.config/kitty/kitty.conf"
    marker: "# {mark} CYBEXOS MANAGED INCLUDE"
    state: absent
  failed_when: false

- name: Remove the managed Git include
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.blockinfile:
    path: "{{ primary_home }}/.gitconfig"
    marker: "# {mark} CYBEXOS MANAGED INCLUDE"
    state: absent
  failed_when: false

- name: Remove the managed SSH include
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.blockinfile:
    path: "{{ primary_home }}/.ssh/config"
    marker: "# {mark} CYBEXOS MANAGED INCLUDE"
    state: absent
  failed_when: false

- name: Remove project-owned user files and directories
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ primary_home }}/.config/fish/conf.d/50-cybexos.fish"
    - "{{ primary_home }}/.config/kitty/cybexos.conf"
    - "{{ primary_home }}/.config/fastfetch/config.jsonc"
    - "{{ primary_home }}/.config/voxtype/config.toml"
    - "{{ primary_home }}/.config/oh-my-posh/EDM115-newline2.omp.json"
    - "{{ primary_home }}/.config/mimeapps.list"
    - "{{ primary_home }}/.config/user-dirs.dirs"
    - "{{ primary_home }}/.npmrc"
    - "{{ primary_home }}/.config/cybexos/gitconfig"
    - "{{ primary_home }}/.ssh/config.d/cybexos.conf"
    - "{{ primary_home }}/.config/environment.d/10-cybexos.conf"
    - "{{ primary_home }}/.config/environment.d/10-xps.conf"
    - "{{ primary_home }}/.config/xdg-desktop-portal/hyprland-portals.conf"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target"
    - "{{ primary_home }}/.config/systemd/user/quickshell.service"
