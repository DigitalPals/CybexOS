---
- name: Install Fedora BGRT Plymouth theme support
  ansible.builtin.dnf:
    name:
      - plymouth-plugin-two-step
      # Fedora's bgrt.plymouth definition is shipped here; the rendering
      # plugin alone is insufficient on a minimal/Cloud installation.
      - plymouth-theme-spinner
    state: present

- name: Install optional Cybex Plymouth script theme support
  ansible.builtin.dnf:
    name: plymouth-plugin-script
    state: present
  when: plymouth_theme == 'cybex'

- name: Checkout pinned Cybex Plymouth artwork
  ansible.builtin.git:
    repo: https://github.com/DigitalPals/omarchy-cybex.git
    dest: /var/cache/cybexos-upstream/omarchy-cybex
    version: e76c323ed69baf0efae12b2e7afb42635920607a
    force: true
  register: boot_cybex_source
  when: plymouth_theme == 'cybex' and not ansible_check_mode

- name: Inspect the cached Cybex source tree
  ansible.builtin.stat:
    path: /var/cache/cybexos-upstream/omarchy-cybex/config/plymouth/themes/cybex
  register: boot_cybex_source_tree
  when: plymouth_theme == 'cybex'

- name: Verify pinned Cybex source revision # noqa command-instead-of-module
  ansible.builtin.command: git -C /var/cache/cybexos-upstream/omarchy-cybex rev-parse HEAD
  register: boot_cybex_revision
  changed_when: false
  check_mode: false
  failed_when: boot_cybex_revision.stdout != 'e76c323ed69baf0efae12b2e7afb42635920607a'
  when:
    - plymouth_theme == 'cybex'
    - boot_cybex_source_tree.stat.isdir | default(false)

- name: Inspect the pinned Cybex source manifest
  ansible.builtin.command:
    argv:
      - find
      - /var/cache/cybexos-upstream/omarchy-cybex/config/plymouth/themes/cybex
      - -mindepth
      - "1"
      - "("
      - -type
      - f
      - -o
      - -type
      - l
      - ")"
      - -printf
      - "%P\n"
  register: boot_cybex_source_files
  changed_when: false
  check_mode: false
  when:
    - plymouth_theme == 'cybex'
    - boot_cybex_source_tree.stat.isdir | default(false)

- name: Inspect the pinned Cybex source directory manifest
  ansible.builtin.command:
    argv:
      - find
      - /var/cache/cybexos-upstream/omarchy-cybex/config/plymouth/themes/cybex
      - -depth
      - -mindepth
      - "1"
      - -type
      - d
      - -printf
      - "%P\n"
  register: boot_cybex_source_directories
  changed_when: false
  check_mode: false
  when:
    - plymouth_theme == 'cybex'
    - boot_cybex_source_tree.stat.isdir | default(false)

- name: Inspect the installed Cybex theme directory
  ansible.builtin.stat:
    path: /usr/share/plymouth/themes/cybex
  register: boot_cybex_installed_tree
  when: plymouth_theme == 'cybex'

- name: Create the Cybex theme directory before exact-tree reconciliation
  ansible.builtin.file:
    path: /usr/share/plymouth/themes/cybex
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: plymouth_theme == 'cybex'

- name: Inspect the installed Cybex theme tree
  ansible.builtin.command:
    argv:
      - find
      - /usr/share/plymouth/themes/cybex
      - -mindepth
      - "1"
      - "("
      - -type
      - f
      - -o
      - -type
      - l
      - ")"
      - -printf
      - "%P\n"
  register: boot_cybex_installed_files
  changed_when: false
  check_mode: false
  when:
    - plymouth_theme == 'cybex'
    - boot_cybex_installed_tree.stat.isdir | default(false)
    - boot_cybex_source_tree.stat.isdir | default(false)

- name: Inspect the installed Cybex directory tree
  ansible.builtin.command:
    argv:
      - find
      - /usr/share/plymouth/themes/cybex
      - -depth
      - -mindepth
      - "1"
      - -type
      - d
      - -printf
      - "%P\n"
  register: boot_cybex_installed_directories
  changed_when: false
  check_mode: false
  when:
    - plymouth_theme == 'cybex'
    - boot_cybex_installed_tree.stat.isdir | default(false)
    - boot_cybex_source_tree.stat.isdir | default(false)

- name: Remove files outside the current Cybex source and override manifest
  ansible.builtin.file:
    path: "/usr/share/plymouth/themes/cybex/{{ item }}"
    state: absent
  loop: >-
    {{ boot_cybex_installed_files.stdout_lines | default([])
       | difference((boot_cybex_source_files.stdout_lines | default([])) + boot_cybex_override_files)
       | sort }}
  loop_control:
    label: "{{ item }}"
  notify: Rebuild Fedora initramfs
  when:
    - plymouth_theme == 'cybex'
    - boot_cybex_source_tree.stat.isdir | default(false)

- name: Remove directories outside the current Cybex source and override manifest
  ansible.builtin.file:
    path: "/usr/share/plymouth/themes/cybex/{{ item }}"
    state: absent
  # find -depth returns children before parents, so a removed upstream subtree
  # is reconciled without leaving empty directories behind.
  loop: >-
    {{ boot_cybex_installed_directories.stdout_lines | default([])
       | reject('in', (boot_cybex_source_directories.stdout_lines | default([])) + boot_cybex_override_directories)
       | list }}
  loop_control:
    label: "{{ item }}"
  notify: Rebuild Fedora initramfs
  when:
    - plymouth_theme == 'cybex'
    - boot_cybex_source_tree.stat.isdir | default(false)

- name: Create directories from the Cybex source manifest
  ansible.builtin.file:
    path: "/usr/share/plymouth/themes/cybex/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ boot_cybex_source_directories.stdout_lines | default([]) | reverse | list }}"
  loop_control:
    label: "{{ item }}"
  when:
    - plymouth_theme == 'cybex'
    - boot_cybex_source_tree.stat.isdir | default(false)

- name: Install non-overridden Cybex Plymouth theme files
  ansible.builtin.copy:
    remote_src: true
    src: "/var/cache/cybexos-upstream/omarchy-cybex/config/plymouth/themes/cybex/{{ item }}"
    dest: "/usr/share/plymouth/themes/cybex/{{ item }}"
    owner: root
    group: root
    mode: preserve
    force: true
  loop: >-
    {{ boot_cybex_source_files.stdout_lines | default([])
       | difference(boot_cybex_override_files)
       | sort }}
  loop_control:
    label: "{{ item }}"
  register: boot_cybex_install
  notify: Rebuild Fedora initramfs
  when:
    - plymouth_theme == 'cybex'
    - boot_cybex_source_tree.stat.isdir | default(false)

- name: Install custom Cybex theme files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/share/plymouth/themes/cybex/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ boot_cybex_override_files }}"
  notify: Rebuild Fedora initramfs
  when: plymouth_theme == 'cybex'

- name: Create Cybex deployment state directory
  ansible.builtin.file:
    path: /var/lib/cybexos-upstream/omarchy-cybex
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: plymouth_theme == 'cybex'

- name: Record the installed Cybex source and override manifest
  ansible.builtin.copy:
    dest: /var/lib/cybexos-upstream/omarchy-cybex/installed-theme.manifest
    owner: root
    group: root
    mode: "0644"
    content: |
      # upstream e76c323ed69baf0efae12b2e7afb42635920607a
      {% for path in boot_cybex_source_files.stdout_lines | sort %}
      upstream {{ path }}
      {% endfor %}
      {% for path in boot_cybex_source_directories.stdout_lines | sort %}
      upstream-dir {{ path }}
      {% endfor %}
      {% for path in boot_cybex_override_files | sort %}
      override {{ path }}
      {% endfor %}
  when: plymouth_theme == 'cybex' and not ansible_check_mode

- name: Read active Plymouth theme
  ansible.builtin.command: plymouth-set-default-theme
  register: boot_plymouth_theme
  changed_when: false
  check_mode: false

- name: Select the configured Plymouth theme without touching GRUB or EFI
  ansible.builtin.command:
    argv:
      - plymouth-set-default-theme
      - "{{ plymouth_theme }}"
  changed_when: true
  when: boot_plymouth_theme.stdout | trim != plymouth_theme and not ansible_check_mode
  notify: Rebuild Fedora initramfs
