  - gamemode
  - mangohud

# OpenAI publishes this key inside the signed ChatGPT installer rather than at
# a standalone URL. Keep the reviewed key in-tree and require its full
# fingerprint before trusting packages or repository metadata.
apps_chatgpt_repository_key_fingerprint: 3BFA0E4AE8B8CC16A2D9BA684A3B4A566C4660E4

# Vendor keys are downloaded as pinned bytes and then fingerprint-checked
# before any repository can consume them. Key rotation is an inventory review,
# not an unattended trust expansion.
apps_vendor_repo_keys:
  - name: brave-browser
    url: https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    checksum: sha256:bf978bd03e49f6006568d99f620763bf43a6455f6209dff791f52ebc6239f738
    fingerprint: DBF1A116C220B8C7164F98230686B78420038257
    enabled: "{{ features.proprietary_apps | bool }}"
  - name: 1password
    url: https://downloads.1password.com/linux/keys/1password.asc
    checksum: sha256:f39e7dd9dedc581ced85732832f217e0de5860a3b80279b5af4bc7c6d8157bae
    fingerprint: 3FEF9748469ADBE15DA7CA80AC2D62742012EA22
    enabled: "{{ features.proprietary_apps | bool }}"
  - name: tailscale
    url: https://pkgs.tailscale.com/stable/fedora/repo.gpg
    checksum: sha256:53c6f7dfbd774839d9f37e6c5022ba952108aba9a0e556a56f292a9eb605d7cf
    fingerprint: 2596A99EAAB33821893C0A79458CA832957F5868
    enabled: "{{ features.tailscale | bool }}"

