---
- name: Import RPM Fusion release-package signing keys
  ansible.builtin.rpm_key:
    key: "https://download1.rpmfusion.org/{{ item.scope }}/fedora/RPM-GPG-KEY-rpmfusion-{{ item.scope }}-fedora-2020"
    fingerprint:
      - "{{ item.fingerprint }}"
    state: present
  loop:
    - scope: free
      fingerprint: E9A491A3DE247814E7E067EAE06F8ECDD651FF2E
    - scope: nonfree
      fingerprint: 79BDB88F9BBF73910FD4095B6A2AF96194843C65

- name: Enable RPM Fusion free repository
  ansible.builtin.dnf:
    name: "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ fedora_release }}.noarch.rpm"
    state: present
    disable_gpg_check: false
  register: apps_rpmfusion_free

- name: Enable RPM Fusion nonfree repository
  ansible.builtin.dnf:
    name: "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ fedora_release }}.noarch.rpm"
    state: present
    disable_gpg_check: false
  register: apps_rpmfusion_nonfree

- name: Download checksum-pinned vendor repository keys
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/etc/pki/rpm-gpg/CYBEXOS-{{ item.name }}.asc"
    checksum: "{{ item.checksum }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ apps_vendor_repo_keys }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.enabled | bool
    - not ansible_check_mode
  register: apps_vendor_repo_key_downloads
  tags: [browser]

- name: Import fingerprint-verified vendor package keys
  ansible.builtin.rpm_key:
    key: "/etc/pki/rpm-gpg/CYBEXOS-{{ item.name }}.asc"
    fingerprint:
      - "{{ item.fingerprint }}"
    state: present
  loop: "{{ apps_vendor_repo_keys }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.enabled | bool
    - not ansible_check_mode
  tags: [browser]

- name: Install the reviewed ChatGPT repository key
  ansible.builtin.copy:
    src: chatgpt-repository-key.asc
    dest: /etc/pki/rpm-gpg/RPM-GPG-KEY-chatgpt
    owner: root
    group: root
    mode: "0644"
  register: apps_chatgpt_repo_key
  when: features.proprietary_apps | bool
  tags: [browser]

- name: Import the fingerprint-verified ChatGPT package key
  ansible.builtin.rpm_key:
    key: /etc/pki/rpm-gpg/RPM-GPG-KEY-chatgpt
    fingerprint:
      - "{{ apps_chatgpt_repository_key_fingerprint }}"
    state: present
  when:
    - features.proprietary_apps | bool
    - not ansible_check_mode
  register: apps_chatgpt_rpm_key
  tags: [browser]

- name: Install enabled signed vendor repository definitions
  ansible.builtin.copy:
    src: "{{ item }}.repo"
    dest: "/etc/yum.repos.d/{{ item }}.repo"
    owner: root
    group: root
    mode: "0644"
  loop:
    - brave-browser
    - 1password
    - chatgpt
  register: apps_vendor_repos
  when: features.proprietary_apps | bool
  tags: [browser]

- name: Remove disabled signed vendor repository definitions and keys
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/yum.repos.d/brave-browser.repo
    - /etc/yum.repos.d/1password.repo
    - /etc/yum.repos.d/chatgpt.repo
    - /etc/pki/rpm-gpg/CYBEXOS-brave-browser.asc
    - /etc/pki/rpm-gpg/CYBEXOS-1password.asc
    - /etc/pki/rpm-gpg/RPM-GPG-KEY-chatgpt
  register: apps_retired_proprietary_repos
  when:
    - not features.proprietary_apps | bool
    - apps_feature_owned.proprietary_apps | bool
  tags: [browser]

- name: Remove imported proprietary package keys when disabled
  ansible.builtin.rpm_key:
    key: "{{ item.fingerprint }}"
    state: absent
  loop: "{{ apps_vendor_repo_keys | rejectattr('name', 'equalto', 'tailscale') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not features.proprietary_apps | bool
    - apps_feature_owned.proprietary_apps | bool
    - not ansible_check_mode
  tags: [browser]

- name: Remove imported ChatGPT package key when disabled
  ansible.builtin.rpm_key:
    key: "{{ apps_chatgpt_repository_key_fingerprint }}"
    state: absent
  when:
    - not features.proprietary_apps | bool
    - apps_feature_owned.proprietary_apps | bool
    - not ansible_check_mode
  tags: [browser]

- name: Converge the optional Tailscale repository definition
  ansible.builtin.copy:
    src: tailscale.repo
    dest: /etc/yum.repos.d/tailscale.repo
    owner: root
    group: root
    mode: "0644"
  when: features.tailscale | bool
  register: apps_tailscale_repo

- name: Remove the imported Tailscale package key when disabled
  ansible.builtin.rpm_key:
    key: "{{ apps_vendor_repo_keys
      | selectattr('name', 'equalto', 'tailscale')
      | map(attribute='fingerprint') | first }}"
    state: absent
  when:
    - not features.tailscale | bool
    - apps_feature_owned.tailscale | bool
    - not ansible_check_mode
  register: apps_retired_tailscale_rpm_key

- name: Remove the Tailscale repository and pinned key when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/yum.repos.d/tailscale.repo
    - /etc/pki/rpm-gpg/CYBEXOS-tailscale.asc
  when:
    - not features.tailscale | bool
    - apps_feature_owned.tailscale | bool
  register: apps_retired_tailscale_repo

- name: Remove retired Google Chrome repository definition
  ansible.builtin.file:
    path: /etc/yum.repos.d/google-chrome.repo
    state: absent
  register: apps_retired_vendor_repos
  when: cleanup_legacy_xps_artifacts | bool
  tags: [browser]

- name: Refresh DNF metadata after repository changes
  ansible.builtin.command: dnf -q -y makecache
  changed_when: true
  when:
    - not ansible_check_mode
    - (apps_rpmfusion_free is defined and apps_rpmfusion_free is changed)
      or (apps_rpmfusion_nonfree is defined and apps_rpmfusion_nonfree is changed)
      or (apps_chatgpt_repo_key is defined and apps_chatgpt_repo_key is changed)
      or (apps_chatgpt_rpm_key is defined and apps_chatgpt_rpm_key is changed)
      or (apps_vendor_repos is defined and apps_vendor_repos is changed)
      or (apps_tailscale_repo is defined and apps_tailscale_repo is changed)
      or (apps_retired_tailscale_rpm_key is defined and apps_retired_tailscale_rpm_key is changed)
      or (apps_retired_tailscale_repo is defined and apps_retired_tailscale_repo is changed)
      or (apps_retired_vendor_repos is defined and apps_retired_vendor_repos is changed)
      or (apps_retired_proprietary_repos is defined and apps_retired_proprietary_repos is changed)
  tags: [browser]
