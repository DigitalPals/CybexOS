---
- name: Inspect CybexOS ownership of optional application groups
  ansible.builtin.stat:
    path: "/var/lib/cybexos/features/{{ item }}"
  loop:
    - developer_tools
    - connected_widgets
    - podman
    - steam
    - proprietary_apps
    - tailscale
    - source_builds
  register: apps_feature_marker_stats

- name: Record optional application ownership state
  ansible.builtin.set_fact:
    apps_feature_owned: >-
      {{ apps_feature_owned | default({})
         | combine({item.item: item.stat.exists}) }}
  loop: "{{ apps_feature_marker_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

# One package database read lets the network- and transaction-bound tasks
# below skip work whose package state already holds.
- name: Read the installed package inventory
  ansible.builtin.package_facts:
    manager: rpm
  tags: [browser]

- name: Configure package repositories
  ansible.builtin.import_tasks: repos.yml

- name: Install distribution packages
  ansible.builtin.import_tasks: packages.yml

- name: Install Flatpak applications
  ansible.builtin.import_tasks: flatpaks.yml

- name: Install upstream release applications
  ansible.builtin.import_tasks: upstream.yml

- name: Install the default text and Markdown editor
  ansible.builtin.import_tasks: omawrite.yml
  tags: [omawrite]

- name: Configure Omarchy font defaults
  ansible.builtin.import_tasks: fonts.yml
  tags: [fonts, font-defaults]

- name: Install the Android SDK
  ansible.builtin.import_tasks: android.yml
  when: features.developer_tools | bool

- name: Configure developer tooling
  ansible.builtin.import_tasks: devtools.yml
  when: features.developer_tools | bool

- name: Record CybexOS ownership of selected optional application groups
  ansible.builtin.copy:
    dest: "/var/lib/cybexos/features/{{ item }}"
    content: "managed\n"
    owner: root
    group: root
    mode: "0644"
  loop:
    - developer_tools
    - connected_widgets
    - podman
    - steam
    - proprietary_apps
    - tailscale
    - source_builds
  when: features[item] | bool

- name: Retire optional application ownership after deselection
  ansible.builtin.file:
    path: "/var/lib/cybexos/features/{{ item }}"
    state: absent
  loop:
    - developer_tools
    - connected_widgets
    - podman
    - steam
    - proprietary_apps
    - tailscale
    - source_builds
  when:
    - not features[item] | bool
    - apps_feature_owned[item] | bool
