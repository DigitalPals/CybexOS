---
- name: Install Android SDK update helper
  ansible.builtin.template:
    src: android-sdk-update.j2
    dest: /usr/local/libexec/cybexos-android-sdk-update
    owner: root
    group: root
    mode: "0755"

- name: Install or update command-line Android SDK
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command: /usr/local/libexec/cybexos-android-sdk-update
  register: apps_android_update
  changed_when: (apps_android_update.stdout | regex_search('(?m)^CHANGED:')) is not none
  failed_when: false
  when: not ansible_check_mode

- name: Report Android SDK update failure after verified retention
  ansible.builtin.debug:
    msg: "Android SDK update failed; installed SDK retained: {{ apps_android_update.stderr | default('unknown failure') }}"
  when:
    - not ansible_check_mode
    - apps_android_update.rc | default(0) | int == 75

- name: Refuse an Android SDK failure without verified retention
  ansible.builtin.fail:
    msg: >-
      Android SDK installation or rollback failed without a verified complete
      SDK to retain: {{ apps_android_update.stderr | default('unknown failure') }}
  when:
    - not ansible_check_mode
    - apps_android_update.rc | default(0) | int not in [0, 75]
