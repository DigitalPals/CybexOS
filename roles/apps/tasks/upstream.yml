---
- name: Install shared installer helper library
  ansible.builtin.copy:
    src: cybexos-common.sh
    dest: /usr/local/libexec/cybexos-common.sh
    owner: root
    group: root
    mode: "0644"

- name: Install verified upstream release helper
  ansible.builtin.copy:
    src: github-release-install
    dest: /usr/local/libexec/cybexos-github-release-install
    owner: root
    group: root
    mode: "0755"

- name: Create pinned font cache directories
  ansible.builtin.file:
    path: "/var/cache/cybexos-upstream/{{ item.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ pinned_font_archives }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [fonts]

- name: Download verified pinned font archives
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/var/cache/cybexos-upstream/{{ item.name }}/{{ item.version }}.zip"
    checksum: "{{ item.checksum }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ pinned_font_archives }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  when:
    - not ansible_check_mode
    - item.enabled | default(true) | bool
  tags: [fonts]

- name: Inspect checksum-addressed pinned font extractions
  ansible.builtin.shell: >-
    test -f {{ apps_pinned_font_archive_marker | quote }} &&
    test -f {{ apps_pinned_font_archive_payload | quote }}
  args:
    executable: /bin/bash
  vars:
    apps_pinned_font_archive_root: >-
      /usr/local/share/fonts/{{ item.name }}/{{ item.version }}
    apps_pinned_font_archive_marker: >-
      {{ apps_pinned_font_archive_root }}/.cybexos-archive-{{ item.checksum | regex_replace('^sha256:', '') }}
    apps_pinned_font_archive_payload: >-
      {{ apps_pinned_font_archive_root }}/{{ item.expected_font }}
  register: apps_pinned_font_archive_health
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ pinned_font_archives }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  tags: [fonts]

- name: Remove stale pinned font extraction trees
  ansible.builtin.file:
    path: "/usr/local/share/fonts/{{ item.item.name }}/{{ item.item.version }}"
    state: absent
  loop: "{{ apps_pinned_font_archive_health.results }}"
  loop_control:
    label: "{{ item.item.name }} {{ item.item.version }}"
  when:
    - not ansible_check_mode
    - item.rc | int != 0
  tags: [fonts]

- name: Create pinned font version directories
  ansible.builtin.file:
    path: "/usr/local/share/fonts/{{ item.name }}/{{ item.version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ pinned_font_archives }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  tags: [fonts]

- name: Install pinned fonts with their bundled license notices
  ansible.builtin.unarchive:
    src: "/var/cache/cybexos-upstream/{{ item.name }}/{{ item.version }}.zip"
    dest: "/usr/local/share/fonts/{{ item.name }}/{{ item.version }}"
    remote_src: true
    creates: "/usr/local/share/fonts/{{ item.name }}/{{ item.version }}/.cybexos-archive-{{ item.checksum | regex_replace('^sha256:', '') }}"
  register: apps_pinned_font_install
  loop: "{{ pinned_font_archives }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  when: not ansible_check_mode
  tags: [fonts]

- name: Verify pinned font archives contain their expected font
  ansible.builtin.stat:
    path: "/usr/local/share/fonts/{{ item.name }}/{{ item.version }}/{{ item.expected_font }}"
  register: apps_pinned_font_payloads
  loop: "{{ pinned_font_archives }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  when: not ansible_check_mode
  tags: [fonts]

- name: Refuse pinned font archives without their expected payload
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: >-
      {{ item.item.name }} {{ item.item.version }} did not install expected font
      {{ item.item.expected_font }}
  loop: "{{ apps_pinned_font_payloads.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }} {{ item.item.version }}"
  when:
    - not ansible_check_mode
    - not (item.skipped | default(false) | bool)
  tags: [fonts]

- name: Record checksum-addressed pinned font extraction state
  ansible.builtin.copy:
    content: "{{ item.checksum }}\n"
    dest: "/usr/local/share/fonts/{{ item.name }}/{{ item.version }}/.cybexos-archive-{{ item.checksum | regex_replace('^sha256:', '') }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ pinned_font_archives }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  when: not ansible_check_mode
  tags: [fonts]

- name: Normalize pinned font ownership and permissions
  ansible.builtin.file:
    path: "/usr/local/share/fonts/{{ item.name }}/{{ item.version }}"
    state: directory
    recurse: true
    owner: root
    group: root
    mode: "u=rwX,g=rX,o=rX"
  loop: "{{ pinned_font_archives }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  when: not ansible_check_mode
  tags: [fonts]

- name: Create pinned single-file font directories
  ansible.builtin.file:
    path: "/usr/local/share/fonts/{{ item.name }}/{{ item.version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ pinned_font_files }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  tags: [fonts]

# Upstream publishes these as bare variable TTFs rather than archives, so they
# land straight in the font directory. The checksum is what pins them; the URL
# already names a commit, so a moved tag cannot change what installs.
- name: Install pinned single-file fonts
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/usr/local/share/fonts/{{ item.name }}/{{ item.version }}/{{ item.filename }}"
    checksum: "{{ item.checksum }}"
    owner: root
    group: root
    mode: "0644"
  register: apps_pinned_font_file_install
  loop: "{{ pinned_font_files }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  when: not ansible_check_mode
  tags: [fonts]

- name: Install pinned single-file font licenses
  ansible.builtin.get_url:
    url: "{{ item.license_url }}"
    dest: "/usr/local/share/fonts/{{ item.name }}/{{ item.version }}/{{ item.license_filename }}"
    checksum: "{{ item.license_checksum }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ pinned_font_files }}"
  loop_control:
    label: "{{ item.name }} license"
  when: not ansible_check_mode
  tags: [fonts]

- name: Refresh font cache after pinned font installs
  ansible.builtin.command: fc-cache -f
  changed_when: true
  notify: Restart Quickshell after installing fonts
  when:
    - not ansible_check_mode
    - (apps_pinned_font_install.results | default([])
       | selectattr('changed', 'defined') | selectattr('changed') | list | length > 0)
      or (apps_pinned_font_file_install.results | default([])
       | selectattr('changed', 'defined') | selectattr('changed') | list | length > 0)
  tags: [fonts]

- name: Remove retired Walker and Elephant installations and caches
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/walker
    - /usr/local/bin/elephant
    - /usr/local/libexec/xps-elephant-install
    - /opt/cybexos-apps/walker
    - /opt/cybexos-apps/elephant
    - /var/cache/cybexos-upstream/walker
    - /var/cache/cybexos-upstream/elephant
    - /var/lib/cybexos-upstream/walker
    - /var/lib/cybexos-upstream/elephant
    - /tmp/elephant.sock
  when: cleanup_legacy_xps_artifacts | bool

- name: Install source build helper
  ansible.builtin.copy:
    src: source-app-build
    dest: /usr/local/libexec/cybexos-source-app-build
    owner: root
    group: root
    mode: "0755"

- name: Validate immutable GitHub release authorization
  ansible.builtin.assert:
    that:
      - item.version is defined
      - item.version | string | length > 0
      - item.checksum is defined
      - item.checksum is regex('^sha256:[0-9a-fA-F]{64}$')
    fail_msg: >-
      {{ item.name }} requires an inventory-pinned release tag and SHA-256;
      moving "latest release" installs are not authorized.
  loop: "{{ github_release_apps + nerd_font_apps }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate source-build authorization pins
  ansible.builtin.assert:
    that:
      - item.tag is defined
      - item.tag | string | length > 0
      - item.commit is regex('^[0-9a-fA-F]{40}$')
    fail_msg: "{{ item.name }} requires an inventory-pinned tag and full commit"
  loop: "{{ source_apps }}"
  loop_control:
    label: "{{ item.name }}"

# The installers below are network-bound and independent; launch them all as
# async jobs, then collect. Real change/failure status is applied at collection.
- name: Launch upstream application installs
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/cybexos-github-release-install
      - "{{ item.name }}"
      - "{{ item.repo }}"
      - "{{ item.asset_regex }}"
      - "{{ item.kind }}"
      - "{{ item.version | default('') }}"
      - "{{ item.checksum | default('') }}"
  async: 900
  poll: 0
  register: apps_upstream_jobs
  changed_when: false
  loop: "{{ github_release_apps + nerd_font_apps }}"
  loop_control:
    label: "{{ item.name }}"
  environment:
    GH_TOKEN: "{{ lookup('env', 'GH_TOKEN') | default('', true) }}"
  when:
    - not ansible_check_mode
    - item.enabled | default(true) | bool

- name: Launch source-only application builds
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/cybexos-source-app-build
      - "{{ item.name }}"
      - "{{ item.repo_url }}"
      - "{{ item.binary_names | join(',') }}"
      - "{{ item.tag }}"
      - "{{ item.commit }}"
      - "{{ source_build_container_image }}"
  async: 2400
  poll: 0
  register: apps_source_jobs
  changed_when: false
  loop: "{{ source_apps }}"
  loop_control:
    label: "{{ item.name }}"
  when: features.source_builds | bool and not ansible_check_mode

- name: Collect upstream application installs
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  register: apps_upstream_install
  until: apps_upstream_install.finished
  # Poll every second so an unchanged converge is not held up to five seconds
  # per job; the retry budget still covers the 900 second async limit.
  retries: 1000
  delay: 1
  changed_when: (apps_upstream_install.stdout | default('') | regex_search('(?m)^CHANGED:')) is not none
  failed_when: false
  loop: "{{ apps_upstream_jobs.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - not ansible_check_mode
    - item.ansible_job_id is defined

- name: Collect source-only application builds
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  register: apps_source_build
  until: apps_source_build.finished
  # Covers the 2400 second async build limit at one-second polling.
  retries: 2500
  delay: 1
  changed_when: (apps_source_build.stdout | default('') | regex_search('(?m)^CHANGED:')) is not none
  failed_when: false
  loop: "{{ apps_source_jobs.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - not ansible_check_mode
    - item.ansible_job_id is defined

- name: Report upstream update failures that retained previous versions
  ansible.builtin.debug:
    msg: "{{ item.item.item.name }} update failed; previous version retained: {{ item.stderr | default('unknown failure') }}"
  loop: "{{ (apps_upstream_install.results | default([])) + (apps_source_build.results | default([])) }}"
  loop_control:
    label: "{{ item.item.item.name | default('unknown') }}"
  when: item.rc | default(0) == 75

- name: Refuse a failed first installation of a required upstream application
  ansible.builtin.fail:
    msg: >-
      Required first installation of {{ item.item.item.name | default('unknown') }}
      failed: {{ item.stderr | default('installer exited without diagnostics') }}
  loop: "{{ (apps_upstream_install.results | default([])) + (apps_source_build.results | default([])) }}"
  loop_control:
    label: "{{ item.item.item.name | default('unknown') }}"
  when:
    - not ansible_check_mode
    - not (item.skipped | default(false) | bool)
    - >-
      not (item.finished | default(false) | bool)
      or (item.rc | default(1) | int) not in [0, 75]

- name: Trigger a Voxtype restart after a successful release update
  ansible.builtin.command: /usr/bin/true
  changed_when: true
  notify: Restart Voxtype after updates
  when:
    - apps_upstream_install.results | default([])
      | selectattr('changed', 'defined') | selectattr('changed')
      | selectattr('item.item.name', 'equalto', 'voxtype') | list | length > 0

- name: Refresh font cache
  ansible.builtin.command: fc-cache -f
  changed_when: true
  when:
    - not ansible_check_mode
    - apps_upstream_install.results | default([])
      | selectattr('changed', 'defined') | selectattr('changed')
      | selectattr('item.item.kind', 'equalto', 'font') | list | length > 0

- name: Inspect source-built command links before owned cleanup
  ansible.builtin.stat:
    path: "/usr/local/bin/{{ item.1 }}"
    follow: false
  register: apps_source_command_links
  loop: "{{ source_apps | subelements('binary_names') }}"
  loop_control:
    label: "{{ item.1 }}"
  when:
    - not features.source_builds | bool
    - apps_feature_owned.source_builds | bool

- name: Remove unchanged CybexOS source-built command links
  ansible.builtin.file:
    path: "/usr/local/bin/{{ item.item.1 }}"
    state: absent
  loop: "{{ apps_source_command_links.results | default([]) }}"
  loop_control:
    label: "{{ item.item.1 }}"
  when:
    - not (item.skipped | default(false) | bool)
    - item.stat.islnk | default(false)
    - >-
      item.stat.lnk_source ==
      '/opt/cybexos-builds/' ~ item.item.0.name ~ '/current/bin/' ~ item.item.1

- name: Remove developer-only upstream applications when developer tooling is disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/lazygit
    - /usr/local/bin/lazydocker
    - /usr/local/bin/mdview
    - /usr/local/bin/bun
    - /usr/local/bin/balena
    - /opt/cybexos-apps/lazygit
    - /opt/cybexos-apps/lazydocker
    - /opt/cybexos-apps/mdview
    - /opt/cybexos-apps/bun
    - /opt/cybexos-apps/balena
  when:
    - not features.developer_tools | bool
    - apps_feature_owned.developer_tools | bool

- name: Remove source-build deployments when source builds are disabled
  ansible.builtin.file:
    path: "/opt/cybexos-builds/{{ item.name }}"
    state: absent
  loop: "{{ source_apps }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not features.source_builds | bool
    - apps_feature_owned.source_builds | bool
