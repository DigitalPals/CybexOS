---
- name: Record the feature-dependent Fedora package contract
  ansible.builtin.set_fact:
    apps_desired_required_fedora_packages: >-
      {{ apps_required_fedora_packages
         + (features.developer_tools | bool | ternary(apps_developer_fedora_packages, []))
         + (features.podman | bool | ternary(apps_podman_packages, []))
         + (features.steam | bool | ternary(apps_steam_packages, [])) }}

# Installed optional packages need no repository query.
- name: Record optional packages that are not installed yet
  ansible.builtin.set_fact:
    apps_missing_optional_fedora_packages: >-
      {{ apps_optional_fedora_packages
         | reject('in', ansible_facts.packages | default({}))
         | list }}

- name: Resolve optional packages available for Fedora 44
  ansible.builtin.command:
    argv: "{{ ['dnf', '-q', 'repoquery', '--available', '--qf', '%{name}\\n'] + apps_missing_optional_fedora_packages }}"
  register: apps_available_package_query
  changed_when: false
  check_mode: false
  when: apps_missing_optional_fedora_packages | length > 0

- name: Record available and unavailable package names
  ansible.builtin.set_fact:
    apps_available_fedora_packages: >-
      {{ apps_missing_optional_fedora_packages
         | intersect(apps_available_package_query.stdout_lines | default([])) }}
    apps_unavailable_optional_fedora_packages: >-
      {{ apps_missing_optional_fedora_packages
         | difference(apps_available_package_query.stdout_lines | default([])) }}

- name: Report optional packages absent from enabled repositories
  ansible.builtin.debug:
    msg: "Optional Fedora package is unavailable and was skipped: {{ item }}"
  loop: "{{ apps_unavailable_optional_fedora_packages }}"

# One transaction for the required set and newly available optional packages:
# every dnf run reloads all repository metadata.
- name: Install the required Fedora and RPM Fusion application packages
  ansible.builtin.dnf:
    name: "{{ apps_desired_required_fedora_packages + apps_available_fedora_packages }}"
    state: present
    allowerasing: true

# The package's /etc/mpv holds no configuration; mpv reads this file before
# ~/.config/mpv/mpv.conf, so a personal choice still wins. The block sits at
# the top so an administrator's own lines below it win as well.
- name: Prefer reliable hardware video decoding in mpv
  ansible.builtin.blockinfile:
    path: /etc/mpv/mpv.conf
    create: true
    owner: root
    group: root
    mode: "0644"
    insertbefore: BOF
    marker: "# {mark} CYBEXOS MANAGED DEFAULTS"
    block: |
      # Fedora's mpv decodes video in software by default. auto-safe uses only
      # hardware decoders that mpv considers reliable and falls back to
      # software for anything else.
      hwdec=auto-safe

- name: Disable system Podman activation when Podman is disabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  failed_when: false
  loop:
    - podman.socket
    - podman-auto-update.timer
  when:
    - not features.podman | bool
    - apps_feature_owned.podman | bool
    - not ansible_check_mode

- name: Stop system Podman services when Podman is disabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  failed_when: false
  loop:
    - podman.service
    - podman-restart.service
  when:
    - not features.podman | bool
    - apps_feature_owned.podman | bool
    - not ansible_check_mode

- name: Disable user Podman activation when Podman is disabled
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
  failed_when: false
  loop:
    - podman.socket
    - podman-auto-update.timer
  when:
    - not features.podman | bool
    - apps_feature_owned.podman | bool
    - not ansible_check_mode

- name: Stop user Podman services when Podman is disabled
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
  failed_when: false
  loop:
    - podman.service
    - podman-restart.service
  when:
    - not features.podman | bool
    - apps_feature_owned.podman | bool
    - not ansible_check_mode

- name: Remove disabled Podman and Steam package families
  ansible.builtin.dnf:
    name: "{{ item.packages }}"
    state: absent
  loop:
    - { enabled: "{{ features.podman }}", packages: "{{ apps_podman_packages }}", label: Podman }
    - { enabled: "{{ features.steam }}", packages: "{{ apps_steam_packages }}", label: Steam }
  loop_control:
    label: "{{ item.label }}"
  when:
    - not item.enabled | bool
    - >-
      (item.label == 'Podman' and apps_feature_owned.podman | bool)
      or (item.label == 'Steam' and apps_feature_owned.steam | bool)
  notify:
    - Reload systemd after application package removal
    - Reload user systemd after application package removal

- name: Install Steam 32-bit graphics userspace
  ansible.builtin.dnf:
    name:
      - mesa-dri-drivers.i686
      - mesa-vulkan-drivers.i686
      - vulkan-loader.i686
    state: present
  when: features.steam | bool and not ansible_check_mode

- name: Remove Steam 32-bit graphics userspace when Steam is disabled
  ansible.builtin.dnf:
    name:
      - mesa-dri-drivers.i686
      - mesa-vulkan-drivers.i686
      - vulkan-loader.i686
    state: absent
  when:
    - not features.steam | bool
    - apps_feature_owned.steam | bool

- name: Install signed vendor applications
  ansible.builtin.dnf:
    name:
      - brave-origin
      - 1password
      - 1password-cli
      - chatgpt
    state: present
  when:
    - features.proprietary_apps | bool
    - not ansible_check_mode
  tags: [browser]

- name: Replace standard Brave with Brave Origin
  ansible.builtin.dnf:
    name: brave-browser
    state: absent
    autoremove: false
  when:
    - features.proprietary_apps | bool
    - not ansible_check_mode
    - "'brave-browser' in (ansible_facts.packages | default({'brave-browser': []}))"
  tags: [browser]

- name: Remove optional signed vendor applications when disabled
  ansible.builtin.dnf:
    name:
      - brave-origin
      - brave-browser
      - 1password
      - 1password-cli
      - chatgpt
    state: absent
  when:
    - not features.proprietary_apps | bool
    - apps_feature_owned.proprietary_apps | bool
    - not ansible_check_mode
  tags: [browser]

- name: Stop and disable Tailscale before removing it
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: false
    state: stopped
  failed_when: false
  when:
    - not features.tailscale | bool
    - apps_feature_owned.tailscale | bool
    - not ansible_check_mode

- name: Install the Tailscale package when selected
  ansible.builtin.dnf:
    name: tailscale
    state: present
  when:
    - features.tailscale | bool
    - not ansible_check_mode

- name: Remove the CybexOS-owned Tailscale package when deselected
  ansible.builtin.dnf:
    name: tailscale
    state: absent
  when:
    - not features.tailscale | bool
    - apps_feature_owned.tailscale | bool
    - not ansible_check_mode

- name: Remove retired Google Chrome package
  ansible.builtin.dnf:
    name: google-chrome-stable
    state: absent
  when:
    - cleanup_legacy_xps_artifacts | bool
    - not ansible_check_mode
  tags: [browser]

- name: Enable Tailscale without authorizing the node
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true
    state: started
  when: features.tailscale | bool and not ansible_check_mode
