---
- name: Create wallpaper and shell preference directories
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ primary_home }}/Pictures/Wallpapers"
    - "{{ primary_home }}/.config/cybexos"

- name: Install bundled wallpapers
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: "{{ config_repo }}/assets/wallpapers/"
    dest: "{{ primary_home }}/Pictures/Wallpapers/"
    mode: "0644"
    force: false

- name: Seed shell preferences only when the file is absent
  become: true
  become_user: "{{ primary_user }}"
  cybexos_managed_file:
    dest: "{{ primary_home }}/.config/cybexos/shell.json"
    mode: "0600"
    seed_only: true
    # The ISO copies this same document only if absent. Empty selections,
    # sparse overrides and future/corrupt documents all belong to the user.
    content: "{{ cybexos_desktop_contract.shell | to_nice_json }}\n"
