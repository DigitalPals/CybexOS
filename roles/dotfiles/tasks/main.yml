---
- name: Install bundled wallpapers and initialize the selection
  ansible.builtin.import_tasks: wallpapers.yml
  tags: [wallpapers]

- name: Create managed user directories
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ primary_home }}/Code"
    - "{{ primary_home }}/Pictures/Wallpapers"
    - "{{ primary_home }}/Pictures/Screenshots"
    - "{{ primary_home }}/Videos/Screen Recordings"
    - "{{ primary_home }}/.local/bin"
    - "{{ primary_home }}/.local/share/applications"
    - "{{ primary_home }}/.local/share/nautilus-python/extensions"
    - "{{ primary_home }}/.config/environment.d"
    - "{{ primary_home }}/.config/fish/conf.d"
    - "{{ primary_home }}/.config/kitty"
    - "{{ primary_home }}/.config/fastfetch"
    - "{{ primary_home }}/.config/oh-my-posh"
    - "{{ primary_home }}/.config/voxtype"
    - "{{ primary_home }}/.config/distrobox"
    - "{{ primary_home }}/.config/cybexos"
    - "{{ primary_home }}/.ssh"
    - "{{ primary_home }}/.ssh/config.d"
  tags: [browser]

- name: Inspect the initial personal-configuration backup marker
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.stat:
    path: "{{ primary_home }}/.local/state/cybexos/backups/initial-personal.complete"
  register: dotfiles_initial_backup_marker
  when: manage_personal_dotfiles | bool

- name: Preserve pre-existing personal configuration before adoption
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    backup={{ (primary_home + '/.local/state/cybexos/backups/initial') | quote }}
    mkdir -p "$backup"
    for relative in \
      .config/fish/config.fish \
      .config/kitty/kitty.conf \
      .config/fastfetch/config.jsonc \
      .config/voxtype/config.toml \
      .config/oh-my-posh/EDM115-newline2.omp.json \
      .config/mimeapps.list \
      .config/fish/conf.d/50-cybexos.fish \
      .config/kitty/cybexos.conf \
      .config/cybexos/gitconfig \
      .ssh/config.d/cybexos.conf \
      .gitconfig \
      .ssh/config \
      .config/user-dirs.dirs \
      .npmrc; do
      source_path={{ primary_home | quote }}/$relative
      [[ -e $source_path || -L $source_path ]] || continue
      parent=$(dirname -- "$relative")
      mkdir -p "$backup/$parent"
      cp -a -- "$source_path" "$backup/$relative"
    done
    touch {{ (primary_home + '/.local/state/cybexos/backups/initial-personal.complete') | quote }}
  args:
    executable: /bin/bash
  when:
    - manage_personal_dotfiles | bool
    - not dotfiles_initial_backup_marker.stat.exists
    - not ansible_check_mode

- name: Install desktop and CybexOS user helpers
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: "{{ config_repo }}/assets/scripts/{{ item }}"
    dest: "{{ primary_home }}/.local/bin/{{ item }}"
    mode: "0755"
  loop:
    - screenshot
    - screen-record
    - quickshell-reminder
    - screen-ocr
    - clipboard-copy-image
    - clipboard-image-to-file
    - clipboard-history-store
    - localsend
    - localsend-share
    - cybexos-agent

- name: Install the CybexOS command
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: cybex.j2
    dest: "{{ primary_home }}/.local/bin/cybex"
    mode: "0755"

- name: Create the CybexOS release store
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ primary_home }}/.local/share/cybexos/releases"
    state: directory
    mode: "0755"

- name: Snapshot the initial checkout into the managed release store
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    source_tree={{ config_repo | quote }}
    release_store={{ (primary_home + '/.local/share/cybexos/releases') | quote }}
    staging=$(mktemp -d "$release_store/.bootstrap.XXXXXX")
    cleanup() { rm -rf -- "$staging"; }
    trap cleanup EXIT
    if git -C "$source_tree" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
      # A checkout snapshot is built only from committed files. This avoids
      # accidentally carrying unrelated untracked files or local secrets into
      # the long-lived updater source tree.
      git -C "$source_tree" archive --format=tar HEAD |
        tar --extract --file - --directory "$staging"
    else
      # GitHub release archives are already assembled from a tagged Git tree.
      tar --create --file - --directory "$source_tree" \
          --exclude=.ansible --exclude=dist . |
        tar --extract --file - --directory "$staging"
    fi
    destination="$release_store/bootstrap"
    mode_manifest() {
      (cd -- "$1" && find . -mindepth 1 -printf '%P\t%y\t%m\t%l\n' |
        LC_ALL=C sort)
    }
    if [[ -d $destination ]] \
        && diff --brief --recursive -- "$staging" "$destination" >/dev/null \
        && cmp -s <(mode_manifest "$staging") <(mode_manifest "$destination"); then
      exit 0
    fi
    rm -rf -- "$destination"
    mv -- "$staging" "$destination"
    staging=
    printf 'CHANGED: refreshed bootstrap source snapshot\n'
  args:
    executable: /bin/bash
  when:
    - not (config_repo | regex_search('/[.]local/share/cybexos/releases/'))
    - not ansible_check_mode
  changed_when: "'CHANGED:' in dotfiles_bootstrap_snapshot.stdout"
  register: dotfiles_bootstrap_snapshot

- name: Point the initial active source at the managed bootstrap snapshot
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    src: releases/bootstrap
    dest: "{{ primary_home }}/.local/share/cybexos/current"
    state: link
    force: true
  when: >-
    not (config_repo | regex_search('/[.]local/share/cybexos/releases/'))

- name: Inspect the canonical skill in the active CybexOS release
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.stat:
    path: "{{ primary_home }}/.local/share/cybexos/current/agent-skills/cybexos"
    follow: true
  register: dotfiles_active_agent_skill

- name: Provision CybexOS agent skill discovery links
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command:
    argv:
      - "{{ config_repo }}/scripts/manage-agent-skills"
      - provision
      - --home
      - "{{ primary_home }}"
      - --canonical
      - "{{ primary_home }}/.local/share/cybexos/current/agent-skills/cybexos"
  register: dotfiles_agent_skill_provision
  changed_when: >-
    (dotfiles_agent_skill_provision.stdout | default('')) is match('^CHANGED:')
  when:
    - not ansible_check_mode
    - dotfiles_active_agent_skill.stat.isdir | default(false)

- name: Install Fedora-specific user helpers
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: "{{ item.name }}.j2"
    dest: "{{ primary_home }}/.local/bin/{{ item.name }}"
    mode: "0755"
  loop:
    - { name: brightness-control, enabled: true }
    - { name: portal-launcher, enabled: true }
    - { name: t3code-update, enabled: "{{ features.connected_widgets }}" }
    - { name: t3code-desktop, enabled: "{{ features.connected_widgets }}" }
    - { name: spotify, enabled: true }
    - { name: app-backup, enabled: true }
    - { name: fastfetch-link-speed, enabled: true }
  loop_control:
    label: "{{ item.name }}"
  when: item.enabled | bool
  tags: [browser]

- name: Install the external monitor policy helper
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: external-monitor-toggle.j2
    dest: "{{ primary_home }}/.local/bin/external-monitor-toggle"
    mode: "0755"
  notify: Restart external monitor watcher after helper updates
  when: cybexos_xps_2026 | default(false) | bool

- name: Install Distrobox container initialization hook
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: dev-distrobox-init
    dest: "{{ primary_home }}/.local/bin/dev-distrobox-init"
    mode: "0755"
  when: features.podman | bool

- name: Install or update T3Code nightly
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command: "{{ primary_home }}/.local/bin/t3code-update"
  register: dotfiles_t3code_update
  changed_when: (dotfiles_t3code_update.stdout | regex_search('(?m)^CHANGED:')) is not none
  failed_when: false
  environment:
    GH_TOKEN: "{{ lookup('env', 'GH_TOKEN') | default('', true) }}"
  when:
    - features.connected_widgets | bool
    - not ansible_check_mode

- name: Report a failed T3Code nightly update after verified retention
  ansible.builtin.debug:
    msg: "T3Code update failed; installed nightly retained: {{ dotfiles_t3code_update.stderr | default('unknown failure') }}"
  when:
    - features.connected_widgets | bool
    - not ansible_check_mode
    - dotfiles_t3code_update.rc | default(0) | int == 75

- name: Refuse a T3Code nightly failure without verified retention
  ansible.builtin.fail:
    msg: >-
      T3Code nightly installation or rollback failed without a verified prior
      AppImage to retain: {{ dotfiles_t3code_update.stderr | default('unknown failure') }}
  when:
    - features.connected_widgets | bool
    - not ansible_check_mode
    - dotfiles_t3code_update.rc | default(0) | int not in [0, 75]

- name: Remove CybexOS T3 helpers after connected widgets are deselected
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ primary_home }}/.local/bin/t3code-update"
    - "{{ primary_home }}/.local/bin/t3code-desktop"
    - "{{ primary_home }}/.local/share/t3code-nightly"
  when:
    - not features.connected_widgets | bool
    - apps_feature_owned.connected_widgets | default(false) | bool

- name: Keep browser-backup compatibility command
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    src: app-backup
    dest: "{{ primary_home }}/.local/bin/browser-backup"
    state: link

- name: Configure Distrobox to provision lazily created development boxes
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    dest: "{{ primary_home }}/.config/distrobox/distrobox.conf"
    mode: "0644"
    content: |
      container_init_hook="{{ primary_home }}/.local/bin/dev-distrobox-init"
  when: features.podman | bool

- name: Validate immutable Distrobox image authorization
  ansible.builtin.assert:
    that:
      - item.name is regex('^[a-z0-9-]+$')
      - item.source_tag | string | length > 0
      - item.image is regex('^[^\s@]+@sha256:[0-9a-fA-F]{64}$')
    fail_msg: >-
      Distrobox {{ item.name | default('entry') }} requires a fully qualified,
      digest-pinned image and the reviewed source tag used to resolve it.
  loop: "{{ distrobox_images }}"
  loop_control:
    label: "{{ item.name | default('invalid entry') }}"
  when: features.podman | bool

- name: Install Distrobox lazy launchers
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: distrobox-shell.j2
    dest: "{{ primary_home }}/.local/bin/dev-{{ item.name }}-shell"
    mode: "0755"
  loop: "{{ distrobox_images }}"
  loop_control:
    label: "{{ item.name }} from {{ item.source_tag }}"
  when: features.podman | bool

- name: Remove managed Distrobox launchers and hooks when Podman is disabled
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ primary_home }}/.local/bin/dev-distrobox-init"
    - "{{ primary_home }}/.local/bin/dev-fedora-shell"
    - "{{ primary_home }}/.local/bin/dev-arch-shell"
    - "{{ primary_home }}/.local/bin/dev-debian-shell"
    - "{{ primary_home }}/.config/distrobox/distrobox.conf"
  when:
    - not features.podman | bool
    - apps_feature_owned.podman | default(false) | bool

- name: Install Nautilus LocalSend extension
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: "{{ config_repo }}/assets/nautilus-localsend.py"
    dest: "{{ primary_home }}/.local/share/nautilus-python/extensions/localsend.py"
    mode: "0644"

- name: Install Fish shell configuration
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: fish-config.fish
    dest: "{{ primary_home }}/.config/fish/conf.d/50-cybexos.fish"
    mode: "0644"
  when: manage_personal_dotfiles | bool
  tags: [shell-defaults]

- name: Install application configuration
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ primary_home }}/{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - { src: kitty.conf, dest: .config/kitty/cybexos.conf }
    - { src: fastfetch.jsonc, dest: .config/fastfetch/config.jsonc }
  when: manage_personal_dotfiles | bool

- name: Include the managed Kitty fragment without replacing user configuration
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.blockinfile:
    path: "{{ primary_home }}/.config/kitty/kitty.conf"
    create: true
    backup: true
    mode: "0644"
    marker: "# {mark} CYBEXOS MANAGED INCLUDE"
    block: "include cybexos.conf"
  when: manage_personal_dotfiles | bool

- name: Install Voxtype configuration
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: voxtype.toml
    dest: "{{ primary_home }}/.config/voxtype/config.toml"
    mode: "0644"
  notify: Restart Voxtype after configuration updates
  when: manage_personal_dotfiles | bool

- name: Install Oh My Posh theme from the active configuration
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: "{{ config_repo }}/assets/EDM115-newline2.omp.json"
    dest: "{{ primary_home }}/.config/oh-my-posh/EDM115-newline2.omp.json"
    mode: "0644"
  when: manage_personal_dotfiles | bool

- name: Configure environment variables
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: environment.conf.j2
    dest: "{{ primary_home }}/.config/environment.d/10-cybexos.conf"
    mode: "0644"
  tags: [browser]

- name: Remove the retired XPS-named environment fragment
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ primary_home }}/.config/environment.d/10-xps.conf"
    state: absent
  when: cleanup_legacy_xps_artifacts | bool
  tags: [browser]

- name: Install optional managed Git preferences
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    dest: "{{ primary_home }}/.config/cybexos/gitconfig"
    mode: "0644"
    content: |
      [core]
        pager = delta
      [interactive]
        diffFilter = delta --color-only
      [delta]
        navigate = true
        side-by-side = true
      [credential "https://github.com"]
        helper =
        helper = !/usr/bin/gh auth git-credential
      [credential "https://gist.github.com"]
        helper =
        helper = !/usr/bin/gh auth git-credential
  when: manage_personal_dotfiles | bool

- name: Include managed Git preferences without replacing user identity
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.blockinfile:
    path: "{{ primary_home }}/.gitconfig"
    create: true
    backup: true
    mode: "0644"
    marker: "# {mark} CYBEXOS MANAGED INCLUDE"
    block: |
      [include]
        path = ~/.config/cybexos/gitconfig
  when: manage_personal_dotfiles | bool

- name: Configure SSH to use the 1Password agent without private key references
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    dest: "{{ primary_home }}/.ssh/config.d/cybexos.conf"
    mode: "0600"
    content: |
      Host *
        IdentityAgent ~/.1password/agent.sock
        StrictHostKeyChecking accept-new
        HashKnownHosts yes
  when:
    - manage_personal_dotfiles | bool
    - features.proprietary_apps | bool

- name: Include managed SSH preferences without replacing existing hosts
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.blockinfile:
    path: "{{ primary_home }}/.ssh/config"
    create: true
    backup: true
    mode: "0600"
    insertbefore: BOF
    marker: "# {mark} CYBEXOS MANAGED INCLUDE"
    block: "Include ~/.ssh/config.d/cybexos.conf"
  when:
    - manage_personal_dotfiles | bool
    - features.proprietary_apps | bool

- name: Remove the CybexOS SSH include when proprietary integration is deselected
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.blockinfile:
    path: "{{ primary_home }}/.ssh/config"
    marker: "# {mark} CYBEXOS MANAGED INCLUDE"
    state: absent
  failed_when: false
  when:
    - not features.proprietary_apps | bool
    - apps_feature_owned.proprietary_apps | default(false) | bool

- name: Remove the scoped SSH preferences when proprietary integration is deselected
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ primary_home }}/.ssh/config.d/cybexos.conf"
    state: absent
  when:
    - not features.proprietary_apps | bool
    - apps_feature_owned.proprietary_apps | default(false) | bool

- name: Configure XDG user directories
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    dest: "{{ primary_home }}/.config/user-dirs.dirs"
    mode: "0644"
    content: |
      XDG_DESKTOP_DIR="$HOME/"
      XDG_DOWNLOAD_DIR="$HOME/Downloads"
      XDG_TEMPLATES_DIR="$HOME/"
      XDG_PUBLICSHARE_DIR="$HOME/"
      XDG_DOCUMENTS_DIR="$HOME/Documents"
      XDG_MUSIC_DIR="$HOME/"
      XDG_PICTURES_DIR="$HOME/Pictures"
      XDG_VIDEOS_DIR="$HOME/"
      XDG_CODE_DIR="$HOME/Code"
  when: manage_personal_dotfiles | bool

- name: Install MIME defaults and desktop launchers
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: "{{ item.name }}"
    dest: "{{ primary_home }}/.local/share/applications/{{ item.name }}"
    mode: "0644"
  loop:
    - { name: nvim-kitty.desktop, enabled: "{{ features.developer_tools }}" }
    - { name: brave-origin.desktop, enabled: "{{ features.proprietary_apps }}" }
    - { name: chatgpt.desktop, enabled: "{{ features.proprietary_apps }}" }
  loop_control:
    label: "{{ item.name }}"
  when: item.enabled | bool
  tags: [browser]

- name: Install 1Password launcher using the current upstream desktop ID
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: com.onepassword.OnePassword.desktop
    dest: "{{ primary_home }}/.local/share/applications/com.onepassword.OnePassword.desktop"
    mode: "0644"
  when: features.proprietary_apps | bool
  tags: [browser, onepassword]

- name: Retire the legacy 1Password launcher to avoid duplicate application entries
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ primary_home }}/.local/share/applications/1password.desktop"
    state: absent
  when: features.proprietary_apps | bool
  tags: [browser, onepassword]

- name: Retire the standard Brave launcher after switching to Origin
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ primary_home }}/.local/share/applications/brave-browser.desktop"
    state: absent
  when: features.proprietary_apps | bool
  tags: [browser]

- name: Install user-path-aware desktop launchers
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: "{{ item.name }}.j2"
    dest: "{{ primary_home }}/.local/share/applications/{{ item.name }}"
    mode: "0644"
  loop:
    - { name: t3code-nightly.desktop, enabled: "{{ features.connected_widgets }}" }
    - { name: localsend-share-clipboard.desktop, enabled: true }
    - { name: localsend-share-file.desktop, enabled: true }
    - { name: localsend-share-folder.desktop, enabled: true }
  loop_control:
    label: "{{ item.name }}"
  when: item.enabled | bool
  tags: [browser]

- name: Install feature-aware MIME defaults
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: mimeapps.list.j2
    dest: "{{ primary_home }}/.config/mimeapps.list"
    mode: "0644"
  when: manage_personal_dotfiles | bool
  tags: [browser]

- name: Install Distrobox desktop launchers when Podman is enabled
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ primary_home }}/.local/share/applications/{{ item }}"
    mode: "0644"
  loop:
    - dev-fedora.desktop
    - dev-arch.desktop
    - dev-debian.desktop
  when: features.podman | bool
  tags: [browser]

- name: Remove managed Distrobox desktop launchers when Podman is disabled
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ primary_home }}/.local/share/applications/{{ item }}"
    state: absent
  loop:
    - dev-fedora.desktop
    - dev-arch.desktop
    - dev-debian.desktop
  when:
    - not features.podman | bool
    - apps_feature_owned.podman | default(false) | bool
  tags: [browser]

- name: Remove managed optional desktop launchers after deselection
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ primary_home }}/.local/share/applications/{{ item.name }}"
    state: absent
  loop:
    - { name: nvim-kitty.desktop, feature: developer_tools }
    - { name: t3code-nightly.desktop, feature: connected_widgets }
    - { name: brave-origin.desktop, feature: proprietary_apps }
    - { name: chatgpt.desktop, feature: proprietary_apps }
    - { name: 1password.desktop, feature: proprietary_apps }
    - { name: com.onepassword.OnePassword.desktop, feature: proprietary_apps }
  loop_control:
    label: "{{ item.name }}"
  when:
    - not features[item.feature] | bool
    - apps_feature_owned[item.feature] | default(false) | bool
  tags: [browser]

- name: Remove retired Google Chrome desktop launcher
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ primary_home }}/.local/share/applications/google-chrome.desktop"
    state: absent
  when: cleanup_legacy_xps_artifacts | bool
  tags: [browser]

- name: Refresh the per-user desktop application database
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command:
    argv:
      - update-desktop-database
      - "{{ primary_home }}/.local/share/applications"
  changed_when: false
  tags: [browser]

- name: Configure npm user prefix
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    dest: "{{ primary_home }}/.npmrc"
    mode: "0644"
    content: "prefix=${HOME}/.npm-global\n"
  when:
    - manage_personal_dotfiles | bool
    - features.developer_tools | bool

- name: Create Brave enterprise policy directory
  ansible.builtin.file:
    path: /etc/brave/policies/managed
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [browser]
  when:
    - features.proprietary_apps | bool
    - manage_personal_dotfiles | bool

- name: Configure Brave managed policies
  ansible.builtin.copy:
    dest: /etc/brave/policies/managed/cybexos.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "RestoreOnStartup": 1,
        "SpellcheckLanguage": ["{{ regional_locale.split('_')[0] | lower }}"],
        "ExtensionInstallForcelist": [
          "aeblfdkhhhdcdjpifhhbdiojplfjncoa;https://clients2.google.com/service/update2/crx"
        ]
      }
  tags: [browser]
  when:
    - features.proprietary_apps | bool
    - manage_personal_dotfiles | bool

- name: Remove CybexOS Brave policy when it is not selected
  ansible.builtin.file:
    path: /etc/brave/policies/managed/cybexos.json
    state: absent
  when: not (features.proprietary_apps | bool and manage_personal_dotfiles | bool)
  tags: [browser]

- name: Remove the retired XPS-named Brave policy
  ansible.builtin.file:
    path: /etc/brave/policies/managed/xps.json
    state: absent
  when: cleanup_legacy_xps_artifacts | bool
  tags: [browser]

- name: Remove retired Google Chrome managed policy
  ansible.builtin.file:
    path: /etc/opt/chrome/policies/managed/xps.json
    state: absent
  when: cleanup_legacy_xps_artifacts | bool
  tags: [browser]

- name: Install the scoped Firefox policy editor
  ansible.builtin.copy:
    src: manage-firefox-policy
    dest: /usr/local/libexec/cybexos-firefox-policy
    owner: root
    group: root
    mode: "0755"
  tags: [browser]

- name: Converge only the CybexOS Firefox policy entry
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/cybexos-firefox-policy
      - "{{ (features.proprietary_apps | bool and manage_personal_dotfiles | bool) | ternary('enable', 'disable') }}"
  changed_when: false
  tags: [browser]

- name: Prefer dark GTK appearance
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command: dbus-run-session gsettings set org.gnome.desktop.interface color-scheme prefer-dark
  changed_when: false
  when:
    - manage_personal_dotfiles | bool
    - not ansible_check_mode

- name: Check whether Neovim configuration already exists
  ansible.builtin.stat:
    path: "{{ primary_home }}/.config/nvim"
  register: dotfiles_neovim_config
  when:
    - features.developer_tools | bool
    - manage_personal_dotfiles | bool

- name: Validate the LazyVim starter pin
  ansible.builtin.assert:
    that: lazyvim_starter_commit is regex('^[0-9a-fA-F]{40}$')
    fail_msg: lazyvim_starter_commit must be a full immutable Git commit
  when:
    - features.developer_tools | bool
    - manage_personal_dotfiles | bool
    - not dotfiles_neovim_config.stat.exists

- name: Install LazyVim starter only when Neovim configuration is absent
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.git:
    repo: https://github.com/LazyVim/starter
    dest: "{{ primary_home }}/.config/nvim"
    version: "{{ lazyvim_starter_commit }}"
  when:
    - features.developer_tools | bool
    - manage_personal_dotfiles | bool
    - not dotfiles_neovim_config.stat.exists

- name: Restore SELinux user-home labels
  ansible.builtin.command: "restorecon -RF {{ primary_home }}/.local/bin {{ primary_home }}/.local/share/applications"
  changed_when: false
  when: not ansible_check_mode
