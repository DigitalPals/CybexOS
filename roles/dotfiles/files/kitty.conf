font_family JetBrainsMono Nerd Font
font_size 12.0
term xterm-256color
scrollback_lines 10000
window_padding_width 14
background_opacity 0.95
cursor_shape underline
cursor_shape_unfocused underline
shell_integration no-cursor
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell yes
mouse_hide_wait 1
map ctrl+insert copy_to_clipboard
map ctrl+shift+c copy_to_clipboard
map shift+insert paste_from_clipboard
map ctrl+shift+v paste_from_clipboard
# Colours. These are the shell's default dark theme, as
# roles/desktop/files/quickshell/scripts/theme_kitty.py renders it (a test keeps
# the two equal); they only show until the shell first exports its appearance.
foreground #f2f0ea
background #1a1917
selection_foreground #000000
selection_background #7a7950
cursor #d3d283
cursor_text_color #1a1917
url_color #d3d283
active_tab_foreground #1c1c12
active_tab_background #d3d283
inactive_tab_foreground #b3afa4
inactive_tab_background #201e1b
tab_bar_background #1a1917
active_border_color #d3d283
inactive_border_color #3a3936
bell_border_color #ffc26e
mark1_foreground #000000
mark1_background #d3d283
mark2_foreground #000000
mark2_background #ffc26e
mark3_foreground #000000
mark3_background #ff8f8f
color0 #302f2c
color1 #e8837a
color2 #a3c98f
color3 #d3b47e
color4 #9ecbeb
color5 #c0a8dc
color6 #6ec2b2
color7 #b3afa4
color8 #706f6b
color9 #ffb3ab
color10 #b8dba5
color11 #e5cb98
color12 #b6dcf6
color13 #d4c0ec
color14 #8fd8ca
color15 #f2f0ea

# The shell's current appearance, rewritten by theme-apply.py and applied to
# running terminals with SIGUSR1. Later values win, so it overrides the
# fallback above. `include` expands ~ and, when the file does not exist yet,
# only logs "Could not find included config file ..., ignoring". Not
# `globinclude`: it globs relative to this file's directory, and kitty 0.47's
# Python rejects an absolute pattern (NotImplementedError), which aborts loading
# the configuration. The path is theme_tokens.state_dir() with XDG_STATE_HOME
# unset, as it is in a CybexOS session.
include ~/.local/state/cybexos/theme/kitty.conf
