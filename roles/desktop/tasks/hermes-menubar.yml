---
# The menubar controls an existing remote Hermes WebUI.  It deliberately does
# not install or run Hermes Agent locally.  The first block removes the short-
# lived local runtime deployed by the original widget implementation; a marker
# makes this a one-time migration so a future user-managed install is not
# silently deleted by every workstation convergence.

- name: Inspect the retired local Hermes Agent migration marker
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.stat:
    path: >-
      {{ primary_home }}/.local/state/cybexos/migrations/hermes-agent-removed-v1
  register: hermes_agent_removal_marker
  tags: [quickshell, hermes-menubar]

- name: Remove the retired local Hermes Agent deployment once
  when:
    - cleanup_legacy_xps_artifacts | bool
    - not ansible_check_mode
    - not hermes_agent_removal_marker.stat.exists
  tags: [quickshell, hermes-menubar]
  block:
    - name: Stop and disable the retired Hermes backend
      become: true
      become_user: "{{ primary_user }}"
      ansible.builtin.systemd_service:
        name: hermes-backend.service
        enabled: false
        state: stopped
        scope: user
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
      failed_when: false

    - name: Inspect Hermes-managed Node launcher links
      become: true
      become_user: "{{ primary_user }}"
      ansible.builtin.stat:
        path: "{{ primary_home }}/.local/bin/{{ item }}"
        follow: false
      loop: [node, npm, npx]
      register: hermes_managed_node_links

    - name: Remove Hermes-managed Node launcher links
      become: true
      become_user: "{{ primary_user }}"
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        state: absent
      loop: "{{ hermes_managed_node_links.results }}"
      when:
        - item.stat.islnk | default(false)
        - >-
          item.stat.lnk_source | default('') is match(
          '^' ~ primary_home ~ '/[.]hermes/node/bin/(node|npm|npx)$')

    - name: Remove locally managed Hermes Agent files and data
      become: true
      become_user: "{{ primary_user }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/hermes-backend.service"
        - "{{ primary_home }}/.config/systemd/user/hermes-backend.service"
        - "{{ primary_home }}/.config/hermes-menubar/bridge.env"
        - "{{ primary_home }}/.local/bin/hermes"
        - "{{ primary_home }}/.local/bin/hermes-agent"
        - "{{ primary_home }}/.local/bin/hermes-acp"
        - "{{ primary_home }}/.local/share/cybexos-user-tools/hermes"
        - "{{ primary_home }}/.hermes"
      notify: Reload user systemd

    - name: Find cached Hermes Agent installers
      become: true
      become_user: "{{ primary_user }}"
      ansible.builtin.find:
        paths: "{{ primary_home }}/.cache/cybexos"
        patterns: hermes-install-*.sh
        file_type: file
      register: hermes_agent_installer_cache

    - name: Remove cached Hermes Agent installers
      become: true
      become_user: "{{ primary_user }}"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ hermes_agent_installer_cache.files }}"

    - name: Create the workstation migration-state directory
      become: true
      become_user: "{{ primary_user }}"
      ansible.builtin.file:
        path: "{{ primary_home }}/.local/state/cybexos/migrations"
        state: directory
        mode: "0700"

    - name: Record removal of the locally managed Hermes Agent
      become: true
      become_user: "{{ primary_user }}"
      ansible.builtin.copy:
        dest: >-
          {{ primary_home }}/.local/state/cybexos/migrations/hermes-agent-removed-v1
        content: "remote-only Hermes menubar migration complete\n"
        mode: "0600"

- name: Create private Hermes menubar runtime directories
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ primary_home }}/.config/systemd/user", mode: "0755" }
    - { path: "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants", mode: "0755" }
    - { path: "{{ primary_home }}/.local/libexec", mode: "0755" }
    - { path: "{{ primary_home }}/.local/state/hermes-menubar", mode: "0700" }
  tags: [quickshell, hermes-menubar]

- name: Remove the retired Hermes channel registry
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ primary_home }}/.local/state/hermes-menubar/channels.json"
    state: absent
  tags: [quickshell, hermes-menubar]

- name: Install the remote Hermes menubar bridge runtime
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: hermes-menubar-bridge/hermes_bridge.py
    dest: "{{ primary_home }}/.local/libexec/hermes-menubar-bridge"
    mode: "0755"
  notify: Restart Hermes menubar bridge
  tags: [quickshell, hermes-menubar]

- name: Install the remote Hermes menubar bridge user unit
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: hermes-menubar-bridge.service.j2
    dest: "{{ primary_home }}/.config/systemd/user/hermes-menubar-bridge.service"
    mode: "0644"
  notify:
    - Reload user systemd
    - Restart Hermes menubar bridge
  tags: [quickshell, hermes-menubar]

- name: Enable the remote Hermes bridge for the Hyprland session
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    src: ../hermes-menubar-bridge.service
    dest: >-
      {{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/hermes-menubar-bridge.service
    state: link
    force: true
  notify: Reload user systemd
  tags: [quickshell, hermes-menubar]
