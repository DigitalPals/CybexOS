---
- name: Preserve the display manager before first SDDM adoption
  ansible.builtin.shell: |
    set -euo pipefail
    backup=/var/lib/cybexos/backups/login
    marker=/var/lib/cybexos/backups/login-initial.complete
    absent=/var/lib/cybexos/backups/login-initial.absent
    install -d -m 0700 "$backup"
    temporary="$absent.new"
    : >"$temporary"
    items=(
      etc/systemd/system/display-manager.service
      etc/sddm.conf
      etc/pam.d/sddm-autologin
      etc/systemd/system/sddm.service.d/50-cybexos.conf
      etc/cybexos/login.json
      usr/libexec/cybexos-login-prepare
    )
    for relative in "${items[@]}"; do
      source_path=/$relative
      if [[ -e $source_path || -L $source_path ]]; then
        install -d -m 0700 "$backup/$(dirname -- "$relative")"
        cp -a -- "$source_path" "$backup/$relative"
      else
        printf '%s\n' "$relative" >>"$temporary"
      fi
    done
    mv -f -- "$temporary" "$absent"
    touch "$marker"
  args:
    executable: /bin/bash
    creates: /var/lib/cybexos/backups/login-initial.complete
  when: not ansible_check_mode
  # A shell-only deployment also installs runtime RPMs. Preserve package
  # defaults before that transaction even on an already adopted workstation.
  tags: [quickshell]

- name: Download the pinned Hyprland COPR signing key
  ansible.builtin.get_url:
    url: https://download.copr.fedorainfracloud.org/results/sdegler/hyprland/pubkey.gpg
    dest: /etc/pki/rpm-gpg/CYBEXOS-sdegler-hyprland-copr.gpg
    checksum: sha256:581bd602d10705eb89003680335ffc3684b922c587073b6e52c371f949843fd7
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Import the fingerprint-verified Hyprland COPR package key
  ansible.builtin.rpm_key:
    key: /etc/pki/rpm-gpg/CYBEXOS-sdegler-hyprland-copr.gpg
    fingerprint:
      - 64BBBF013D1CA5E4BE5B0552C043104207862204
    state: present
  when: not ansible_check_mode

- name: Converge the selected Hyprland COPR definition
  ansible.builtin.template:
    src: hyprland-copr.repo.j2
    dest: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:sdegler:hyprland.repo
    owner: root
    group: root
    mode: "0644"

- name: Install stable Hyprland and desktop integration packages
  ansible.builtin.dnf:
    name:
      - sddm
      - sddm-wayland-generic
      - gnome-keyring
      - gnome-keyring-pam
      - dbus-daemon
      - hyprland
      - hypridle
      - hyprlock
      - hyprpicker
      - hyprpolkitagent
      - hyprsunset
      - quickshell
      - ImageMagick
      - xdg-desktop-portal
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-hyprland
      - desktop-file-utils
      # T3 Code Nightly claims its t3code:// OAuth callback on Linux with
      # xdg-mime when the packaged client starts. That generated handler runs
      # the AppImage directly, so it also needs the legacy FUSE 2 library even
      # though our ordinary launcher can fall back to extract-and-run.
      - xdg-utils
      - fuse-libs
      - satty
      - nwg-look
      - grim
      - slurp
      - wf-recorder
      - wl-clipboard
      - wtype
      - brightnessctl
      - playerctl
      - socat
      - tesseract
      - tesseract-langpack-eng
      - hunspell-nl
      - libnotify
      - libinput-utils
      - vulkan-loader
      - vulkan-tools
      # QtWebSockets QML module for the T3 Code bar client; Fedora ships
      # the QML plugin in the -devel subpackage.
      - qt6-qtwebsockets-devel
      # Omarchy background video and media UI components.
      - qt6-qtmultimedia
      # qmllint for the quickshell QML smoke check (tests/qml-lint).
      - qt6-qtdeclarative-devel
      # Quickshell runtime helpers share this transaction because every dnf
      # run reloads all repository metadata. The Network panel keeps system
      # reads and bounded mutations in local Python helpers. List every
      # command they invoke instead of relying on a workstation package group
      # to pull it in transitively. curl and iw are also shared by weather and
      # link telemetry.
      - NetworkManager
      - NetworkManager-libnm
      - glib2
      - nm-connection-editor
      - pulseaudio-utils
      - pavucontrol
      - python3
      # Durable JSON-RPC/WebSocket transport for the Hermes menubar bridge.
      - python3-websockets
      # Native multi-file chooser used by the Hermes composer; selected files
      # are uploaded by the loopback bridge, never by QML itself.
      - zenity
      # Online Accounts stores Google OAuth credentials in the keyring;
      # Evolution Data Server exposes its calendar cache to Quickshell.
      - gnome-online-accounts
      - gnome-online-accounts-gtk
      # GNOME Calendar still opens GNOME Settings from its own account editor.
      - gnome-control-center
      - gnome-calendar
      - evolution-data-server
      - python3-gobject
      - curl
      - iw
      - qrencode
      - iproute
      - iputils
      # Fedora's authoritative post-update reboot recommendation command.
      - dnf5-plugins
    state: present
  when: not ansible_check_mode
  tags: [quickshell]

- name: Preserve Fedora's SDDM PAM default if the package was newly installed
  ansible.builtin.shell: |
    set -euo pipefail
    backup=/var/lib/cybexos/backups/login/etc/pam.d/sddm-autologin
    if [[ ! -e $backup ]] && grep -Fqx etc/pam.d/sddm-autologin \
        /var/lib/cybexos/backups/login-initial.absent; then
      install -d -m 0700 "$(dirname -- "$backup")"
      cp -a -- /etc/pam.d/sddm-autologin "$backup"
      printf 'CHANGED: preserved Fedora SDDM PAM defaults\n'
    fi
  args:
    executable: /bin/bash
  register: desktop_sddm_pam_backup
  changed_when: "'CHANGED:' in desktop_sddm_pam_backup.stdout"
  when: not ansible_check_mode
  tags: [quickshell]

- name: Inspect CybexOS ownership of connected widgets
  ansible.builtin.stat:
    path: /var/lib/cybexos/features/connected_widgets
  register: desktop_connected_widgets_marker

- name: Install the remote Hermes WebUI menubar client
  ansible.builtin.import_tasks: hermes-menubar.yml
  when: features.connected_widgets | bool
  tags: [quickshell, hermes-menubar]

- name: Stop the CybexOS Hermes client when connected widgets are deselected
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.systemd_service:
    name: hermes-menubar-bridge.service
    enabled: false
    state: stopped
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
  failed_when: false
  when:
    - not features.connected_widgets | bool
    - desktop_connected_widgets_marker.stat.exists
    - not ansible_check_mode

- name: Remove the CybexOS Hermes client when connected widgets are deselected
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ primary_home }}/.local/libexec/hermes-menubar-bridge"
    - "{{ primary_home }}/.config/systemd/user/hermes-menubar-bridge.service"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/hermes-menubar-bridge.service"
  notify: Reload user systemd
  when:
    - not features.connected_widgets | bool
    - desktop_connected_widgets_marker.stat.exists

- name: Install Fedora fuzzel and matugen rather than COPR variants
  ansible.builtin.dnf:
    name:
      - fuzzel
      - matugen
    state: present
    disablerepo:
      - _copr:copr.fedorainfracloud.org:sdegler:hyprland
  when: not ansible_check_mode

- name: Install the boot-time login policy helper
  ansible.builtin.copy:
    src: login/cybexos-login-prepare
    dest: /usr/libexec/cybexos-login-prepare
    owner: root
    group: root
    mode: "0755"

- name: Install the encrypted-autologin PAM integration
  ansible.builtin.copy:
    src: login/sddm-autologin
    dest: /etc/pam.d/sddm-autologin
    owner: root
    group: root
    mode: "0644"

- name: Create the SDDM service policy directory
  ansible.builtin.file:
    path: /etc/systemd/system/sddm.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install SDDM login policy preparation
  ansible.builtin.copy:
    src: login/50-cybexos.conf
    dest: /etc/systemd/system/sddm.service.d/50-cybexos.conf
    owner: root
    group: root
    mode: "0644"

- name: Restore login integration SELinux labels
  ansible.builtin.command:
    argv:
      - restorecon
      - -F
      - /usr/libexec/cybexos-login-prepare
      - /etc/pam.d/sddm-autologin
      - /etc/systemd/system/sddm.service.d/50-cybexos.conf
  changed_when: false
  when: not ansible_check_mode

- name: Install Hyprland Quickshell session launcher
  ansible.builtin.template:
    src: hyprland-quickshell.j2
    dest: /usr/local/bin/hyprland-quickshell
    owner: root
    group: root
    mode: "0755"

- name: Register the Hyprland Quickshell Wayland session
  ansible.builtin.copy:
    dest: /usr/share/wayland-sessions/hyprland-quickshell.desktop
    owner: root
    group: root
    mode: "0644"
    content: |
      [Desktop Entry]
      Name=Hyprland (Quickshell)
      Comment=Hyprland with Quickshell Desktop Shell
      Exec=/usr/local/bin/hyprland-quickshell
      TryExec=/usr/local/bin/hyprland-quickshell
      Type=Application
      DesktopNames=Hyprland

- name: Retire Lumen entirely
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/hyprland-lumen
    - /usr/share/wayland-sessions/hyprland-lumen.desktop
    - /usr/local/libexec/xps-lumen-compat-build
    - /usr/local/libexec/xps-lumen-launch
    - /opt/cybexos-builds/lumen-compat
    - "{{ primary_home }}/.config/systemd/user/lumen.service"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/lumen.service"
    - "{{ primary_home }}/.config/lumen"
  notify: Reload user systemd
  when: cleanup_legacy_xps_artifacts | bool

- name: Remove the Lumen package
  ansible.builtin.dnf:
    name: lumen
    state: absent
  when:
    - cleanup_legacy_xps_artifacts | bool
    - not ansible_check_mode

- name: Stop and disable retired Walker and Elephant user services
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - "--machine={{ primary_user }}@.host"
      - disable
      - --now
      - walker.service
      - elephant.service
  changed_when: false
  failed_when: false
  when:
    - cleanup_legacy_xps_artifacts | bool
    - not ansible_check_mode

- name: Remove retired Walker and Elephant user configuration and state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ primary_home }}/.config/systemd/user/walker.service"
    - "{{ primary_home }}/.config/systemd/user/elephant.service"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/walker.service"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/elephant.service"
    - "{{ primary_home }}/.config/walker"
    - "{{ primary_home }}/.config/elephant"
    - "{{ primary_home }}/.cache/walker"
    - "{{ primary_home }}/.cache/elephant"
    - "{{ primary_home }}/.local/state/walker"
    - "{{ primary_home }}/.local/state/elephant"
    - "{{ primary_home }}/.local/share/walker"
    - "{{ primary_home }}/.local/share/elephant"
  notify: Reload user systemd
  when: cleanup_legacy_xps_artifacts | bool

- name: Create desktop configuration directories
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    # Several entries are user-owned layering roots. Omitting mode creates a
    # missing directory under the user's umask without changing permissions
    # the user selected on an existing directory.
  loop:
    - "{{ cybexos_user_config_root }}"
    - "{{ cybexos_user_config_root }}/hypr"
    - "{{ primary_home }}/.config/xdg-desktop-portal"
    - "{{ primary_home }}/.config/systemd/user"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants"
    - "{{ primary_home }}/.local/bin"
    - "{{ primary_home }}/.local/libexec"
    - "{{ cybexos_data_root }}"
    - "{{ cybexos_data_root }}/themes"
    - "{{ cybexos_data_root }}/plugins"
    - "{{ primary_home }}/.local/state/hyprland"
  tags: [browser]

- name: Create private CybexOS shell state directories
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ cybexos_state_root }}"
    - "{{ cybexos_state_root }}/shell"
  tags: [browser, quickshell]

- name: Inspect the vendor runtime root without following links
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.stat:
    path: "{{ cybexos_runtime_root }}"
    follow: false
  register: desktop_runtime_root_stat
  tags: [browser, quickshell]

- name: Record whether the vendor runtime root must be normalized
  ansible.builtin.set_fact:
    desktop_runtime_root_unsafe: >-
      {{ desktop_runtime_root_stat.stat.exists
         and (desktop_runtime_root_stat.stat.islnk | default(false)
              or not (desktop_runtime_root_stat.stat.isdir | default(false))) }}
  tags: [browser, quickshell]

- name: Remove an unsafe vendor runtime root
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ cybexos_runtime_root }}"
    state: absent
  when: desktop_runtime_root_unsafe | bool
  tags: [browser, quickshell]

- name: Create the vendor runtime root
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ cybexos_runtime_root }}"
    state: directory
    mode: "0755"
    follow: false
  when: not (ansible_check_mode and desktop_runtime_root_unsafe | bool)
  tags: [browser, quickshell]

- name: Inspect the Hyprland runtime root without following links
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.stat:
    path: "{{ cybexos_runtime_root }}/hypr"
    follow: false
  register: hypr_runtime_root_stat
  when: not (ansible_check_mode and desktop_runtime_root_unsafe | bool)
  tags: [browser]

- name: Record whether the Hyprland runtime root must be normalized
  ansible.builtin.set_fact:
    hypr_runtime_root_unsafe: >-
      {{ hypr_runtime_root_stat.stat.exists | default(false)
         and (hypr_runtime_root_stat.stat.islnk | default(false)
              or not (hypr_runtime_root_stat.stat.isdir | default(false))) }}
    hypr_runtime_path_normalization_pending: >-
      {{ ansible_check_mode
         and (desktop_runtime_root_unsafe | bool
              or (hypr_runtime_root_stat.stat.exists | default(false)
                  and (hypr_runtime_root_stat.stat.islnk | default(false)
                       or not (hypr_runtime_root_stat.stat.isdir | default(false))))) }}
  tags: [browser]

- name: Remove an unsafe Hyprland runtime root
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ cybexos_runtime_root }}/hypr"
    state: absent
  when:
    - not (ansible_check_mode and desktop_runtime_root_unsafe | bool)
    - hypr_runtime_root_unsafe | bool
  tags: [browser]

- name: Create the Hyprland runtime root
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ cybexos_runtime_root }}/hypr"
    state: directory
    mode: "0755"
    follow: false
  when: not hypr_runtime_path_normalization_pending | bool
  tags: [browser]

# Hyprland watches every required Lua module and reloads the graph immediately
# when any one of them changes.  Install rendered dependencies before a module
# can start importing them so a first live deployment never enters emergency
# mode between two Ansible loop iterations.
- name: Install rendered Hyprland Lua dependencies before their consumers
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ cybexos_runtime_root }}/hypr/{{ item }}"
    mode: "0644"
  loop:
    - features.lua
    - monitors.lua
    - input.lua
    - looknfeel.lua
  when: not hypr_runtime_path_normalization_pending | bool
  tags: [browser]

- name: Install Hyprland Lua configuration
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ cybexos_runtime_root }}/hypr/{{ item }}"
    mode: "0644"
  loop:
    - bindings.lua
    - autostart.lua
    # This entrypoint requires every module above. Keeping it last makes an
    # empty live configuration valid at each observable deployment boundary.
    - hyprland.lua
  when: not hypr_runtime_path_normalization_pending | bool
  tags: [browser]

- name: Install ordered Hyprland session starter
  ansible.builtin.copy:
    src: hyprland-session-start
    dest: /usr/local/libexec/cybexos-hyprland-session-start
    owner: root
    group: root
    mode: "0755"
  tags: [browser]

- name: Install verified desktop session action helper
  ansible.builtin.copy:
    src: cybexos-session-action
    dest: /usr/local/libexec/cybexos-session-action
    owner: root
    group: root
    mode: "0755"
  tags: [browser, quickshell]

- name: Install the singleton session-lock user unit before its callers
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: cybexos-session-lock.service.j2
    dest: "{{ primary_home }}/.config/systemd/user/cybexos-session-lock.service"
    mode: "0644"
  register: session_lock_unit
  notify: Reload user systemd
  tags: [browser, quickshell]

- name: Make the singleton session-lock unit immediately available
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
  when:
    - not ansible_check_mode
    - session_lock_unit is changed
  tags: [browser, quickshell]

- name: Install rendered Hyprland service configuration
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ cybexos_runtime_root }}/hypr/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: hypridle.conf.j2, dest: hypridle.conf }
    - { src: hyprlock.conf.j2, dest: hyprlock.conf }
  notify: Restart hypridle
  when: not hypr_runtime_path_normalization_pending | bool
  tags: [browser]

- name: Inspect the completed Hyprland vendor runtime
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.find:
    paths: "{{ cybexos_runtime_root }}/hypr"
    recurse: false
    hidden: true
    file_type: any
    follow: false
  register: hypr_runtime_entries
  when: not hypr_runtime_path_normalization_pending | bool
  tags: [browser]

- name: Remove stale entries from the Hyprland vendor runtime
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ hypr_runtime_entries.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - not hypr_runtime_path_normalization_pending | bool
    - item.path | basename not in ['features.lua', 'monitors.lua', 'input.lua', 'looknfeel.lua', 'bindings.lua', 'autostart.lua', 'hyprland.lua', 'hypridle.conf', 'hyprlock.conf']
  tags: [browser]

- name: Install the guarded desktop runtime resolver
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: "{{ config_repo }}/assets/scripts/cybexos-runtime"
    dest: "{{ primary_home }}/.local/bin/cybexos-runtime"
    mode: "0755"
  # hypridle starts through the resolver, which renders its configuration.
  notify: Restart hypridle
  tags: [browser, quickshell]

- name: Install the one-time ownership-layer migration helper
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: "{{ config_repo }}/assets/scripts/cybexos-migrate-layering"
    dest: "{{ primary_home }}/.local/libexec/cybexos-migrate-layering"
    mode: "0755"
  tags: [browser, quickshell]

- name: Remove retired Paseo shell widget runtime
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ primary_home }}/.local/share/cybexos/paseo-bridge"
    state: absent
  when: cleanup_legacy_xps_artifacts | bool
  tags: [quickshell]

- name: Install durable updater backend used by Quickshell and the CLI
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: "{{ config_repo }}/assets/scripts/cybexos-update-run"
    dest: "{{ primary_home }}/.local/bin/cybexos-update-run"
    mode: "0755"
  tags: [quickshell]

# The durable worker runs this beside itself, as root, for --firmware updates.
- name: Install the fwupd firmware helper used by the durable updater
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: "{{ config_repo }}/assets/scripts/cybexos-firmware-update"
    dest: "{{ primary_home }}/.local/bin/cybexos-firmware-update"
    mode: "0755"
  tags: [quickshell]

- name: Build the tracked Quickshell source manifest
  ansible.builtin.shell: |
    set -o pipefail
    repo={{ playbook_dir | quote }}
    if git -C "$repo" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
      git -C "$repo" ls-files -z --cached --others --exclude-standard -- \
          roles/desktop/files/quickshell |
        while IFS= read -r -d '' source_path; do
          # The index still names tracked paths deleted in this working tree.
          # Keep intentional untracked sources, but never declare a missing
          # source managed or its obsolete deployed copy will escape cleanup.
          if [[ -f "$repo/$source_path" || -L "$repo/$source_path" ]]; then
            printf '%s\n' "$source_path"
          fi
        done
    else
      # Release archives deliberately have no .git directory. In that case,
      # the extracted source tree is authoritative, apart from Python
      # generated bytecode caches which are never runtime source assets.
      find "$repo/roles/desktop/files/quickshell" \
        \( -type d -name __pycache__ -prune \) -o \
        \( -type f -o -type l \) ! -name '*.py[co]' \
        -printf 'roles/desktop/files/quickshell/%P\n' | LC_ALL=C sort
    fi
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  register: quickshell_tracked_files
  tags: [quickshell]

- name: Record relative paths in the managed Quickshell tree
  ansible.builtin.set_fact:
    quickshell_managed_manifest: >-
      {{ quickshell_tracked_files.stdout_lines
         | map('regex_replace', '^roles/desktop/files/quickshell/', '')
         | reject('equalto', '')
         | list }}
    # The only managed executables; every other shell file is installed 0644.
    quickshell_executable_prefix: compat/omarchy/bin/
  tags: [quickshell]

- name: Refuse an empty or incomplete Quickshell source manifest
  ansible.builtin.assert:
    that:
      - quickshell_managed_manifest | length > 0
      - "'shell.qml' in quickshell_managed_manifest"
    fail_msg: >-
      The Quickshell source manifest is empty or lacks shell.qml; refusing to
      prune or modify the deployed shell.
  tags: [quickshell]

# Besides the deployment identity, record what the copy task below would write
# for each managed path (bytes, size, and mode) and every parent directory, so
# the deployed tree can be compared without a module run per file.
- name: Calculate the content identity of the managed Quickshell tree
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import hashlib
        import json
        import os
        from pathlib import Path
        import sys

        root = Path(sys.argv[1])
        executable_prefix = sys.argv[2]
        digest = hashlib.sha256()
        files = {}
        directories = set()
        for relative in json.load(sys.stdin):
            path = root / relative
            digest.update(relative.encode("utf-8") + b"\0")
            if path.is_symlink():
                payload = b"L" + os.readlink(path).encode("utf-8")
                # copy installs a linked source as a regular file holding the
                # target's bytes. Anything else is simply always recopied.
                content = path.read_bytes() if path.is_file() else None
            else:
                content = path.read_bytes()
                payload = b"F" + content
            digest.update(payload + b"\0")
            files[relative] = {
                "sha256": None if content is None else hashlib.sha256(content).hexdigest(),
                "size": None if content is None else len(content),
                "mode": 0o755 if relative.startswith(executable_prefix) else 0o644,
            }
            parent = relative.rpartition("/")[0]
            while parent:
                directories.add(parent)
                parent = parent.rpartition("/")[0]
        json.dump({
            "digest": digest.hexdigest(),
            "files": files,
            "directories": sorted(directories),
        }, sys.stdout)
      - "{{ config_repo }}/roles/desktop/files/quickshell"
      - "{{ quickshell_executable_prefix }}"
    stdin: "{{ quickshell_managed_manifest | sort | to_json }}"
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  register: quickshell_source_digest
  tags: [quickshell]

- name: Record the managed Quickshell identity and directories
  ansible.builtin.set_fact:
    quickshell_source: "{{ quickshell_source_digest.stdout | from_json }}"
  tags: [quickshell]

# Classify the deployed tree in one pass instead of stat-and-checksumming each
# managed file through its own module run. Nothing is followed: the root or
# any child that is a link or has the wrong type is replaced, a stale or
# linked child is removed, and a managed file is recopied unless it is a
# regular file with exactly the source bytes and mode. Everything below this
# task is derived from this read-only inspection, so an unchanged tree skips
# the lint, live snapshot, writes, and live verification entirely.
- name: Inspect the deployed Quickshell tree before writing through any child path
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import hashlib
        import json
        import os
        import stat
        import sys

        root = sys.argv[1]
        source = json.load(sys.stdin)
        files = source["files"]
        directories = set(source["directories"])
        delta = {"root": "directory", "install": [], "directories": [],
                 "stale_files": [], "stale_directories": [], "bytecode_caches": []}


        def unchanged(path, expected, info):
            if (not stat.S_ISREG(info.st_mode)
                    or stat.S_IMODE(info.st_mode) != expected["mode"]
                    or expected["sha256"] is None
                    or info.st_size != expected["size"]):
                return False
            digest = hashlib.sha256()
            try:
                descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
            except OSError:
                return False
            with os.fdopen(descriptor, "rb") as stream:
                for block in iter(lambda: stream.read(1 << 20), b""):
                    digest.update(block)
            return digest.hexdigest() == expected["sha256"]


        try:
            root_info = os.lstat(root)
        except FileNotFoundError:
            root_info = None
        if root_info is None:
            delta["root"] = "missing"
        elif not stat.S_ISDIR(root_info.st_mode):
            delta["root"] = "unsafe"
        elif stat.S_IMODE(root_info.st_mode) != 0o755:
            delta["root"] = "mode"

        if delta["root"] in ("missing", "unsafe"):
            # The root is created or replaced whole; never look through it.
            delta["install"] = sorted(files)
            delta["directories"] = sorted(directories)
        else:
            deployed = {}
            unreadable = set()
            pending = [""]
            while pending:
                parent = pending.pop()
                try:
                    with os.scandir(os.path.join(root, parent)) as entries:
                        children = [(entry.name, entry.stat(follow_symlinks=False))
                                    for entry in entries]
                except PermissionError:
                    # The directory task restores its mode; recopy its files.
                    unreadable.add(parent)
                    continue
                for name, info in children:
                    relative = parent + "/" + name if parent else name
                    deployed[relative] = info
                    if stat.S_ISDIR(info.st_mode):
                        if relative in directories:
                            pending.append(relative)
                        elif name == "__pycache__":
                            # Written by the running shell's Python helpers.
                            # Python only loads a cached module beside its
                            # source, so these are inert until a deployment
                            # changes the tree anyway.
                            delta["bytecode_caches"].append(relative)
                        else:
                            delta["stale_directories"].append(relative)
                    elif relative not in files or not stat.S_ISREG(info.st_mode):
                        delta["stale_files"].append(relative)
            for relative in sorted(directories):
                info = deployed.get(relative)
                if (info is None or relative in unreadable
                        or not stat.S_ISDIR(info.st_mode)
                        or stat.S_IMODE(info.st_mode) != 0o755):
                    delta["directories"].append(relative)
            for relative in sorted(files):
                info = deployed.get(relative)
                if info is None or not unchanged(
                        os.path.join(root, relative), files[relative], info):
                    delta["install"].append(relative)
            delta["stale_files"].sort()
            delta["stale_directories"].sort()
            delta["bytecode_caches"].sort()
        json.dump(delta, sys.stdout)
      - "{{ cybexos_runtime_root }}/quickshell"
    # The source description: expected files and every managed directory.
    stdin: "{{ quickshell_source_digest.stdout }}"
  changed_when: false
  check_mode: false
  register: quickshell_deployed_tree
  tags: [quickshell]

- name: Record the Quickshell deployment delta
  ansible.builtin.set_fact:
    quickshell_deploy: "{{ quickshell_deploy_delta }}"
    quickshell_deploy_required: >-
      {{ quickshell_deploy_delta.root != 'directory'
         or (quickshell_deploy_delta.install
             + quickshell_deploy_delta.directories
             + quickshell_deploy_delta.stale_files
             + quickshell_deploy_delta.stale_directories) | length > 0 }}
  vars:
    quickshell_deploy_delta: "{{ quickshell_deployed_tree.stdout | from_json }}"
  tags: [quickshell]

# Broken QML would land on disk and only surface at the next shell reload, far
# from the change that caused it. Run the same static check tests/run uses,
# against the source tree, before anything is written. An unchanged deployed
# tree has nothing to protect, so the check is skipped then; a lint-only run
# (--tags quickshell-lint) always performs it. Skip with --skip-tags
# quickshell-lint; it is read-only, so it also runs under --check. A missing
# qmllint is a failed prerequisite, just as it is in the repository and CI
# gates.
- name: Check the Quickshell configuration before installing it
  ansible.builtin.command: "{{ playbook_dir }}/tests/qml-lint --shell-only"
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  failed_when: false
  register: quickshell_lint
  when: quickshell_deploy_required | default(true) | bool
  tags: [quickshell, quickshell-lint]

# Reported separately so the findings themselves reach the terminal: a failing
# command module puts them in stdout, which the compact callback drops in
# favor of "non-zero return code".
- name: Refuse to install a Quickshell configuration that qmllint rejects
  ansible.builtin.fail:
    msg: "{{ quickshell_lint.stdout | default(quickshell_lint.stderr) | default('qmllint failed') }}"
  when: quickshell_lint.rc | default(0) != 0
  tags: [quickshell, quickshell-lint]

# Installed ahead of the live snapshot so a unit-only change also takes the
# snapshot and verified-restart path below. A daemon-reload does not restart
# the running shell; the verification step does that from the final tree.
- name: Install the explicitly rooted Quickshell user unit
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: quickshell.service.j2
    dest: "{{ primary_home }}/.config/systemd/user/quickshell.service"
    mode: "0644"
  register: quickshell_unit
  notify: Reload user systemd
  tags: [quickshell]

- name: Make the explicitly rooted Quickshell unit immediately available
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
  when:
    - not ansible_check_mode
    - quickshell_unit is changed
  tags: [quickshell]

# Taken only when this run will change the shell: the snapshot probes the live
# service and reconciles stray developer qs processes, which an unchanged
# converge has no reason to disturb.
- name: Snapshot the last-known-good live Quickshell before deployment
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/tests/quickshell-deploy-health"
      - snapshot
      - "{{ primary_home }}"
      - "{{ quickshell_source.digest }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
  changed_when: false
  register: quickshell_live_snapshot
  when:
    - not ansible_check_mode
    - quickshell_deploy_required | bool or quickshell_unit is changed
  tags: [quickshell]

- name: Inspect the managed Quickshell root without following links
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.stat:
    path: "{{ cybexos_runtime_root }}/quickshell"
    follow: false
  register: quickshell_root_stat
  tags: [quickshell]

- name: Record whether the Quickshell root must be normalized
  ansible.builtin.set_fact:
    quickshell_root_unsafe: >-
      {{ quickshell_root_stat.stat.exists
         and (quickshell_root_stat.stat.islnk | default(false)
              or not (quickshell_root_stat.stat.isdir | default(false))) }}
  tags: [quickshell]

- name: Remove a non-directory or linked Quickshell root safely
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ cybexos_runtime_root }}/quickshell"
    state: absent
  when: quickshell_root_unsafe | bool
  register: quickshell_root_normalized
  tags: [quickshell]

- name: Create the managed Quickshell root directory
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ cybexos_runtime_root }}/quickshell"
    state: directory
    mode: "0755"
    follow: false
  when: >-
    not (ansible_check_mode
         and (desktop_runtime_root_unsafe | bool or quickshell_root_unsafe | bool))
  register: quickshell_root_created
  tags: [quickshell]

- name: Remove files and links that are stale or unsafe copy destinations
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ cybexos_runtime_root }}/quickshell/{{ item }}"
    state: absent
  # Includes every link, even one at a managed path, and every non-directory
  # outside the manifest. Children of stale or linked directories are never
  # listed: removing the directory entry itself is sufficient.
  loop: "{{ quickshell_deploy.stale_files }}"
  loop_control:
    label: "{{ item }}"
  register: quickshell_removed_files
  tags: [quickshell]

- name: Remove directories not present in the tracked Quickshell manifest
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ cybexos_runtime_root }}/quickshell/{{ item }}"
    state: absent
  # Bytecode caches alone never make a deployment necessary; they are cleared
  # with one so the restarted shell runs from exactly the managed tree.
  loop: >-
    {{ quickshell_deploy.stale_directories
       + (quickshell_deploy_required | bool
          | ternary(quickshell_deploy.bytecode_caches, [])) }}
  loop_control:
    label: "{{ item }}"
  register: quickshell_removed_directories
  tags: [quickshell]

- name: Record deferred path normalization during check mode
  ansible.builtin.set_fact:
    quickshell_path_normalization_pending: >-
      {{ ansible_check_mode
         and (desktop_runtime_root_unsafe | bool
              or quickshell_root_unsafe | bool
              or quickshell_removed_files.changed | default(false)
              or quickshell_removed_directories.changed | default(false)) }}
  tags: [quickshell]

- name: Create tracked Quickshell directories
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ cybexos_runtime_root }}/quickshell/{{ item }}"
    state: directory
    mode: "0755"
    follow: false
  loop: "{{ quickshell_deploy.directories }}"
  loop_control:
    label: "{{ item }}"
  when: not quickshell_path_normalization_pending | bool
  register: quickshell_directories
  tags: [quickshell]

- name: Install tracked Quickshell menubar files
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: "quickshell/{{ item }}"
    dest: "{{ cybexos_runtime_root }}/quickshell/{{ item }}"
    mode: "{{ '0755' if item.startswith(quickshell_executable_prefix) else '0644' }}"
    follow: false
    local_follow: false
  # Only the paths whose deployed copy differs; see the inspection above.
  loop: "{{ quickshell_deploy.install }}"
  loop_control:
    label: "{{ item }}"
  when: not quickshell_path_normalization_pending | bool
  register: quickshell_config
  tags: [quickshell]

# hypridle runs the shell's timeout renderer only when it starts.
- name: Queue a hypridle restart after its configuration renderer changes
  ansible.builtin.command: /usr/bin/true
  changed_when: true
  notify: Restart hypridle
  when: >-
    quickshell_config.results | default([])
    | selectattr('changed', 'defined') | selectattr('changed')
    | selectattr('item', 'equalto', 'scripts/hypridle-config.py')
    | list | length > 0
  tags: [quickshell]

- name: Create cybexos deployment state directory
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ cybexos_state_root }}"
    state: directory
    mode: "0700"
  tags: [quickshell]

- name: Classify and preserve the legacy desktop trees before changing ownership
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command:
    argv:
      - "{{ primary_home }}/.local/libexec/cybexos-migrate-layering"
      - --home
      - "{{ primary_home }}"
      - --previous-source
      - "{{ cybexos_data_root }}/current"
      - --runtime-root
      - "{{ cybexos_runtime_root }}"
  register: desktop_layering_migration
  changed_when: >-
    (desktop_layering_migration.stdout | default('')) is match('(?s)^CHANGED:')
  when: not ansible_check_mode
  tags: [browser, quickshell]

- name: Report preserved legacy desktop customizations
  ansible.builtin.debug:
    msg: "{{ desktop_layering_migration.stdout_lines }}"
  when:
    - not ansible_check_mode
    - desktop_layering_migration.changed | default(false)
  tags: [browser, quickshell]

- name: Save the deployed Quickshell manifest outside its watched config tree
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    dest: "{{ cybexos_state_root }}/quickshell-manifest.txt"
    mode: "0600"
    content: "{{ quickshell_managed_manifest | sort | join('\n') }}\n"
  tags: [quickshell]

# Qt keeps one compiled cache file per QML/JS source revision and never
# removes superseded ones. Every deployment strands the previous set, so prune
# entries unread for two weeks while the shell is about to restart anyway. The
# cache regenerates on demand, and an unlinked file stays valid for a process
# that still maps it.
- name: Prune stale compiled QML cache entries after a shell change
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command:
    argv:
      - find
      - "{{ primary_home }}/.cache/quickshell/qmlcache"
      - -mindepth
      - "1"
      - -maxdepth
      - "1"
      - -type
      - f
      - (
      - -name
      - "*.qmlc"
      - -o
      - -name
      - "*.jsc"
      - )
      - -atime
      - "+14"
      - -print
      - -delete
  register: quickshell_qmlcache_prune
  changed_when: quickshell_qmlcache_prune.stdout | length > 0
  # An absent cache directory is normal before the first shell start.
  failed_when: false
  when:
    - not ansible_check_mode
    - quickshell_deploy_required | bool
  tags: [quickshell]

- name: Verify the live Quickshell deployment or restore its last-known-good tree
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/tests/quickshell-deploy-health"
      - verify-or-rollback
      - "{{ primary_home }}"
      - "{{ quickshell_source.digest }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
  changed_when: false
  when:
    - not ansible_check_mode
    # The rollback archive and pending marker must come from this run's
    # snapshot, never from an earlier deployment's.
    - quickshell_live_snapshot is not skipped
    - quickshell_config is changed
      or quickshell_removed_files is changed
      or quickshell_removed_directories is changed
      or quickshell_root_normalized is changed
      or quickshell_root_created is changed
      or quickshell_directories is changed
      or quickshell_unit is changed
  tags: [quickshell]

# When a shell was active, the preceding task starts the final tree in a fresh
# invocation, verifies it, and rolls back atomically on failure. On a headless
# first install it records an explicit skipped-live-check health state.
- name: Report the completed Quickshell configuration deployment
  ansible.builtin.debug:
    msg: >-
      Quickshell configuration changed. An active shell passed a clean service
      reload; a headless first install recorded the live check as skipped.
      See the Shell Health panel or quickshell-health.json for the result.
  when: >-
    quickshell_config is changed
    or quickshell_removed_files is changed
    or quickshell_removed_directories is changed
    or quickshell_root_normalized is changed
    or quickshell_root_created is changed
    or quickshell_directories is changed
    or quickshell_unit is changed
  tags: [quickshell]

- name: Configure portal preference without patching Fedora files
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    dest: "{{ primary_home }}/.config/xdg-desktop-portal/hyprland-portals.conf"
    mode: "0644"
    content: |
      [preferred]
      default=hyprland;gtk
      org.freedesktop.impl.portal.FileChooser=gtk
      org.freedesktop.impl.portal.Secret=gnome-keyring

- name: Install Hyprland graphical-session target
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    dest: "{{ primary_home }}/.config/systemd/user/hyprland-session.target"
    mode: "0644"
    content: |
      [Unit]
      Description=Hyprland graphical session
      BindsTo=graphical-session.target
      Wants=graphical-session-pre.target
      After=graphical-session-pre.target
      Before=graphical-session.target

- name: Install restartable desktop user units
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "{{ primary_home }}/.config/systemd/user/{{ item }}.service"
    mode: "0644"
  loop:
    - hypridle
    - hyprpolkitagent
  notify:
    - Reload user systemd
    - Restart hypridle

# Dictation follows the developer tooling feature, which also selects its GPU
# backend, downloads its model, and binds its keys. Without that model an
# always-on daemon would only hold an idle audio and GPU context.
- name: Install the restartable Voxtype user unit
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: voxtype.service.j2
    dest: "{{ primary_home }}/.config/systemd/user/voxtype.service"
    mode: "0644"
  notify:
    - Reload user systemd
    - Restart Voxtype daemon
  when: features.developer_tools | bool

- name: Inspect a Voxtype unit installed before dictation followed developer tooling
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.stat:
    path: "{{ primary_home }}/.config/systemd/user/voxtype.service"
  register: desktop_voxtype_unit
  when: not features.developer_tools | bool

- name: Stop the Voxtype daemon when developer tooling is disabled
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.systemd_service:
    name: voxtype.service
    state: stopped
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
  failed_when: false
  when:
    - not features.developer_tools | bool
    - desktop_voxtype_unit.stat.exists | default(false)
    - not ansible_check_mode

- name: Remove the Voxtype user unit when developer tooling is disabled
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/voxtype.service"
    - "{{ primary_home }}/.config/systemd/user/voxtype.service"
  notify: Reload user systemd
  when: not features.developer_tools | bool

- name: Install external monitor watcher unit
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    dest: "{{ primary_home }}/.config/systemd/user/external-monitor-toggle.service"
    mode: "0644"
    content: |
      [Unit]
      Description=Apply XPS lid and external display policy
      PartOf=hyprland-session.target
      After=graphical-session-pre.target
      StartLimitIntervalSec=0

      [Service]
      Type=simple
      ExecStart=%h/.local/bin/external-monitor-toggle
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=hyprland-session.target
  notify:
    - Reload user systemd
    - Restart external monitor watcher
  when: cybexos_xps_2026 | default(false) | bool

- name: Enable desktop units for the Hyprland target
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    src: "../{{ item }}.service"
    dest: "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/{{ item }}.service"
    state: link
    force: true
  loop: >-
    {{ ['quickshell', 'hypridle', 'hyprpolkitagent']
       + (features.developer_tools | bool | ternary(['voxtype'], [])) }}
  notify: Reload user systemd

- name: Enable the XPS external monitor watcher
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    src: ../external-monitor-toggle.service
    dest: "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/external-monitor-toggle.service"
    state: link
    force: true
  notify: Reload user systemd
  when: cybexos_xps_2026 | default(false) | bool

- name: Preserve SELinux labels on local session executable
  ansible.builtin.command: restorecon -F /usr/local/bin/hyprland-quickshell
  changed_when: false
  when: not ansible_check_mode
