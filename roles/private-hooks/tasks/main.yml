---
- name: Create private-hook ownership state directory
  ansible.builtin.file:
    path: /var/lib/cybexos/features
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Inspect CybexOS ownership of private-hook features
  ansible.builtin.stat:
    path: "/var/lib/cybexos/features/{{ item }}"
  loop:
    - private_hooks
    - apple_display
  register: private_hook_marker_stats

- name: Record private-hook ownership state
  ansible.builtin.set_fact:
    private_hook_owned: >-
      {{ private_hook_owned | default({})
         | combine({item.item: item.stat.exists}) }}
  loop: "{{ private_hook_marker_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Remove CybexOS-owned private-hook artifacts when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ primary_home }}/.local/bin/sccache"
    - /var/cache/cybexos-upstream/conthrax.zip
    - /usr/local/share/fonts/conthrax
  notify:
    - Refresh fonts
  when:
    - not features.private_hooks | bool
    - private_hook_owned.private_hooks | bool

- name: Remove CybexOS-owned Apple display artifacts when private hooks are disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/udev/rules.d/70-apple-studio-display.rules
    - /usr/local/libexec/cybexos-build-asdcontrol
    - /usr/local/bin/asdcontrol
    - /var/cache/cybexos-upstream/asdcontrol
    - /var/lib/cybexos-upstream/asdcontrol
  notify: Reload udev
  when:
    - not features.private_hooks | bool
    - private_hook_owned.apple_display | bool

- name: Retire private-hook ownership after the feature is disabled
  ansible.builtin.file:
    path: "/var/lib/cybexos/features/{{ item }}"
    state: absent
  loop:
    - private_hooks
    - apple_display
  when: not features.private_hooks | bool

- name: End the private-hooks role after disabled-state convergence
  ansible.builtin.meta: end_role
  when: not features.private_hooks | bool

- name: Ensure private hook directory exists
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ primary_home }}/.local/bin"
    state: directory
    mode: "0755"

- name: Install network-aware sccache wrapper
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: sccache.j2
    dest: "{{ primary_home }}/.local/bin/sccache"
    mode: "0755"

- name: Install narrow Apple display USB permissions
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/70-apple-studio-display.rules
    owner: root
    group: root
    mode: "0644"
    content: |
      # Apple Studio/Pro Display only; no blanket Apple USB permissions.
      SUBSYSTEM=="usbmisc", ATTRS{idVendor}=="05ac", ATTRS{idProduct}=="1114", GROUP="video", MODE="0660"
      SUBSYSTEM=="usbmisc", ATTRS{idVendor}=="05ac", ATTRS{idProduct}=="1116", GROUP="video", MODE="0660"
  notify: Reload udev
  when: features.apple_display | bool

- name: Remove Apple display privileges and helper when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/udev/rules.d/70-apple-studio-display.rules
    - /usr/local/libexec/cybexos-build-asdcontrol
    - /usr/local/bin/asdcontrol
    - /var/cache/cybexos-upstream/asdcontrol
    - /var/lib/cybexos-upstream/asdcontrol
  notify: Reload udev
  when:
    - not features.apple_display | bool
    - private_hook_owned.apple_display | bool

- name: Checkout pinned asdcontrol source
  ansible.builtin.git:
    repo: https://github.com/nikosdion/asdcontrol.git
    dest: /var/cache/cybexos-upstream/asdcontrol/source
    version: 0ee8bd576d4e93513027d713e688988cb0d827ef
    force: true
  when: features.apple_display | bool and not ansible_check_mode

- name: Install patched asdcontrol build helper
  ansible.builtin.copy:
    src: build-asdcontrol
    dest: /usr/local/libexec/cybexos-build-asdcontrol
    owner: root
    group: root
    mode: "0755"
  when: features.apple_display | bool

- name: Build patched asdcontrol only when revision changes
  ansible.builtin.command: /usr/local/libexec/cybexos-build-asdcontrol
  register: asdcontrol_build
  changed_when: (asdcontrol_build.stdout | regex_search('(?m)^CHANGED:')) is not none
  when: features.apple_display | bool and not ansible_check_mode

- name: Download licensed redistributable Conthrax archive
  ansible.builtin.get_url:
    url: https://dl.dafont.com/dl/?f=conthrax
    dest: /var/cache/cybexos-upstream/conthrax.zip
    checksum: sha256:73363dc8e4b816bad704f4c9b7b96103751203fdf191c574d96da21517af7f13
    owner: root
    group: root
    mode: "0644"

- name: Create Conthrax font and license directory
  ansible.builtin.file:
    path: /usr/local/share/fonts/conthrax
    state: directory
    mode: "0755"

- name: Install Conthrax font and its desktop EULA # noqa command-instead-of-module
  ansible.builtin.command: >-
    unzip -o /var/cache/cybexos-upstream/conthrax.zip
    Conthrax-SemiBold.otf 'Typodermic Desktop EULA 2026.pdf'
    -d /usr/local/share/fonts/conthrax
  args:
    creates: /usr/local/share/fonts/conthrax/Typodermic Desktop EULA 2026.pdf
  notify: Refresh fonts

- name: Record CybexOS ownership of private hooks
  ansible.builtin.copy:
    dest: /var/lib/cybexos/features/private_hooks
    content: "managed\n"
    owner: root
    group: root
    mode: "0644"

- name: Record CybexOS ownership of Apple display integration
  ansible.builtin.copy:
    dest: /var/lib/cybexos/features/apple_display
    content: "managed\n"
    owner: root
    group: root
    mode: "0644"
  when: features.apple_display | bool

- name: Retire Apple display ownership after deselection
  ansible.builtin.file:
    path: /var/lib/cybexos/features/apple_display
    state: absent
  when:
    - not features.apple_display | bool
    - private_hook_owned.apple_display | bool
