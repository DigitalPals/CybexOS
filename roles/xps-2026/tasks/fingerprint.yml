---
# Fingerprint support itself is shared by every installation: the base
# package baseline installs fprintd and fprintd-pam, and the base role's
# authentication tasks enable authselect's with-fingerprint once
# (docs/security.md). This XPS-only part keeps the hardware diagnostic and
# reports when the detected reader is not one Fedora's libfprint supports.
- name: Install the supported-reader diagnostic
  ansible.builtin.copy:
    src: xps-fingerprint-check
    dest: /usr/local/libexec/xps-fingerprint-check
    owner: root
    group: root
    mode: "0755"
  register: xps_2026_fingerprint_diagnostic
  tags: [xps-2026, hardware, fingerprint]

- name: Restore the fingerprint diagnostic SELinux label
  ansible.builtin.command:
    argv: [restorecon, /usr/local/libexec/xps-fingerprint-check]
  changed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_fingerprint_diagnostic is changed
  tags: [xps-2026, hardware, fingerprint]

- name: Ask fprintd whether libfprint supports the detected reader
  ansible.builtin.command:
    argv:
      - busctl
      - call
      - --system
      - net.reactivated.Fprint
      - /net/reactivated/Fprint/Manager
      - net.reactivated.Fprint.Manager
      - GetDevices
  register: xps_2026_fingerprint_devices
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [xps-2026, hardware, fingerprint]

- name: Record whether the physical reader is supported by libfprint
  ansible.builtin.set_fact:
    xps_2026_fingerprint_supported: >-
      {{ (xps_2026_fingerprint_devices.rc | default(1) | int) == 0
         and xps_2026_fingerprint_devices.stdout | default('')
             is regex('^ao\\s+[1-9][0-9]*\\s') }}
  tags: [xps-2026, hardware, fingerprint]

- name: Report a reader which Fedora cannot use
  ansible.builtin.debug:
    msg: >-
      A possible fingerprint reader was detected ({{ xps_2026_fingerprint_probe.stdout | trim }}),
      but Fedora's current libfprint/fprintd stack did not expose a supported
      device. Password authentication is unchanged, and Settings > Security
      reports that no reader was found.
  when:
    - not ansible_check_mode
    - not xps_2026_fingerprint_supported | bool
  tags: [xps-2026, hardware, fingerprint]
