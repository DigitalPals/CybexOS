---
- name: Inspect the generic camera relay configuration backup
  ansible.builtin.stat:
    path: /var/lib/cybexos/backups/system/etc/v4l2-relayd.d/icamerasrc.conf
  register: xps_2026_disabled_camera_relay_backup
  tags: [xps-2026, hardware, camera]

- name: Restore Fedora's generic camera relay configuration
  ansible.builtin.copy:
    src: /var/lib/cybexos/backups/system/etc/v4l2-relayd.d/icamerasrc.conf
    dest: /etc/v4l2-relayd.d/icamerasrc.conf
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: xps_2026_disabled_camera_relay_backup.stat.exists
  notify: Reload XPS 2026 systemd
  tags: [xps-2026, hardware, camera]

- name: Stop and disable the managed IPU7 camera entrypoint
  ansible.builtin.systemd_service:
    name: xps-ipu7-camera.service
    enabled: false
    state: stopped
    daemon_reload: true
  failed_when: false
  when: not ansible_check_mode
  tags: [xps-2026, hardware, camera]

- name: Stop managed IPU7 camera companion units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  failed_when: false
  loop:
    - xps-ipu7-camera-resume.service
    - xps-ipu7-camera-init.service
    - v4l2-relayd@ipu7.service
  when: not ansible_check_mode
  tags: [xps-2026, hardware, camera]

- name: Discover role-owned IPU7 DKMS registrations
  ansible.builtin.find:
    paths:
      - /var/lib/dkms/ipu7-drivers
      - /var/lib/dkms/vision-drivers
    patterns: "*.xps*"
    file_type: directory
    recurse: false
  register: xps_2026_retired_camera_dkms
  failed_when: false
  check_mode: false
  tags: [xps-2026, hardware, camera]

- name: Remove role-owned IPU7 DKMS modules from every kernel
  ansible.builtin.command:
    argv:
      - dkms
      - remove
      - -m
      - "{{ item.path | dirname | basename }}"
      - -v
      - "{{ item.path | basename }}"
      - --all
  loop: "{{ xps_2026_retired_camera_dkms.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: not ansible_check_mode
  tags: [xps-2026, hardware, camera]

- name: Remove the local IPU7 userspace and DKMS source RPM
  ansible.builtin.dnf:
    name: xps-ipu7-camera-stack
    state: absent
  tags: [xps-2026, hardware, camera]

- name: Remove role-owned IPU7 integration, state, and caches
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/dkms/framework.conf.d/90-xps-akmods-signing.conf
    - /etc/modprobe.d/xps-ipu7-camera.conf
    - /etc/udev/rules.d/71-xps-ipu7-hide-isys.rules
    - /etc/udev/rules.d/90-xps-ipu7-psys.rules
    - /etc/v4l2-relayd.d/ipu7.conf
    - /etc/systemd/system/v4l2-relayd@ipu7.service.d/override.conf
    - /etc/wireplumber/wireplumber.conf.d/90-xps-ipu7-v4l2.conf
    - /etc/systemd/system/xps-ipu7-camera-init.service
    - /etc/systemd/system/xps-ipu7-camera-resume.service
    - /etc/systemd/system/xps-ipu7-camera.service
    - /usr/lib/systemd/system-sleep/xps-ipu7-camera
    - /usr/local/libexec/xps-ipu7-abi-check
    - /usr/local/libexec/xps-ipu7-build
    - /usr/local/libexec/xps-ipu7-camera-check
    - /usr/local/libexec/xps-ipu7-camera-init
    - /usr/local/libexec/xps-ipu7-refresh-wireplumber
    - /usr/local/libexec/xps-ipu7-userspace-check
    - /usr/local/share/xps-2026/camera
    - /var/cache/xps-ipu7
    - /var/lib/xps-hardware/ipu7
  notify:
    - Reload XPS 2026 systemd
    - Reload XPS 2026 udev rules
    - Refresh WirePlumber after camera removal
  tags: [xps-2026, hardware, camera]
