---
- name: Inspect the vendor TuneD PPD configuration
  ansible.builtin.stat:
    path: /etc/tuned/ppd.conf
  register: xps_2026_vendor_ppd_config

- name: Inspect the preserved vendor TuneD PPD configuration
  ansible.builtin.stat:
    path: /var/lib/cybexos/backups/system/etc/tuned/ppd.conf
  register: xps_2026_vendor_ppd_backup

- name: Create the XPS system-configuration backup directory
  ansible.builtin.file:
    path: /var/lib/cybexos/backups/system/etc/tuned
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Preserve the vendor TuneD PPD configuration before adoption
  ansible.builtin.copy:
    src: /etc/tuned/ppd.conf
    dest: /var/lib/cybexos/backups/system/etc/tuned/ppd.conf
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when:
    - xps_2026_vendor_ppd_config.stat.exists
    - not xps_2026_vendor_ppd_backup.stat.exists

- name: Install XPS 2026 thermal and low-power-mode services
  ansible.builtin.dnf:
    name:
      - intel-lpmd
      - thermald
    state: present

- name: Create the XPS TuneD profile directory
  ansible.builtin.file:
    path: /etc/tuned/profiles/xps-performance
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the XPS laptop performance profile
  ansible.builtin.copy:
    src: tuned-xps-performance.conf
    dest: /etc/tuned/profiles/xps-performance/tuned.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart XPS TuneD PPD bridge

- name: Map the desktop Performance option to the XPS profile
  ansible.builtin.copy:
    src: tuned-ppd.conf
    dest: /etc/tuned/ppd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart XPS TuneD PPD bridge

- name: Enable XPS thermal and low-power-mode services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: "{{ start_optional_hardware_services | bool | ternary('started', omit) }}"
  loop:
    - intel_lpmd.service
    - thermald.service
  failed_when: false
  when: not ansible_check_mode
  tags: [xps-2026, hardware, power]
