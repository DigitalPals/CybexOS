---
- name: Install Fedora-native camera runtime and build dependencies
  ansible.builtin.dnf:
    name:
      - dkms
      - kernel-devel-matched
      - akmod-v4l2loopback
      - v4l2loopback
      - v4l2-relayd
      - v4l-utils
      - gcc
      - gcc-c++
      - binutils
      - zstd
      - make
      - cmake
      - autoconf
      - automake
      - libtool
      - patch
      - pkgconf-pkg-config
      - expat-devel
      - jsoncpp-devel
      - libdrm-devel
      - gstreamer1-devel
      - gstreamer1-plugins-base-devel
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
      - gstreamer1-plugins-bad-free
      - rpm-build
      - mokutil
      # pahole reads the stock module's BTF before any PSYS DKMS build/start.
      - dwarves
    state: present
  register: xps_2026_camera_dependencies
  failed_when: false
  when: not ansible_check_mode
  tags: [xps-2026, hardware, camera]

- name: Record whether the optional camera dependencies are available
  ansible.builtin.set_fact:
    xps_2026_camera_dependencies_ready: >-
      {{ ansible_check_mode
         or (xps_2026_camera_dependencies.rc | default(1) | int) == 0 }}
  tags: [xps-2026, hardware, camera]

- name: Report unavailable optional camera dependencies
  ansible.builtin.debug:
    msg: >-
      Fedora/RPM Fusion camera dependencies could not be installed, so only
      the IPU7 camera portion is skipped. DNF reported:
      {{ xps_2026_camera_dependencies.msg | default('unknown package error') }}
  when:
    - not ansible_check_mode
    - not xps_2026_camera_dependencies_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Inspect Fedora's generic camera relay configuration
  ansible.builtin.stat:
    path: /etc/v4l2-relayd.d/icamerasrc.conf
  register: xps_2026_generic_camera_relay
  tags: [xps-2026, hardware, camera]

- name: Inspect the preserved generic camera relay configuration
  ansible.builtin.stat:
    path: /var/lib/cybexos/backups/system/etc/v4l2-relayd.d/icamerasrc.conf
  register: xps_2026_generic_camera_relay_backup
  tags: [xps-2026, hardware, camera]

- name: Create the camera system-configuration backup directory
  ansible.builtin.file:
    path: /var/lib/cybexos/backups/system/etc/v4l2-relayd.d
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [xps-2026, hardware, camera]

- name: Preserve Fedora's generic camera relay configuration
  # Fedora ships a symlink into /run; its target can be absent on first boot.
  # Preserve the link itself, including when there is no generated target yet.
  ansible.builtin.command:
    argv: [cp, --archive, --no-dereference, /etc/v4l2-relayd.d/icamerasrc.conf, /var/lib/cybexos/backups/system/etc/v4l2-relayd.d/icamerasrc.conf]
  changed_when: true
  when:
    - xps_2026_generic_camera_relay.stat.exists
    - not xps_2026_generic_camera_relay_backup.stat.exists
  tags: [xps-2026, hardware, camera]

- name: Stop Fedora's unused generic camera relay instance
  ansible.builtin.systemd_service:
    name: v4l2-relayd@icamerasrc.service
    state: stopped
  failed_when: false
  when: not ansible_check_mode
  tags: [xps-2026, hardware, camera]

- name: Clear Fedora's unused generic camera relay failure state
  ansible.builtin.command:
    argv: [systemctl, reset-failed, v4l2-relayd@icamerasrc.service]
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
  tags: [xps-2026, hardware, camera]

- name: Keep Fedora's unused generic camera relay out of the generator
  ansible.builtin.file:
    path: /etc/v4l2-relayd.d/icamerasrc.conf
    state: absent
  notify: Reload XPS 2026 systemd
  tags: [xps-2026, hardware, camera]

- name: End this hardware role after an optional camera dependency failure
  ansible.builtin.meta: end_role
  when: not xps_2026_camera_dependencies_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Read the running kernel directly for camera build operations
  ansible.builtin.command: uname -r
  register: xps_2026_camera_kernel
  changed_when: false
  check_mode: false
  tags: [xps-2026, hardware, camera]

- name: Inspect whether a complete prior camera stack can be retained
  ansible.builtin.shell: |
    set -o pipefail
    rpm -q xps-ipu7-camera-stack >/dev/null
    [[ -r /etc/v4l2-relayd.d/ipu7.conf ]]
    [[ -e /usr/lib64/gstreamer-1.0/libgsticamerasrc.so ]]
    rpm -V xps-ipu7-camera-stack
    modinfo -k {{ xps_2026_camera_kernel.stdout | quote }} v4l2loopback >/dev/null
    modinfo -k {{ xps_2026_camera_kernel.stdout | quote }} intel_ipu7_psys >/dev/null
    modinfo -k {{ xps_2026_camera_kernel.stdout | quote }} intel_cvs >/dev/null
    systemctl is-enabled --quiet xps-ipu7-camera.service
  args:
    executable: /bin/bash
  register: xps_2026_camera_previous_probe
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [xps-2026, hardware, camera]

- name: Read the prior camera package identity for a verified rollback
  ansible.builtin.shell: |
    set -o pipefail
    if [[ -r /usr/share/xps-ipu7-camera-stack/input-manifest ]] &&
       grep -Eq '^[[:xdigit:]]{64}$' /usr/share/xps-ipu7-camera-stack/input-manifest; then
      printf 'manifest=%s\n' "$(</usr/share/xps-ipu7-camera-stack/input-manifest)"
    else
      rpm -q --qf 'nevra=%{NEVRA}\n' xps-ipu7-camera-stack
    fi
  args:
    executable: /bin/bash
  register: xps_2026_camera_previous_identity_probe
  changed_when: false
  failed_when: false
  check_mode: false
  when: xps_2026_camera_previous_probe.rc == 0
  tags: [xps-2026, hardware, camera]

- name: Read the exact prior camera package NEVRA
  ansible.builtin.command:
    argv: [rpm, -q, --qf, "%{NEVRA}", xps-ipu7-camera-stack]
  register: xps_2026_camera_previous_nevra_probe
  changed_when: false
  failed_when: false
  check_mode: false
  when: xps_2026_camera_previous_probe.rc == 0
  tags: [xps-2026, hardware, camera]

- name: Record the prior camera rollback boundary
  ansible.builtin.set_fact:
    xps_2026_camera_previous_identity: >-
      {{ xps_2026_camera_previous_identity_probe.stdout | default('') | trim }}
    xps_2026_camera_previous_ready: >-
      {{ xps_2026_camera_previous_probe.rc == 0
         and (xps_2026_camera_previous_identity_probe.rc | default(1) | int) == 0
         and (xps_2026_camera_previous_nevra_probe.rc | default(1) | int) == 0
         and (xps_2026_camera_previous_identity_probe.stdout | default('') | trim)
             is regex('^(manifest=[0-9a-fA-F]{64}|nevra=.+)$')
         and (xps_2026_camera_previous_nevra_probe.stdout | default('') | trim)
             is regex('^xps-ipu7-camera-stack-.+$') }}
  tags: [xps-2026, hardware, camera]

- name: Preserve the service-probed camera rollback boundary
  ansible.builtin.set_fact:
    xps_2026_camera_probe_previous_identity: "{{ xps_2026_camera_previous_identity }}"
    xps_2026_camera_probe_previous_nevra: >-
      {{ xps_2026_camera_previous_nevra_probe.stdout | default('') | trim }}
    xps_2026_camera_probe_previous_ready: "{{ xps_2026_camera_previous_ready }}"
  tags: [xps-2026, hardware, camera]

- name: Create the managed IPU7 source, build, and state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /var/cache/xps-ipu7/sources, mode: "0755" }
    - { path: /var/cache/xps-ipu7/rpms, mode: "0755" }
    - { path: /var/lib/xps-hardware/ipu7, mode: "0755" }
    - { path: /usr/local/share/xps-2026/camera/patches, mode: "0755" }
    - { path: /etc/dkms/framework.conf.d, mode: "0755" }
    - { path: /etc/wireplumber/wireplumber.conf.d, mode: "0755" }
    - { path: /etc/v4l2-relayd.d, mode: "0755" }
    - { path: /etc/systemd/system/v4l2-relayd@ipu7.service.d, mode: "0755" }
  tags: [xps-2026, hardware, camera]

- name: Install the pinned Fedora IPU7 build inputs
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: camera/patches/0003-vision-ptl-cvs-owns-rgb-power.patch
      dest: /usr/local/share/xps-2026/camera/patches/0003-vision-ptl-cvs-owns-rgb-power.patch
    - src: camera/patches/0004-ipu7-psys-register-bus.patch
      dest: /usr/local/share/xps-2026/camera/patches/0004-ipu7-psys-register-bus.patch
    - src: camera/patches/0005-ipu7-psys-stock-core-layout.patch
      dest: /usr/local/share/xps-2026/camera/patches/0005-ipu7-psys-stock-core-layout.patch
    - src: camera/patches/0006-camera-hal-native-cvs-bridge.patch
      dest: /usr/local/share/xps-2026/camera/patches/0006-camera-hal-native-cvs-bridge.patch
    - src: camera/xps-ipu7-camera-stack.spec
      dest: /usr/local/share/xps-2026/camera/xps-ipu7-camera-stack.spec
  tags: [xps-2026, hardware, camera]

- name: Install the IPU7 ABI and userspace closure guards
  ansible.builtin.copy:
    src: "camera/{{ item }}"
    dest: "/usr/local/libexec/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - xps-ipu7-abi-check
    - xps-ipu7-userspace-check
  tags: [xps-2026, hardware, camera]

- name: Install the pinned IPU7 build and DKMS manager
  ansible.builtin.template:
    src: xps-ipu7-build.j2
    dest: /usr/local/libexec/xps-ipu7-build
    owner: root
    group: root
    mode: "0755"
  tags: [xps-2026, hardware, camera]

- name: Inspect a durable interrupted camera transaction
  ansible.builtin.stat:
    path: /var/lib/xps-hardware/ipu7/transaction.in-progress
  register: xps_2026_camera_transaction_marker_stat
  check_mode: false
  tags: [xps-2026, hardware, camera]

- name: Recover and verify the interrupted camera transaction boundary
  ansible.builtin.command:
    argv: [/usr/local/libexec/xps-ipu7-build, transaction-info]
  register: xps_2026_camera_transaction_info
  changed_when: false
  failed_when: false
  check_mode: false
  when: xps_2026_camera_transaction_marker_stat.stat.exists
  tags: [xps-2026, hardware, camera]

- name: Record the cryptographically verified interrupted transaction
  ansible.builtin.set_fact:
    xps_2026_camera_transaction_marker_present: >-
      {{ xps_2026_camera_transaction_marker_stat.stat.exists }}
    xps_2026_camera_transaction_marker_valid: >-
      {{ xps_2026_camera_transaction_marker_stat.stat.exists
         and (xps_2026_camera_transaction_info.rc | default(1) | int) == 0 }}
    xps_2026_camera_recovered_previous_identity: >-
      {{ (xps_2026_camera_transaction_info.stdout_lines | default([])
          | select('match', '^previous=') | first | default('previous=none'))
         | regex_replace('^previous=', '') }}
    xps_2026_camera_recovered_previous_nevra: >-
      {{ (xps_2026_camera_transaction_info.stdout_lines | default([])
          | select('match', '^previous_nevra=') | first | default('previous_nevra=none'))
         | regex_replace('^previous_nevra=', '') }}
    xps_2026_camera_recovered_target_identity: >-
      {{ (xps_2026_camera_transaction_info.stdout_lines | default([])
          | select('match', '^target=') | first | default('target='))
         | regex_replace('^target=', '') }}
    xps_2026_camera_recovered_target_nevra: >-
      {{ (xps_2026_camera_transaction_info.stdout_lines | default([])
          | select('match', '^target_nevra=') | first | default('target_nevra='))
         | regex_replace('^target_nevra=', '') }}
  tags: [xps-2026, hardware, camera]

- name: Select the durable camera rollback boundary across invocations
  ansible.builtin.set_fact:
    xps_2026_camera_previous_identity: >-
      {{ xps_2026_camera_recovered_previous_identity
         if xps_2026_camera_transaction_marker_valid | bool
            and xps_2026_camera_recovered_previous_identity != 'none'
         else xps_2026_camera_probe_previous_identity }}
    xps_2026_camera_previous_ready: >-
      {{ (xps_2026_camera_transaction_marker_valid | bool
          and xps_2026_camera_recovered_previous_identity != 'none')
         if xps_2026_camera_transaction_marker_present | bool
         else xps_2026_camera_probe_previous_ready | bool }}
    xps_2026_camera_previous_nevra: >-
      {{ xps_2026_camera_recovered_previous_nevra
         if xps_2026_camera_transaction_marker_valid | bool
            and xps_2026_camera_recovered_previous_identity != 'none'
         else xps_2026_camera_probe_previous_nevra }}
    xps_2026_camera_transaction_previous_identity: >-
      {{ xps_2026_camera_recovered_previous_identity
         if xps_2026_camera_transaction_marker_valid | bool
         else (xps_2026_camera_probe_previous_identity
               if xps_2026_camera_probe_previous_ready | bool else 'none') }}
  tags: [xps-2026, hardware, camera]

- name: Report an invalid interrupted camera transaction
  ansible.builtin.debug:
    msg: >-
      The persistent camera transaction marker or its exact rollback snapshot
      is invalid. Package installation remains closed even if the service probe
      cannot see the prior stack. Restore the recorded RPM or inspect
      /var/lib/xps-hardware/ipu7/transaction.in-progress before retrying.
  when:
    - not ansible_check_mode
    - xps_2026_camera_transaction_marker_present | bool
    - not xps_2026_camera_transaction_marker_valid | bool
  tags: [xps-2026, hardware, camera]

- name: Install the fail-closed camera transaction guards before package work
  ansible.builtin.copy:
    src: "camera/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - src: xps-ipu7-camera-init
      dest: /usr/local/libexec/xps-ipu7-camera-init
      mode: "0755"
    - src: v4l2-relayd-override.conf
      dest: /etc/systemd/system/v4l2-relayd@ipu7.service.d/override.conf
      mode: "0644"
  notify:
    - Reload XPS 2026 systemd
    - Restart XPS 2026 camera
  tags: [xps-2026, hardware, camera]

- name: Load the fail-closed relay condition before package work
  ansible.builtin.command:
    argv: [systemctl, daemon-reload]
  changed_when: false
  when: not ansible_check_mode
  tags: [xps-2026, hardware, camera]

- name: Share the RPM Fusion akmods signing key with DKMS
  ansible.builtin.copy:
    dest: /etc/dkms/framework.conf.d/90-xps-akmods-signing.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # One key and one MOK enrollment cover both v4l2loopback (akmods) and the
      # IPU7 PSYS/CVS modules (DKMS).
      mok_signing_key="/etc/pki/akmods/private/private_key.priv"
      mok_certificate="/etc/pki/akmods/certs/public_key.der"
  tags: [xps-2026, hardware, camera]

- name: Start with the IPU7 source-download gate open
  ansible.builtin.set_fact:
    xps_2026_camera_sources_ready: true
    xps_2026_camera_build_succeeded: false
  tags: [xps-2026, hardware, camera]

- name: Download checksum-pinned IPU7 camera sources
  when: not ansible_check_mode
  tags: [xps-2026, hardware, camera]
  block:
    - name: Download each pinned upstream archive
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "/var/cache/xps-ipu7/sources/{{ item.name }}-{{ item.commit }}.tar.gz"
        checksum: "{{ item.checksum }}"
        owner: root
        group: root
        mode: "0644"
        timeout: 60
      loop: "{{ xps_2026_camera_sources }}"
  rescue:
    - name: Close the IPU7 build gate after a source failure
      ansible.builtin.set_fact:
        xps_2026_camera_sources_ready: false

    - name: Report the optional IPU7 source failure
      ansible.builtin.debug:
        msg: >-
          IPU7 camera sources could not be downloaded or did not match their
          pinned checksums. Camera setup is skipped; the rest of the play
          continues. Re-run with --tags xps-2026 after fixing connectivity.

- name: Inspect cached IPU7 source archives after verified downloads
  ansible.builtin.find:
    paths: /var/cache/xps-ipu7/sources
    recurse: false
    file_type: file
    patterns: "*.tar.gz"
  register: xps_2026_camera_cached_sources
  when: xps_2026_camera_sources_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Prune superseded role-managed IPU7 source archives
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ xps_2026_camera_cached_sources.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  vars:
    xps_2026_camera_current_source_names: >-
      {{ xps_2026_camera_sources
         | map(attribute='name')
         | zip(xps_2026_camera_sources | map(attribute='commit'))
         | map('join', '-')
         | map('regex_replace', '$', '.tar.gz')
         | list }}
  when:
    - xps_2026_camera_sources_ready | bool
    - item.path | basename not in xps_2026_camera_current_source_names
  tags: [xps-2026, hardware, camera]

- name: Build the pinned camera stack as a local RPM
  ansible.builtin.command:
    argv: [/usr/local/libexec/xps-ipu7-build, build]
  register: xps_2026_camera_build
  changed_when: "'CHANGED ' in xps_2026_camera_build.stdout"
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_sources_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Record whether the optional IPU7 build succeeded
  ansible.builtin.set_fact:
    xps_2026_camera_build_succeeded: >-
      {{ not ansible_check_mode
         and xps_2026_camera_sources_ready | bool
         and xps_2026_camera_build is defined
         and xps_2026_camera_build.rc == 0 }}
  tags: [xps-2026, hardware, camera]

- name: Save useful IPU7 build diagnostics without failing the play
  ansible.builtin.copy:
    dest: /var/lib/xps-hardware/ipu7/build-failed.log
    owner: root
    group: root
    mode: "0644"
    content: |
      The optional Panther Lake camera stack did not build.
      sources_ready={{ xps_2026_camera_sources_ready }}
      rc={{ xps_2026_camera_build.rc | default('not-run') }}

      stdout:
      {{ xps_2026_camera_build.stdout | default('') | indent(6, true) }}

      stderr:
      {{ xps_2026_camera_build.stderr | default('') | indent(6, true) }}
  when:
    - not ansible_check_mode
    - not xps_2026_camera_build_succeeded | bool
  tags: [xps-2026, hardware, camera]

- name: Clear stale camera build failure diagnostics
  ansible.builtin.file:
    path: /var/lib/xps-hardware/ipu7/build-failed.log
    state: absent
  when: xps_2026_camera_build_succeeded | bool
  tags: [xps-2026, hardware, camera]

- name: Preflight Fedora's stock IPU7 ABI before changing installed DKMS state
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xps-ipu7-abi-check
      - "{{ xps_2026_camera_kernel.stdout }}"
  register: xps_2026_camera_abi_preflight
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_build_succeeded | bool
  tags: [xps-2026, hardware, camera]

- name: Record whether the optional stock-core compatibility boundary is safe
  ansible.builtin.set_fact:
    xps_2026_camera_abi_ready: >-
      {{ not ansible_check_mode
         and xps_2026_camera_build_succeeded | bool
         and (xps_2026_camera_abi_preflight.rc | default(1) | int) == 0 }}
  tags: [xps-2026, hardware, camera]

- name: Save an isolated stock IPU7 ABI refusal diagnostic
  ansible.builtin.copy:
    dest: /var/lib/xps-hardware/ipu7/abi-failed.log
    owner: root
    group: root
    mode: "0644"
    content: |
      The optional Panther Lake camera compatibility layer was refused before
      any installed DKMS state changed. Fedora's stock IPU7 ABI needs review.
      rc={{ xps_2026_camera_abi_preflight.rc | default('not-run') }}

      stdout:
      {{ xps_2026_camera_abi_preflight.stdout | default('') | indent(6, true) }}

      stderr:
      {{ xps_2026_camera_abi_preflight.stderr | default('') | indent(6, true) }}
  when:
    - not ansible_check_mode
    - xps_2026_camera_build_succeeded | bool
    - not xps_2026_camera_abi_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Clear stale stock IPU7 ABI refusal diagnostics
  ansible.builtin.file:
    path: /var/lib/xps-hardware/ipu7/abi-failed.log
    state: absent
  when: xps_2026_camera_abi_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Verify the exact cached camera target identity
  ansible.builtin.command:
    argv: [/usr/local/libexec/xps-ipu7-build, target-identity]
  register: xps_2026_camera_target_identity_probe
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_build_succeeded | bool
    - xps_2026_camera_abi_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Verify the exact cached camera target NEVRA
  ansible.builtin.command:
    argv: [/usr/local/libexec/xps-ipu7-build, target-nevra]
  register: xps_2026_camera_target_nevra_probe
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_build_succeeded | bool
    - xps_2026_camera_abi_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Read the currently installed camera NEVRA
  ansible.builtin.command:
    argv: [rpm, -q, --qf, "%{NEVRA}", xps-ipu7-camera-stack]
  register: xps_2026_camera_installed_nevra_probe
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - xps_2026_camera_build_succeeded | bool
    - xps_2026_camera_abi_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Record the verified camera package transaction identities
  ansible.builtin.set_fact:
    xps_2026_camera_target_identity: >-
      {{ xps_2026_camera_target_identity_probe.stdout | default('') | trim }}
    xps_2026_camera_target_nevra: >-
      {{ xps_2026_camera_target_nevra_probe.stdout | default('') | trim }}
    xps_2026_camera_installed_nevra: >-
      {{ xps_2026_camera_installed_nevra_probe.stdout | default('') | trim }}
    xps_2026_camera_target_verified: >-
      {{ (xps_2026_camera_target_identity_probe.rc | default(1) | int) == 0
         and (xps_2026_camera_target_identity_probe.stdout | default('') | trim)
             is regex('^manifest=[0-9a-fA-F]{64}$')
         and (xps_2026_camera_target_nevra_probe.rc | default(1) | int) == 0
         and (xps_2026_camera_target_nevra_probe.stdout | default('') | trim)
             is regex('^xps-ipu7-camera-stack-.+$') }}
  tags: [xps-2026, hardware, camera]

- name: Record whether DNF would change the camera package NEVRA
  ansible.builtin.set_fact:
    xps_2026_camera_nevra_change: >-
      {{ xps_2026_camera_target_verified | bool
         and xps_2026_camera_target_nevra != xps_2026_camera_installed_nevra }}
  tags: [xps-2026, hardware, camera]

- name: Prepare and verify the exact rollback snapshot at the DNF boundary
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xps-ipu7-build
      - prepare-rollback
      - "{{ xps_2026_camera_previous_identity }}"
  register: xps_2026_camera_rollback_precondition
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_build_succeeded | bool
    - xps_2026_camera_abi_ready | bool
    - xps_2026_camera_target_verified | bool
    - xps_2026_camera_nevra_change | bool
    - xps_2026_camera_previous_ready | bool
    - not xps_2026_camera_transaction_marker_present | bool
  tags: [xps-2026, hardware, camera]

- name: Record the hard rollback precondition for a camera NEVRA change
  ansible.builtin.set_fact:
    xps_2026_camera_rollback_ready: >-
      {{ xps_2026_camera_transaction_marker_valid | bool
         if xps_2026_camera_transaction_marker_present | bool
         else (not xps_2026_camera_nevra_change | bool
               or not xps_2026_camera_previous_ready | bool
               or (xps_2026_camera_rollback_precondition.rc | default(1) | int) == 0) }}
  tags: [xps-2026, hardware, camera]

- name: Report a camera RPM change refused without an exact rollback snapshot
  ansible.builtin.debug:
    msg: >-
      The cached camera RPM has a different NEVRA, but the exact healthy
      installed RPM is not present in the verified rollback snapshot. DNF is
      intentionally skipped. This also covers a rerun interrupted after the
      cache was replaced but before the prior RPM snapshot became durable.
  when:
    - not ansible_check_mode
    - xps_2026_camera_nevra_change | bool
    - xps_2026_camera_previous_ready | bool
    - not xps_2026_camera_rollback_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Persist the camera transaction marker before closing exposure
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xps-ipu7-build
      - begin-transaction
      - "{{ xps_2026_camera_transaction_previous_identity }}"
      - "{{ xps_2026_camera_target_identity }}"
      - "{{ xps_2026_camera_target_nevra }}"
  register: xps_2026_camera_transaction_begin
  changed_when: "'TRANSACTION_STARTED ' in xps_2026_camera_transaction_begin.stdout"
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_build_succeeded | bool
    - xps_2026_camera_abi_ready | bool
    - xps_2026_camera_target_verified | bool
    - xps_2026_camera_nevra_change | bool
    - xps_2026_camera_rollback_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Record whether the durable camera transaction boundary is established
  ansible.builtin.set_fact:
    xps_2026_camera_transaction_started: >-
      {{ xps_2026_camera_transaction_marker_valid | bool
         if xps_2026_camera_transaction_marker_present | bool
         else (not xps_2026_camera_nevra_change | bool
               or (xps_2026_camera_transaction_begin.rc | default(1) | int) == 0) }}
  tags: [xps-2026, hardware, camera]

- name: Hide the camera relay trigger during a package transaction
  ansible.builtin.file:
    path: /etc/v4l2-relayd.d/ipu7.conf
    state: absent
  notify: Reload XPS 2026 systemd
  when:
    - not ansible_check_mode
    - xps_2026_camera_nevra_change | bool
    - xps_2026_camera_transaction_started | bool
  tags: [xps-2026, hardware, camera]

- name: Stop and disable camera exposure before the DNF transaction
  ansible.builtin.shell: |
    set -uo pipefail
    changed=false
    if systemctl is-enabled --quiet xps-ipu7-camera.service; then
      systemctl disable xps-ipu7-camera.service
      changed=true
    fi
    for unit in \
      xps-ipu7-camera.service \
      xps-ipu7-camera-resume.service \
      v4l2-relayd@ipu7.service \
      xps-ipu7-camera-init.service; do
      if systemctl is-active --quiet "$unit"; then
        systemctl stop "$unit" || exit 1
        changed=true
      fi
    done
    for unit in xps-ipu7-camera.service v4l2-relayd@ipu7.service xps-ipu7-camera-init.service; do
      ! systemctl is-active --quiet "$unit" || exit 1
    done
    ! systemctl is-enabled --quiet xps-ipu7-camera.service || exit 1
    [[ $changed == false ]] || echo CAMERA_EXPOSURE_CLOSED
  args:
    executable: /bin/bash
  register: xps_2026_camera_exposure_close
  changed_when: "'CAMERA_EXPOSURE_CLOSED' in xps_2026_camera_exposure_close.stdout"
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_nevra_change | bool
    - xps_2026_camera_transaction_started | bool
  tags: [xps-2026, hardware, camera]

- name: Record whether camera exposure is closed for destructive DNF
  ansible.builtin.set_fact:
    xps_2026_camera_exposure_closed: >-
      {{ not xps_2026_camera_nevra_change | bool
         or (xps_2026_camera_exposure_close.rc | default(1) | int) == 0 }}
    xps_2026_camera_install_gate: >-
      {{ xps_2026_camera_build_succeeded | bool
         and xps_2026_camera_abi_ready | bool
         and xps_2026_camera_target_verified | bool
         and xps_2026_camera_rollback_ready | bool
         and xps_2026_camera_transaction_started | bool
         and (not xps_2026_camera_nevra_change | bool
              or (xps_2026_camera_exposure_close.rc | default(1) | int) == 0) }}
  tags: [xps-2026, hardware, camera]

- name: Install the locally built, RPM-managed IPU7 userspace and DKMS sources
  ansible.builtin.dnf:
    name: /var/cache/xps-ipu7/rpms/xps-ipu7-camera-stack.rpm
    state: present
    disable_gpg_check: true
    allow_downgrade: true
  register: xps_2026_camera_rpm_install
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_install_gate | bool
  tags: [xps-2026, hardware, camera]

- name: Verify the installed camera RPM matches the complete build-input manifest
  ansible.builtin.command:
    argv:
      - cmp
      - --silent
      - /var/cache/xps-ipu7/rpms/xps-ipu7-camera-stack.inputs
      - /usr/share/xps-ipu7-camera-stack/input-manifest
  register: xps_2026_camera_manifest_install
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_build_succeeded | bool
    - xps_2026_camera_abi_ready | bool
    - (xps_2026_camera_rpm_install.rc | default(-1) | int) == 0
  tags: [xps-2026, hardware, camera]

- name: Verify the installed camera RPM matches the target NEVRA
  ansible.builtin.command:
    argv: [rpm, -q, --qf, "%{NEVRA}", xps-ipu7-camera-stack]
  register: xps_2026_camera_target_nevra_install
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_install_gate | bool
    - (xps_2026_camera_rpm_install.rc | default(-1) | int) == 0
  tags: [xps-2026, hardware, camera]

- name: Report an optional local camera RPM installation failure
  ansible.builtin.debug:
    msg: >-
      The pinned camera RPM built but DNF could not install it. The transaction
      will verify or restore the prior complete stack before keeping it exposed.
      DNF reported:
      {{ xps_2026_camera_rpm_install.msg | default('unknown RPM error') }}
  when:
    - not ansible_check_mode
    - xps_2026_camera_install_gate | bool
    - (xps_2026_camera_rpm_install.rc | default(-1) | int) != 0
  tags: [xps-2026, hardware, camera]

- name: Inspect the installed IPU7 camera plugin
  ansible.builtin.stat:
    path: /usr/lib64/gstreamer-1.0/libgsticamerasrc.so
  register: xps_2026_icamerasrc
  check_mode: false
  tags: [xps-2026, hardware, camera]

- name: Build the Fedora v4l2loopback akmod for the running stock kernel
  ansible.builtin.command:
    argv: [akmods, --force, --akmod, v4l2loopback, --kernels, "{{ xps_2026_camera_kernel.stdout }}"]
  register: xps_2026_v4l2loopback_build
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_build_succeeded | bool
    - xps_2026_camera_abi_ready | bool
    - (xps_2026_camera_rpm_install.rc | default(-1) | int) == 0
    - (xps_2026_camera_manifest_install.rc | default(-1) | int) == 0
    - (xps_2026_camera_target_nevra_install.rc | default(-1) | int) == 0
    - xps_2026_camera_target_nevra_install.stdout | trim == xps_2026_camera_target_nevra
    - xps_2026_icamerasrc.stat.exists
  tags: [xps-2026, hardware, camera]

- name: Register, build, and sign the IPU7 PSYS and CVS DKMS modules
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xps-ipu7-build
      - install-dkms
      - "{{ xps_2026_camera_kernel.stdout }}"
  register: xps_2026_camera_dkms
  changed_when: "'DKMS_CHANGED ' in xps_2026_camera_dkms.stdout"
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_build_succeeded | bool
    - xps_2026_camera_abi_ready | bool
    - (xps_2026_camera_rpm_install.rc | default(-1) | int) == 0
    - (xps_2026_camera_manifest_install.rc | default(-1) | int) == 0
    - (xps_2026_camera_target_nevra_install.rc | default(-1) | int) == 0
    - xps_2026_camera_target_nevra_install.stdout | trim == xps_2026_camera_target_nevra
    - xps_2026_icamerasrc.stat.exists
  tags: [xps-2026, hardware, camera]

- name: Save isolated IPU7 DKMS and stock-ABI diagnostics
  ansible.builtin.copy:
    dest: /var/lib/xps-hardware/ipu7/dkms-failed.log
    owner: root
    group: root
    mode: "0644"
    content: |
      The optional Panther Lake PSYS/CVS DKMS installation was refused or failed.
      rc={{ xps_2026_camera_dkms.rc | default('not-run') }}

      stdout:
      {{ xps_2026_camera_dkms.stdout | default('') | indent(6, true) }}

      stderr:
      {{ xps_2026_camera_dkms.stderr | default('') | indent(6, true) }}
  when:
    - not ansible_check_mode
    - xps_2026_camera_abi_ready | bool
    - (xps_2026_camera_dkms.rc | default(-1) | int) not in [0, 5]
  tags: [xps-2026, hardware, camera]

- name: Clear stale IPU7 DKMS failure diagnostics
  ansible.builtin.file:
    path: /var/lib/xps-hardware/ipu7/dkms-failed.log
    state: absent
  when: (xps_2026_camera_dkms.rc | default(-1) | int) in [0, 5]
  tags: [xps-2026, hardware, camera]

- name: Record candidate camera commit states after DKMS work
  ansible.builtin.set_fact:
    xps_2026_camera_candidate_reboot_required: >-
      {{ not ansible_check_mode
         and xps_2026_camera_build_succeeded | bool
         and (xps_2026_camera_rpm_install.rc | default(-1) | int) == 0
         and (xps_2026_camera_manifest_install.rc | default(-1) | int) == 0
         and (xps_2026_camera_target_nevra_install.rc | default(-1) | int) == 0
         and (xps_2026_camera_target_nevra_install.stdout | default('') | trim)
             == xps_2026_camera_target_nevra
         and xps_2026_icamerasrc.stat.exists
         and (xps_2026_v4l2loopback_build.rc | default(-1) | int) == 0
         and (xps_2026_camera_dkms.rc | default(-1) | int) == 5 }}
    xps_2026_camera_candidate_ready: >-
      {{ not ansible_check_mode
         and xps_2026_camera_build_succeeded | bool
         and (xps_2026_camera_rpm_install.rc | default(-1) | int) == 0
         and (xps_2026_camera_manifest_install.rc | default(-1) | int) == 0
         and (xps_2026_camera_target_nevra_install.rc | default(-1) | int) == 0
         and (xps_2026_camera_target_nevra_install.stdout | default('') | trim)
             == xps_2026_camera_target_nevra
         and xps_2026_icamerasrc.stat.exists
         and (xps_2026_v4l2loopback_build.rc | default(-1) | int) == 0
         and (xps_2026_camera_dkms.rc | default(-1) | int) == 0 }}
    xps_2026_camera_preserve_previous: false
  tags: [xps-2026, hardware, camera]

- name: Prove and commit the exact new camera package and DKMS identity
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xps-ipu7-build
      - commit-transaction
      - "{{ xps_2026_camera_target_identity }}"
      - "{{ xps_2026_camera_kernel.stdout }}"
  register: xps_2026_camera_target_commit
  changed_when: "'TRANSACTION_COMMITTED ' in xps_2026_camera_target_commit.stdout"
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_candidate_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Record only a proven camera transaction as ready
  ansible.builtin.set_fact:
    xps_2026_camera_reboot_required: >-
      {{ xps_2026_camera_candidate_reboot_required | bool }}
    xps_2026_camera_ready: >-
      {{ xps_2026_camera_candidate_ready | bool
         and (xps_2026_camera_target_commit.rc | default(1) | int) == 0 }}
  tags: [xps-2026, hardware, camera]

- name: Record whether the new camera transaction needs rollback
  ansible.builtin.set_fact:
    xps_2026_camera_refresh_failed: >-
      {{ not ansible_check_mode
         and not xps_2026_camera_ready | bool
         and not xps_2026_camera_reboot_required | bool }}
  tags: [xps-2026, hardware, camera]

- name: Check whether a failed refresh left the prior camera RPM untouched
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xps-ipu7-build
      - installed-identity
  register: xps_2026_camera_prior_still_installed
  changed_when: false
  failed_when: false
  when:
    - xps_2026_camera_refresh_failed | bool
    - xps_2026_camera_previous_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Record whether the prior camera package is still exact
  ansible.builtin.set_fact:
    xps_2026_camera_prior_untouched: >-
      {{ (xps_2026_camera_prior_still_installed.rc | default(-1) | int) == 0
         and (xps_2026_camera_prior_still_installed.stdout | default('') | trim)
             == xps_2026_camera_previous_identity
         and not xps_2026_camera_transaction_marker_present | bool
         and not xps_2026_camera_nevra_change | bool }}
  when:
    - xps_2026_camera_refresh_failed | bool
    - xps_2026_camera_previous_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Locate the verified prior camera RPM for rollback
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xps-ipu7-build
      - rollback-rpm
      - "{{ xps_2026_camera_previous_identity }}"
  register: xps_2026_camera_rollback_rpm
  changed_when: false
  failed_when: false
  when:
    - xps_2026_camera_refresh_failed | bool
    - xps_2026_camera_previous_ready | bool
    - not xps_2026_camera_prior_untouched | default(false) | bool
  tags: [xps-2026, hardware, camera]

- name: Reinstall the verified prior camera RPM after a failed refresh
  ansible.builtin.dnf:
    name: "{{ xps_2026_camera_rollback_rpm.stdout | trim }}"
    state: present
    disable_gpg_check: true
    allow_downgrade: true
  register: xps_2026_camera_rollback_install
  failed_when: false
  when:
    - xps_2026_camera_refresh_failed | bool
    - xps_2026_camera_previous_ready | bool
    - not xps_2026_camera_prior_untouched | default(false) | bool
    - (xps_2026_camera_rollback_rpm.rc | default(-1) | int) == 0
  tags: [xps-2026, hardware, camera]

- name: Force-rebuild both prior camera DKMS modules after rollback
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xps-ipu7-build
      - install-dkms-force
      - "{{ xps_2026_camera_kernel.stdout }}"
  register: xps_2026_camera_rollback_dkms
  changed_when: "'DKMS_CHANGED ' in xps_2026_camera_rollback_dkms.stdout"
  failed_when: false
  when:
    - xps_2026_camera_refresh_failed | bool
    - xps_2026_camera_previous_ready | bool
    - not xps_2026_camera_prior_untouched | default(false) | bool
    - (xps_2026_camera_rollback_install.rc | default(-1) | int) == 0
  tags: [xps-2026, hardware, camera]

- name: Verify rollback restored the exact prior package identity
  ansible.builtin.command:
    argv: [/usr/local/libexec/xps-ipu7-build, installed-identity]
  register: xps_2026_camera_rollback_identity
  changed_when: false
  failed_when: false
  when:
    - xps_2026_camera_refresh_failed | bool
    - xps_2026_camera_previous_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Verify rollback restored the exact prior package NEVRA
  ansible.builtin.command:
    argv: [rpm, -q, --qf, "%{NEVRA}", xps-ipu7-camera-stack]
  register: xps_2026_camera_rollback_nevra
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - xps_2026_camera_refresh_failed | bool
    - xps_2026_camera_previous_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Validate the retained or restored prior camera stack
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xps-ipu7-build
      - validate-installed
      - "{{ xps_2026_camera_kernel.stdout }}"
  register: xps_2026_camera_rollback_validation
  changed_when: false
  failed_when: false
  when:
    - xps_2026_camera_refresh_failed | bool
    - xps_2026_camera_previous_ready | bool
    - (xps_2026_camera_rollback_identity.rc | default(-1) | int) == 0
    - xps_2026_camera_rollback_identity.stdout | trim == xps_2026_camera_previous_identity
    - (xps_2026_camera_rollback_nevra.rc | default(-1) | int) == 0
    - xps_2026_camera_rollback_nevra.stdout | trim == xps_2026_camera_previous_nevra
    - >-
      xps_2026_camera_prior_untouched | default(false) | bool
      or (xps_2026_camera_rollback_dkms.rc | default(-1) | int) == 0
  tags: [xps-2026, hardware, camera]

- name: Record the candidate exact camera rollback
  ansible.builtin.set_fact:
    xps_2026_camera_rollback_proven: >-
      {{ xps_2026_camera_refresh_failed | bool
         and xps_2026_camera_previous_ready | bool
         and (xps_2026_camera_rollback_identity.rc | default(-1) | int) == 0
         and (xps_2026_camera_rollback_identity.stdout | default('') | trim)
             == xps_2026_camera_previous_identity
         and (xps_2026_camera_rollback_nevra.rc | default(-1) | int) == 0
         and (xps_2026_camera_rollback_nevra.stdout | default('') | trim)
             == xps_2026_camera_previous_nevra
         and (xps_2026_camera_rollback_validation.rc | default(-1) | int) == 0 }}
  tags: [xps-2026, hardware, camera]

- name: Commit the exact retained or restored camera rollback
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xps-ipu7-build
      - commit-transaction
      - "{{ xps_2026_camera_previous_identity }}"
      - "{{ xps_2026_camera_kernel.stdout }}"
  register: xps_2026_camera_rollback_commit
  changed_when: "'TRANSACTION_COMMITTED ' in xps_2026_camera_rollback_commit.stdout"
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_rollback_proven | bool
  tags: [xps-2026, hardware, camera]

- name: Record only a proven and committed camera rollback as retained
  ansible.builtin.set_fact:
    xps_2026_camera_preserve_previous: >-
      {{ xps_2026_camera_rollback_proven | bool
         and (xps_2026_camera_rollback_commit.rc | default(1) | int) == 0 }}
  tags: [xps-2026, hardware, camera]

- name: Retire superseded DKMS bundles only after commit or proven rollback
  ansible.builtin.command:
    argv: [/usr/local/libexec/xps-ipu7-build, prune-dkms]
  register: xps_2026_camera_dkms_prune
  changed_when: "'DKMS_PRUNED' in xps_2026_camera_dkms_prune.stdout"
  failed_when: false
  when:
    - not ansible_check_mode
    - >-
      xps_2026_camera_ready | bool
      or xps_2026_camera_preserve_previous | bool
  tags: [xps-2026, hardware, camera]

- name: Restart the exact retained camera stack after DKMS pruning
  ansible.builtin.systemd_service:
    name: xps-ipu7-camera.service
    enabled: true
    state: started
    daemon_reload: true
  register: xps_2026_camera_retained_start
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_preserve_previous | bool
  tags: [xps-2026, hardware, camera]

- name: Verify the retained camera stack is active again
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, xps-ipu7-camera.service]
  register: xps_2026_camera_retained_runtime
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_preserve_previous | bool
  tags: [xps-2026, hardware, camera]

- name: Report a retained camera stack that could not be restarted
  ansible.builtin.debug:
    msg: >-
      The prior camera RPM and DKMS pair were restored and validated, but its
      service could not be restarted: {{ xps_2026_camera_retained_start.msg
      | default('unknown systemd error') }}
  when:
    - not ansible_check_mode
    - xps_2026_camera_preserve_previous | bool
    - (xps_2026_camera_retained_runtime.rc | default(1) | int) != 0
  tags: [xps-2026, hardware, camera]

- name: Report IPU7 DKMS or Secure Boot diagnostics
  ansible.builtin.debug:
    msg: >-
      The camera userspace may be installed, but its kernel extensions are not
      usable yet.
      {{ xps_2026_camera_abi_preflight.stderr | default('') }}
      {{ xps_2026_camera_dkms.stderr | default('DKMS was not run.') }}
      An IPU7_STOCK_ABI_CHANGED diagnostic means Fedora changed the private
      in-tree IPU7 layout and this optional compatibility layer needs review.
      See /var/lib/xps-hardware/ipu7/build-failed.log,
      /var/lib/xps-hardware/ipu7/abi-failed.log,
      /var/lib/xps-hardware/ipu7/dkms-failed.log, and
      docs/xps-2026-hardware.md. The rest of the play continues.
  when:
    - not ansible_check_mode
    - not xps_2026_camera_ready | bool
    - not xps_2026_camera_reboot_required | bool
  tags: [xps-2026, hardware, camera]

- name: Report that a failed camera refresh retained the prior stack
  ansible.builtin.debug:
    msg: >-
      The optional camera refresh did not validate completely. The exact prior
      RPM identity and both prior DKMS modules were verified after retaining or
      restoring them, so its relay configuration and service remain enabled.
  when:
    - not ansible_check_mode
    - xps_2026_camera_preserve_previous | bool
  tags: [xps-2026, hardware, camera]

- name: Report an unprovable camera rollback and fail closed
  ansible.builtin.debug:
    msg: >-
      The optional camera refresh failed and the prior RPM/DKMS pair could not
      be proven restored. The relay and camera service are disabled below to
      avoid running mixed userspace and kernel components. Review the isolated
      diagnostics before re-running the camera tag.
  when:
    - not ansible_check_mode
    - xps_2026_camera_refresh_failed | bool
    - not xps_2026_camera_preserve_previous | bool
  tags: [xps-2026, hardware, camera]

- name: Report a camera DKMS update awaiting one normal reboot
  ansible.builtin.debug:
    msg: >-
      The signed IPU7/CVS modules were updated while an older copy was loaded.
      The transaction marker, hidden relay, and disabled camera service remain
      in place. Reboot normally and rerun the camera tag; only that post-reboot
      validation can commit and expose the new stack. Fedora's stock kernel
      remains installed.
  when:
    - not ansible_check_mode
    - xps_2026_camera_reboot_required | bool
  tags: [xps-2026, hardware, camera]

- name: Install the hardware-gated IPU7 camera integration
  ansible.builtin.copy:
    src: "camera/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - src: xps-ipu7-camera-check
      dest: /usr/local/libexec/xps-ipu7-camera-check
      mode: "0755"
    - src: xps-ipu7-camera-frame-check
      dest: /usr/local/libexec/xps-ipu7-camera-frame-check
      mode: "0755"
    - src: xps-ipu7-camera-sleep
      dest: /usr/lib/systemd/system-sleep/xps-ipu7-camera
      mode: "0755"
    - src: 71-xps-ipu7-hide-isys.rules
      dest: /etc/udev/rules.d/71-xps-ipu7-hide-isys.rules
      mode: "0644"
    - src: 90-xps-ipu7-psys.rules
      dest: /etc/udev/rules.d/90-xps-ipu7-psys.rules
      mode: "0644"
    - src: xps-ipu7-camera.modprobe.conf
      dest: /etc/modprobe.d/xps-ipu7-camera.conf
      mode: "0644"
    - src: v4l2-relayd-ipu7.conf
      dest: /usr/local/share/xps-2026/camera/v4l2-relayd-ipu7.conf
      mode: "0644"
  notify:
    - Reload XPS 2026 systemd
    - Reload XPS 2026 udev rules
    - Restart XPS 2026 WirePlumber
  tags: [xps-2026, hardware, camera]

- name: Install the detected-BDF WirePlumber camera rule
  ansible.builtin.template:
    src: 90-xps-ipu7-v4l2.conf.j2
    dest: /etc/wireplumber/wireplumber.conf.d/90-xps-ipu7-v4l2.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart XPS 2026 WirePlumber
  tags: [xps-2026, hardware, camera]

- name: Install the IPU7 camera services and user-session refresh helper
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - src: xps-ipu7-camera-init.service.j2
      dest: /etc/systemd/system/xps-ipu7-camera-init.service
      mode: "0644"
    - src: xps-ipu7-camera.service.j2
      dest: /etc/systemd/system/xps-ipu7-camera.service
      mode: "0644"
    - src: xps-ipu7-camera-resume.service.j2
      dest: /etc/systemd/system/xps-ipu7-camera-resume.service
      mode: "0644"
    - src: xps-ipu7-refresh-wireplumber.j2
      dest: /usr/local/libexec/xps-ipu7-refresh-wireplumber
      mode: "0755"
  notify:
    - Reload XPS 2026 systemd
    - Restart XPS 2026 camera
  tags: [xps-2026, hardware, camera]

- name: Expose the IPU7 relay configuration only when its stack is ready
  ansible.builtin.copy:
    remote_src: true
    src: /usr/local/share/xps-2026/camera/v4l2-relayd-ipu7.conf
    dest: /etc/v4l2-relayd.d/ipu7.conf
    owner: root
    group: root
    mode: "0644"
  when:
    - not ansible_check_mode
    - >-
      xps_2026_camera_ready | bool
      or xps_2026_camera_preserve_previous | bool
  notify:
    - Reload XPS 2026 systemd
    - Restart XPS 2026 camera
  tags: [xps-2026, hardware, camera]

- name: Keep an incomplete IPU7 stack out of v4l2-relayd's generator
  ansible.builtin.file:
    path: /etc/v4l2-relayd.d/ipu7.conf
    state: absent
  when:
    - not ansible_check_mode
    - not xps_2026_camera_ready | bool
    - not xps_2026_camera_preserve_previous | bool
  notify: Reload XPS 2026 systemd
  tags: [xps-2026, hardware, camera]

- name: Restore SELinux labels on the IPU7 integration
  ansible.builtin.command:
    argv: [restorecon, -RF, /usr/local/libexec, /usr/local/share/xps-2026/camera, /etc/wireplumber, /etc/v4l2-relayd.d, /etc/systemd/system]
  changed_when: false
  when: not ansible_check_mode
  tags: [xps-2026, hardware, camera]

- name: Apply camera unit and device-rule handlers before the runtime probe
  ansible.builtin.meta: flush_handlers
  tags: [xps-2026, hardware, camera]

- name: Enable the complete IPU7 camera stack
  ansible.builtin.systemd_service:
    name: xps-ipu7-camera.service
    enabled: true
    state: started
    daemon_reload: true
  register: xps_2026_camera_start
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Probe the optional camera runtime without failing the play
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, xps-ipu7-camera.service]
  register: xps_2026_camera_runtime
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_ready | bool
  tags: [xps-2026, hardware, camera]

- name: Report camera runtime diagnostics
  ansible.builtin.debug:
    msg: >-
      The optional camera stack installed but did not start in this boot. Run
      'systemctl status xps-ipu7-camera xps-ipu7-camera-init
      v4l2-relayd@ipu7' and '/usr/local/libexec/xps-ipu7-camera-check'. A prior
      IPU7 kernel fault intentionally requires a normal reboot before retrying.
  when:
    - not ansible_check_mode
    - xps_2026_camera_ready | bool
    - xps_2026_camera_runtime.rc != 0
  tags: [xps-2026, hardware, camera]

- name: Disable an incomplete IPU7 camera stack safely
  ansible.builtin.systemd_service:
    name: xps-ipu7-camera.service
    enabled: false
    state: stopped
    daemon_reload: true
  failed_when: false
  when:
    - not ansible_check_mode
    - not xps_2026_camera_ready | bool
    - not xps_2026_camera_preserve_previous | bool
  tags: [xps-2026, hardware, camera]
