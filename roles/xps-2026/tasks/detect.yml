---
- name: Read the Dell product SKU
  ansible.builtin.slurp:
    src: /sys/class/dmi/id/product_sku
  register: xps_2026_product_sku_file
  failed_when: false
  check_mode: false
  tags: [always]

- name: Inspect the XPS 2026 hardware endpoints
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /sys/bus/i2c/devices/i2c-VEN_06CB:00
    - /sys/bus/acpi/devices/OVTI08F4:00
    - /sys/bus/acpi/devices/OVTI08F4:01
  register: xps_2026_endpoint_stats
  check_mode: false
  tags: [always]

- name: Detect the Panther Lake IPU7 PCI function
  ansible.builtin.command:
    argv: [lspci, -Dn, -d, "8086:b05d"]
  register: xps_2026_ipu7_pci
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [always]

- name: Record the precise XPS 2026 feature gates
  ansible.builtin.set_fact:
    xps_2026_product_sku: >-
      {{ xps_2026_product_sku_file.content | default('') | b64decode | trim }}
    xps_2026_is_supported: >-
      {{ ansible_facts.system_vendor | default('') == 'Dell Inc.'
         and (xps_2026_product_sku_file.content | default('') | b64decode | trim) in xps_2026_supported_skus
         and ansible_facts.product_name | default('') is regex('(?i)(XPS (14|16)|DA14260|DA16260)')
         and ansible_facts.processor | default([]) | join(' ') is regex('(?i)(Intel.*(Ultra|X7)|Panther Lake)') }}
    xps_2026_has_touchpad: "{{ xps_2026_endpoint_stats.results[0].stat.exists }}"
    xps_2026_has_ovti08f4: >-
      {{ xps_2026_endpoint_stats.results[1].stat.exists
         or xps_2026_endpoint_stats.results[2].stat.exists }}
    xps_2026_has_ipu7: "{{ xps_2026_ipu7_pci.rc == 0 and xps_2026_ipu7_pci.stdout | trim | length > 0 }}"
    xps_2026_ipu7_pci_bdf: >-
      {{ (xps_2026_ipu7_pci.stdout_lines | default([]) | first | default('')).split(' ') | first }}
  tags: [always]

- name: Report a non-matching XPS 2026 hardware role
  ansible.builtin.debug:
    msg: >-
      XPS-2026 role skipped: vendor={{ ansible_facts.system_vendor | default('unknown') }},
      product={{ ansible_facts.product_name | default('unknown') }},
      SKU={{ xps_2026_product_sku | default('unknown') }}.
  when: not xps_2026_is_supported | bool
  tags: [always]

- name: Read the internal-panel EDID product identifier
  ansible.builtin.command:
    argv:
      - /usr/bin/bash
      - -c
      - |
        shopt -s nullglob
        for edid in /sys/class/drm/card*-eDP-*/edid; do
          [[ -r $edid ]] || continue
          product=$(/usr/bin/od -An -tx1 -j8 -N2 "$edid") || continue
          printf '%s\n' "${product//[[:space:]]/}"
          exit 0
        done
        exit 1
  register: xps_2026_internal_panel_product
  changed_when: false
  failed_when: false
  check_mode: false
  when: xps_2026_is_supported | bool
  tags: [always, xps-2026, hardware, backlight]

- name: Record the XPS OLED backlight-interface gate
  ansible.builtin.set_fact:
    xps_2026_needs_vesa_backlight: >-
      {{ xps_2026_is_supported | bool
         and (xps_2026_internal_panel_product.stdout | default('') | trim)
             in xps_2026_vesa_backlight_edid_products }}
  tags: [always, xps-2026, hardware, backlight]

- name: Detect a real fingerprint reader without mistaking the IPU7 USB bridge
  ansible.builtin.script: xps-fingerprint-detect
  register: xps_2026_fingerprint_probe
  changed_when: false
  failed_when: false
  check_mode: false
  when: xps_2026_is_supported | bool
  tags: [always, xps-2026, hardware, fingerprint]

- name: Record the optional fingerprint hardware gate
  ansible.builtin.set_fact:
    xps_2026_has_fingerprint: >-
      {{ xps_2026_is_supported | bool
         and (xps_2026_fingerprint_probe.rc | default(1) | int) == 0 }}
  tags: [always, xps-2026, hardware, fingerprint]
