---
- name: Detect the shared XPS hardware contract
  ansible.builtin.import_tasks: detect.yml
  tags: [always]

- name: Select the working backlight interface for the XPS OLED panel
  ansible.builtin.import_tasks: backlight.yml
  when:
    - xps_2026_is_supported | bool
    - xps_2026_needs_vesa_backlight | bool

- name: Install explicit Panther Lake media and firmware support
  ansible.builtin.import_tasks: packages.yml
  when: xps_2026_is_supported | bool

- name: Configure XPS 2026 power management
  ansible.builtin.import_tasks: power.yml
  when: xps_2026_is_supported | bool

- name: Configure the XPS 2026 internal-speaker tuning
  ansible.builtin.import_tasks: speaker.yml
  when:
    - xps_2026_is_supported | bool
    - xps_2026_product_sku in xps_2026_speaker_skus

- name: Configure the XPS 2026 haptic touchpad
  ansible.builtin.import_tasks: touchpad.yml
  when:
    - xps_2026_is_supported | bool
    - xps_2026_has_touchpad | bool

- name: Configure an optional Fedora-supported fingerprint reader
  ansible.builtin.import_tasks: fingerprint.yml
  when:
    - xps_2026_is_supported | bool
    - xps_2026_has_fingerprint | bool

- name: Retire the role-owned IPU7 camera stack when explicitly disabled
  ansible.builtin.import_tasks: camera-disabled.yml
  when: not xps_2026_camera_enabled | bool

- name: Configure the Panther Lake IPU7 internal camera
  ansible.builtin.import_tasks: camera.yml
  when:
    - xps_2026_is_supported | bool
    - xps_2026_camera_enabled | bool
    - xps_2026_has_ovti08f4 | bool
    - xps_2026_has_ipu7 | bool
