[Unit]
Requires=xps-ipu7-camera-init.service
After=xps-ipu7-camera-init.service
PartOf=xps-ipu7-camera.service
ConditionPathExists=/dev/video50
ConditionPathExists=!/var/lib/xps-hardware/ipu7/transaction.in-progress

[Service]
Environment=GST_PLUGIN_PATH=/usr/lib64/gstreamer-1.0
# Fedora's relay unit intentionally sandboxes ordinary webcams. Intel's HAL
# needs the IPU/CVS devices and configuration paths, so relax only this instance.
PrivateNetwork=no
InaccessibleDirectories=
ReadOnlyDirectories=
DevicePolicy=auto
# Do not retain a producer sample. Two loopback buffers keep GStreamer capture
# clients on their copy/requeue path; with three, v4l2loopback can return a
# still-held buffer again during the splash-to-camera transition.
ExecStart=
ExecStart=/bin/sh -c 'DEVICE=$(grep -l -m1 -E "^${CARD_LABEL}$" /sys/devices/virtual/video4linux/*/name | cut -d/ -f6); exec /usr/bin/v4l2-relayd -i "${VIDEOSRC}" $${SPLASHSRC:+-s "${SPLASHSRC}"} -o "appsrc name=appsrc caps=video/x-raw,format=${FORMAT},width=${WIDTH},height=${HEIGHT},framerate=${FRAMERATE} ! videoconvert ! v4l2sink name=v4l2sink device=/dev/$${DEVICE} enable-last-sample=false" $EXTRA_OPTS'
ExecStartPost=-/usr/local/libexec/xps-ipu7-refresh-wireplumber
