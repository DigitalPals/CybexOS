---
# Reuse the ISO inputs after the desktop and application repositories exist.
# Checkout's application stores replace only the two local CybexOS RPMs.
- name: Read the shared ISO system and desktop package contract
  ansible.builtin.command:
    argv: [python3, "{{ config_repo }}/image/system_packages.py", --root, "{{ config_repo }}"]
  register: base_iso_package_contract
  changed_when: false
  check_mode: false

- name: Install the shared ISO system and desktop package baseline
  ansible.builtin.dnf:
    name: "{{ (base_iso_package_contract.stdout | from_json).selectors }}"
    state: present
    exclude: "{{ (base_iso_package_contract.stdout | from_json).excluded }}"
    install_weak_deps: "{{ (base_iso_package_contract.stdout | from_json).install_weak_deps }}"
    allowerasing: true
