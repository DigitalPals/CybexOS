---
- name: Ensure local privilege groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ base_account_groups + (features.docker | bool | ternary(['docker'], [])) }}"

# The docker group controls a root daemon, so membership is root-equivalent.
# It is granted only when the saved docker_sudoless answer accepts that.
- name: Configure primary user groups and Fish login shell
  ansible.builtin.user:
    name: "{{ primary_user }}"
    groups: "{{ (base_account_groups + ((features.docker | bool and docker_sudoless | bool) | ternary(['docker'], []))) | join(',') }}"
    append: true
    shell: "{{ base_login_shell }}"

- name: Configure passwordless wheel sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/10-wheel-nopasswd
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    content: "%wheel ALL=(ALL:ALL) NOPASSWD: ALL\n"
  when: passwordless_wheel | bool

- name: Revoke passwordless wheel sudo when disabled
  ansible.builtin.file:
    path: /etc/sudoers.d/10-wheel-nopasswd
    state: absent
  when: not passwordless_wheel | bool

- name: Configure active local wheel Polkit authorization
  ansible.builtin.copy:
    dest: /etc/polkit-1/rules.d/49-wheel-local.rules
    owner: root
    group: root
    mode: "0644"
    content: |
      polkit.addRule(function(action, subject) {
        if (subject.isInGroup("wheel") && subject.active && subject.local) {
          return polkit.Result.YES;
        }
      });
  when: passwordless_local_polkit | bool

- name: Revoke passwordless local Polkit authorization when disabled
  ansible.builtin.file:
    path: /etc/polkit-1/rules.d/49-wheel-local.rules
    state: absent
  when: not passwordless_local_polkit | bool

# Lingering starts the user's systemd manager at boot, so user services run
# before the first login. Anaconda's offline target has no logind; the marker
# file is all loginctl enable-linger persists.
- name: Enable user lingering
  ansible.builtin.command: "loginctl enable-linger {{ primary_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ primary_user }}"
  when: not cybexos_offline | default(false) | bool

- name: Create the offline user lingering directory
  ansible.builtin.file:
    path: /var/lib/systemd/linger
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: cybexos_offline | default(false) | bool

- name: Enable user lingering in the offline installation target
  ansible.builtin.copy:
    dest: "/var/lib/systemd/linger/{{ primary_user }}"
    content: ""
    owner: root
    group: root
    mode: "0644"
  when: cybexos_offline | default(false) | bool
