---
# The image installer and repair command reuse the actual workstation tasks.
# In Anaconda's offline target the compose has already installed every package.
- name: Install the shared baseline on existing image installations
  ansible.builtin.import_tasks: packages.yml
  when: not cybexos_offline | bool

- name: Read the installed account identity
  ansible.builtin.getent:
    database: passwd
    key: "{{ primary_user }}"

- name: Apply the shared account policy
  ansible.builtin.import_tasks: accounts.yml

- name: Resolve .local names through multicast DNS
  ansible.builtin.import_tasks: mdns.yml

- name: Apply the shared workstation firewall
  ansible.builtin.template:
    src: cybexos-zone.xml.j2
    dest: /etc/firewalld/zones/cybexos.xml
    owner: root
    group: root
    mode: "0644"
  register: image_firewall

- name: Enable the shared workstation services
  ansible.builtin.import_tasks: services.yml

- name: Schedule weekly Btrfs scrubs
  ansible.builtin.import_tasks: btrfs-scrub.yml

- name: Reload the repaired workstation firewall
  ansible.builtin.systemd_service:
    name: firewalld.service
    state: reloaded
  when:
    - not cybexos_offline | bool
    - image_firewall is changed

- name: Enable Tailscale when selected
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true
  when: features.tailscale | bool

- name: Start Docker on demand
  ansible.builtin.import_tasks: docker-activation.yml

# The image installs Docker and Tailscale for every system, and the kickstart
# enables tailscaled (earlier images also docker.service) whatever the saved
# choice. Deselecting a feature with cybex configure turns its units off.
- name: Turn off deselected image services
  ansible.builtin.systemd_service:
    name: "{{ item.unit }}"
    enabled: false
    state: "{{ cybexos_offline | bool | ternary(omit, 'stopped') }}"
  failed_when: false
  loop:
    - { unit: docker.socket, feature: docker }
    - { unit: docker.service, feature: docker }
    - { unit: tailscaled.service, feature: tailscale }
  when:
    - not features[item.feature] | bool
    - not ansible_check_mode
