---
# A Fedora Cloud/Server base can default to multi-user.target. Select the same
# next boot as an ISO installation without isolating or restarting this session.
- name: Select graphical login for the next boot
  ansible.builtin.file:
    path: /etc/systemd/system/default.target
    src: /usr/lib/systemd/system/graphical.target
    state: link
    force: true

- name: Enable core services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: "{{ cybexos_offline | default(false) | bool | ternary(omit, 'started') }}"
  loop: "{{ base_core_services }}"

- name: Enable optional hardware-backed services for boot
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop:
    - bluetooth.service

- name: Start optional hardware-backed services on the physical workstation
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: "{{ cybexos_offline | default(false) | bool | ternary(omit, 'started') }}"
  loop:
    - bluetooth.service
  when: start_optional_hardware_services | bool
