---
- name: Read installed release packages before preparing the shared codec repositories
  ansible.builtin.package_facts:
    manager: rpm

- name: Prepare the shared codec repositories before resolving base and desktop dependencies
  ansible.builtin.include_role:
    name: apps
    tasks_from: rpmfusion

- name: Install Fedora baseline packages
  ansible.builtin.dnf:
    name: "{{ base_required_packages }}"
    state: present
    allowerasing: true
