---
- name: Inspect the first-adoption core backup marker
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.stat:
    path: "{{ primary_home }}/.local/state/cybexos/backups/initial-core.complete"
  register: base_initial_backup_marker

- name: Preserve core user paths before any role can adopt them
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.shell: |
    set -euo pipefail
    backup={{ (primary_home + '/.local/state/cybexos/backups/initial') | quote }}
    marker={{ (primary_home + '/.local/state/cybexos/backups/initial-core.complete') | quote }}
    mkdir -p "$backup"
    items=(
      .config/xdg-desktop-portal/hyprland-portals.conf
      .config/environment.d/10-cybexos.conf
      .config/systemd/user/hyprland-session.target
      .config/systemd/user/hyprland-session.target.wants
      .config/systemd/user/quickshell.service
      .config/systemd/user/hypridle.service
      .config/systemd/user/hyprpolkitagent.service
      .config/systemd/user/voxtype.service
      .config/systemd/user/external-monitor-toggle.service
      .config/systemd/user/hermes-menubar-bridge.service
      .config/systemd/user/cybexos-session-lock.service
      .config/systemd/user/xps-speaker-tuning.service
      .config/distrobox/distrobox.conf
      .local/bin/screenshot
      .local/bin/screen-record
      .local/bin/quickshell-reminder
      .local/bin/screen-ocr
      .local/bin/clipboard-copy-image
      .local/bin/clipboard-image-to-file
      .local/bin/clipboard-history-store
      .local/bin/localsend
      .local/bin/localsend-share
      .local/bin/cybex
      .local/bin/cybexos-update-run
      .local/bin/cybexos-firmware-update
      .local/bin/brightness-control
      .local/bin/portal-launcher
      .local/bin/t3code-update
      .local/bin/t3code-desktop
      .local/bin/spotify
      .local/bin/app-backup
      .local/bin/browser-backup
      .local/bin/fastfetch-link-speed
      .local/bin/external-monitor-toggle
      .local/bin/dev-distrobox-init
      .local/bin/dev-fedora-shell
      .local/bin/dev-arch-shell
      .local/bin/dev-debian-shell
      .local/bin/update-user-tools
      .local/libexec/hermes-menubar-bridge
      .local/share/nautilus-python/extensions/localsend.py
      .local/share/applications/nvim-kitty.desktop
      .local/share/applications/brave-browser.desktop
      .local/share/applications/brave-origin.desktop
      .local/share/applications/chatgpt.desktop
      .local/share/applications/1password.desktop
      .local/share/applications/com.onepassword.OnePassword.desktop
      .local/share/applications/t3code-nightly.desktop
      .local/share/applications/localsend-share-clipboard.desktop
      .local/share/applications/localsend-share-file.desktop
      .local/share/applications/localsend-share-folder.desktop
      .local/share/applications/dev-fedora.desktop
      .local/share/applications/dev-arch.desktop
      .local/share/applications/dev-debian.desktop
    )
    for relative in "${items[@]}"; do
      source_path={{ primary_home | quote }}/$relative
      [[ -e $source_path || -L $source_path ]] || continue
      parent=$(dirname -- "$relative")
      mkdir -p "$backup/$parent"
      cp -a -- "$source_path" "$backup/$relative"
    done
    touch "$marker"
  args:
    executable: /bin/bash
  when:
    - not base_initial_backup_marker.stat.exists
    - not ansible_check_mode
  changed_when: true

- name: Inspect the first-adoption shared-system backup marker
  ansible.builtin.stat:
    path: /var/lib/cybexos/backups/initial-system.complete
  register: base_initial_system_backup_marker

- name: Preserve shared system paths before CybexOS can adopt them
  ansible.builtin.shell: |
    set -euo pipefail
    backup=/var/lib/cybexos/backups/system
    marker=/var/lib/cybexos/backups/initial-system.complete
    absent=/var/lib/cybexos/backups/initial-system.absent
    install -d -m 0700 "$backup"
    temporary="$absent.new"
    : >"$temporary"
    items=(
      etc/gdm/custom.conf
      var/lib/AccountsService/users/{{ primary_user | quote }}
      etc/sudoers.d/10-wheel-nopasswd
      etc/polkit-1/rules.d/49-wheel-local.rules
    )
    for relative in "${items[@]}"; do
      source_path=/$relative
      if [[ -e $source_path || -L $source_path ]]; then
        install -d -m 0700 "$backup/$(dirname -- "$relative")"
        cp -a -- "$source_path" "$backup/$relative"
      else
        printf '%s\n' "$relative" >>"$temporary"
      fi
    done
    mv -f -- "$temporary" "$absent"
    touch "$marker"
  args:
    executable: /bin/bash
  when:
    - not base_initial_system_backup_marker.stat.exists
    - not ansible_check_mode
  changed_when: true

- name: Install the shared workstation package baseline
  ansible.builtin.import_tasks: packages.yml

- name: Install transactional Btrfs recovery helper
  ansible.builtin.copy:
    src: cybexos-system-snapshot
    dest: /usr/local/libexec/cybexos-system-snapshot
    owner: root
    group: root
    mode: "0755"
  register: base_snapshot_helper

# The documented `sudo cybexos-system-snapshot ...` form needs the helper on
# sudo's secure_path; libexec is not on it.
- name: Expose the recovery helper to administrators
  ansible.builtin.file:
    src: /usr/local/libexec/cybexos-system-snapshot
    dest: /usr/local/sbin/cybexos-system-snapshot
    state: link
    force: true

# Dotfiles and the apps role both consume this library. Installing the shared
# prerequisite in the foundational role keeps a fresh selective convergence
# (base + dotfiles) valid. The apps role also declares it so an application
# refresh remains self-contained on an already provisioned host.
- name: Install shared upstream installer helper prerequisite
  ansible.builtin.copy:
    src: "{{ config_repo }}/roles/apps/files/cybexos-common.sh"
    dest: /usr/local/libexec/cybexos-common.sh
    owner: root
    group: root
    mode: "0644"

- name: Remove the retired persistent Ansible fact cache
  ansible.builtin.file:
    path: "{{ primary_home }}/.cache/xps-ansible-facts"
    state: absent

- name: Create the CybexOS system-state directory
  ansible.builtin.file:
    path: /var/lib/cybexos/features
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the firewall first-adoption state directory
  ansible.builtin.file:
    path: /var/lib/cybexos/firewall/profiles
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Inspect CybexOS ownership of Docker
  ansible.builtin.stat:
    path: /var/lib/cybexos/features/docker
  register: base_docker_marker

- name: Stop and disable Docker socket activation before removing its packages
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  failed_when: false
  loop:
    - docker.socket
    - docker.service
  when:
    - not features.docker | bool
    - base_docker_marker.stat.exists
    - not ansible_check_mode

- name: Install Docker packages when selected
  ansible.builtin.dnf:
    name:
      - docker-compose
      - moby-engine
    state: present
    allowerasing: true
  notify: Reload systemd
  when: features.docker | bool

- name: Remove CybexOS-owned Docker packages when deselected
  ansible.builtin.dnf:
    name:
      - docker-compose
      - moby-engine
    state: absent
  notify: Reload systemd
  when:
    - not features.docker | bool
    - base_docker_marker.stat.exists

# Socket activation starts dockerd, and with it containerd, on the first
# client request instead of keeping both resident and waking while idle.
- name: Enable Docker socket activation when requested
  ansible.builtin.systemd_service:
    name: docker.socket
    enabled: true
    state: started
  when:
    - features.docker | bool
    - not ansible_check_mode

# Only the boot-time start is dropped; a daemon already running is left alone
# rather than stopping its containers in the middle of a converge.
- name: Start Docker on demand rather than at boot
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: false
  when:
    - features.docker | bool
    - not ansible_check_mode

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ machine_hostname }}"
  when: manage_system_identity | bool

- name: Set timezone
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ machine_timezone }}"
    dest: /etc/localtime
    state: link
    force: true
  when: manage_system_identity | bool

- name: Read available system locales
  ansible.builtin.command: locale -a
  register: base_available_locales
  changed_when: false
  check_mode: false

- name: Generate required locales
  ansible.builtin.command: "localedef -i {{ item.split('.')[0] }} -f UTF-8 {{ item }}"
  changed_when: true
  loop: "{{ [machine_locale, regional_locale] | unique }}"
  when:
    - manage_system_identity | bool
    - (item.split('.')[0] + '.utf8') not in base_available_locales.stdout_lines

- name: Configure language and regional locale categories
  ansible.builtin.template:
    src: locale.conf.j2
    dest: /etc/locale.conf
    owner: root
    group: root
    mode: "0644"
  when: manage_system_identity | bool

- name: Configure portable kernel hardening
  ansible.builtin.copy:
    src: 60-cybexos-hardening.conf
    dest: /etc/sysctl.d/60-cybexos-hardening.conf
    owner: root
    group: root
    mode: "0644"

- name: Apply portable kernel hardening
  ansible.builtin.command: sysctl --load /etc/sysctl.d/60-cybexos-hardening.conf
  changed_when: false
  when: not ansible_check_mode

- name: Configure strict firewalld zone
  ansible.builtin.template:
    src: cybexos-zone.xml.j2
    dest: "/etc/firewalld/zones/{{ firewall_zone }}.xml"
    owner: root
    group: root
    mode: "0644"
  notify: Reload firewalld

- name: Enable the shared workstation services
  ansible.builtin.import_tasks: services.yml

- name: Apply the managed firewalld zone before using it
  ansible.builtin.meta: flush_handlers

# This also repairs an interrupted first run where the permanent XML reached
# disk but the earlier play failed before its handler reloaded the daemon.
- name: Reconcile firewalld's runtime view with permanent configuration
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false
  when: not ansible_check_mode

- name: Read default firewall zone
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: base_current_firewall_zone
  changed_when: false
  check_mode: false

- name: Preserve the default firewall zone before first adoption
  ansible.builtin.copy:
    dest: /var/lib/cybexos/firewall/default-zone
    content: >-
      {{ ((base_current_firewall_zone.stdout | trim) == firewall_zone)
         | ternary('public', base_current_firewall_zone.stdout | trim) }}
    owner: root
    group: root
    mode: "0600"
    force: false

- name: Set CybexOS as the default firewall zone
  ansible.builtin.command: "firewall-cmd --set-default-zone={{ firewall_zone }}"
  changed_when: true
  when: base_current_firewall_zone.stdout | trim != firewall_zone and not ansible_check_mode

- name: Find Ethernet and Wi-Fi profiles outside the strict zone
  ansible.builtin.shell: |
    set -o pipefail
    nmcli -t -f UUID,TYPE connection show |
      while IFS=: read -r uuid type; do
        case "$type" in
          802-3-ethernet|802-11-wireless)
            zone=$(nmcli -g connection.zone connection show "$uuid")
            [[ $zone == {{ firewall_zone | quote }} ]] || printf '%s\n' "$uuid"
            ;;
        esac
      done
  args:
    executable: /bin/bash
  register: base_network_profiles_outside_zone
  changed_when: false
  check_mode: false

- name: Preserve physical NetworkManager profile zones before first adoption
  ansible.builtin.shell: |
    set -euo pipefail
    [[ $PROFILE_UUID =~ ^[0-9A-Fa-f-]{36}$ ]]
    marker="/var/lib/cybexos/firewall/profiles/$PROFILE_UUID"
    temporary="$marker.$$.tmp"
    zone=$(nmcli -g connection.zone connection show "$PROFILE_UUID")
    printf '%s\n' "$zone" >"$temporary"
    chmod 0600 "$temporary"
    mv -f -- "$temporary" "$marker"
  args:
    executable: /bin/bash
    creates: "/var/lib/cybexos/firewall/profiles/{{ item }}"
  environment:
    PROFILE_UUID: "{{ item }}"
  loop: "{{ base_network_profiles_outside_zone.stdout_lines }}"
  loop_control:
    label: "{{ item }}"
  when: not ansible_check_mode

- name: Bind physical NetworkManager profiles to the strict zone
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ item }}"
      - connection.zone
      - "{{ firewall_zone }}"
  loop: "{{ base_network_profiles_outside_zone.stdout_lines }}"
  changed_when: true
  when: not ansible_check_mode

- name: Read active physical network devices
  ansible.builtin.shell: |
    set -o pipefail
    LC_ALL=C nmcli -t -f DEVICE,TYPE,STATE device status |
      awk -F: '($2 == "ethernet" || $2 == "wifi") && $3 == "connected" {print $1}'
  args:
    executable: /bin/bash
  register: base_active_physical_devices
  changed_when: false
  check_mode: false

- name: Reapply changed firewall zone bindings without reconnecting
  ansible.builtin.command:
    argv: [nmcli, device, reapply, "{{ item }}"]
  loop: "{{ base_active_physical_devices.stdout_lines }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - base_network_profiles_outside_zone.stdout_lines | length > 0

- name: Configure the shared account defaults
  ansible.builtin.import_tasks: accounts.yml

- name: Inspect Docker group membership before revoking it
  ansible.builtin.getent:
    database: group
    key: docker
    fail_key: false
  register: base_docker_group
  when:
    - base_docker_marker.stat.exists
    - not (features.docker | bool and docker_sudoless | bool)

# Earlier releases granted the group to every Docker user. Revoke it from a
# CybexOS-managed Docker installation unless sudoless use is explicitly saved;
# the change applies to new login sessions.
- name: Revoke root-equivalent Docker group access (opt in with cybex configure)
  ansible.builtin.command:
    argv: [gpasswd, --delete, "{{ primary_user }}", docker]
  changed_when: true
  when:
    - base_docker_marker.stat.exists
    - not (features.docker | bool and docker_sudoless | bool)
    - ansible_facts.getent_group.docker is defined
    - primary_user in (ansible_facts.getent_group.docker[2] | default('')).split(',')

- name: Record CybexOS ownership of Docker
  ansible.builtin.copy:
    dest: /var/lib/cybexos/features/docker
    content: "managed\n"
    owner: root
    group: root
    mode: "0644"
  when: features.docker | bool

- name: Retire CybexOS Docker ownership after removal
  ansible.builtin.file:
    path: /var/lib/cybexos/features/docker
    state: absent
  when:
    - not features.docker | bool
    - base_docker_marker.stat.exists

- name: Enable user lingering
  ansible.builtin.command: "loginctl enable-linger {{ primary_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ primary_user }}"

- name: Configure active local wheel Polkit authorization
  ansible.builtin.copy:
    dest: /etc/polkit-1/rules.d/49-wheel-local.rules
    owner: root
    group: root
    mode: "0644"
    content: |
      polkit.addRule(function(action, subject) {
        if (subject.isInGroup("wheel") && subject.active && subject.local) {
          return polkit.Result.YES;
        }
      });
  when: passwordless_local_polkit | bool

- name: Revoke passwordless local Polkit authorization when disabled
  ansible.builtin.file:
    path: /etc/polkit-1/rules.d/49-wheel-local.rules
    state: absent
  when: not passwordless_local_polkit | bool

- name: Schedule weekly Btrfs scrubs
  ansible.builtin.import_tasks: btrfs-scrub.yml

# Bootable recovery points and restore: GRUB submenu, dracut overlay module,
# kernel-install hook and boot-time refresh.
- name: Configure bootable recovery points
  ansible.builtin.include_tasks: recovery.yml
