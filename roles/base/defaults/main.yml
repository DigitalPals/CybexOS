---
# Shared by workstation convergence, ISO composition, and installed-image repair.
base_required_packages:
- acl
- alsa-ucm
- alsa-utils
- avahi
# Resolves .local names; authselect's with-mdns4 feature enables it.
- nss-mdns
- bash-completion
- bluez
- btrfs-progs
- bolt
- cups
- firewalld
- fish
- flatpak
# The ISO provides every supported locale from this shared package, rather
# than layering per-language copies over the complete language database.
- glibc-all-langpacks
- fwupd
# UEFI capsule updates for cybexos-firmware-update.
- fwupd-efi
- gvfs
- gvfs-fuse
- mokutil
- NetworkManager
# Remote Server's SSH transport is available on every installation.
- openssh-clients
- pipewire
- pipewire-alsa
- pipewire-pulseaudio
# PipeWire's camera path for browsers and the camera portal.
- libcamera
- libcamera-ipa
- pipewire-plugin-libcamera
- policycoreutils-python-utils
- polkit
- powertop
- tuned-ppd
- udisks2
- upower
- zram-generator-defaults
- zstd
# Hardware support. Name firmware explicitly because the image does not
# install weak dependencies of linux-firmware.
- amd-ucode-firmware
- atheros-firmware
- b43-fwcutter
- b43-openfwwf
- brcmfmac-firmware
- iwlegacy-firmware
- iwlwifi-dvm-firmware
- libertas-firmware
- microcode_ctl
- mt7xxx-firmware
- nxpwireless-firmware
- qcom-wwan-firmware
- realtek-firmware
- switcheroo-control
- tiwilink-firmware
- usb_modeswitch
# System services that Fedora's presets enable when installed.
- bluez-obexd
- cronie
- crontabs
- irqbalance
- logrotate
- plocate
- systemd-oomd-defaults
- uresourced
- xdg-user-dirs
# Phones, cameras and network shares in the file manager.
- gvfs-afc
- gvfs-archive
- gvfs-gphoto2
- gvfs-mtp
- gvfs-smb
# VPN connection types for NetworkManager.
- NetworkManager-openconnect-gnome
- NetworkManager-openvpn-gnome
- NetworkManager-ssh-gnome
- NetworkManager-vpnc-gnome
# Printing and scanning.
- cups-browsed
- gutenprint
- gutenprint-cups
- hplip
- libsane-hpaio
- sane-backends-drivers-scanners
- simple-scan
- system-config-printer-udev
# GStreamer codecs; openh264 comes from Fedora's Cisco repository.
# Select the ISO's full codec providers in this first transaction, before
# desktop packages can pull Fedora alternatives and leave orphaned libraries.
- ffmpeg
- fdk-aac
- jack-audio-connection-kit
# Match the ISO's OpenCL dispatch library before media dependencies choose an
# interchangeable provider with a different package identity.
- ocl-icd
- gstreamer1-plugin-libav
- gstreamer1-plugin-openh264
- gstreamer1-plugins-bad-free
- gstreamer1-plugins-ugly-free
# Input methods and accessibility.
- ibus
- ibus-anthy
- ibus-chewing
- ibus-gtk3
- ibus-gtk4
- ibus-hangul
- ibus-libpinyin
- ibus-m17n
- ibus-setup
- ibus-typing-booster
- orca
- speech-dispatcher
# GnuPG's passphrase prompt; the GNOME variant uses gcr and works under
# Hyprland. GnuPG has no pinentry at all without it.
- pinentry-gnome3
# English spell-check dictionary for GTK and Qt applications.
- hunspell-en
# Command-line tools.
- 7zip
- bc
- bind-utils
- bzip2
- cifs-utils
- compsize
- kernel-tools
- man-pages
- mtr
- nmap-ncat
- tcpdump
- traceroute
- whois
# Fingerprint readers and FIDO2/U2F security keys as alternatives to the
# password for sudo, Polkit and the lock screen (docs/security.md).
- fprintd
- fprintd-pam
- libfprint
- pam-u2f
- pamu2fcfg
- libfido2
base_core_services:
- NetworkManager.service
- firewalld.service
- avahi-daemon.service
- cups.service
- fstrim.timer
- fwupd-refresh.timer
- tuned.service
- tuned-ppd.service
base_login_shell: /usr/bin/fish
base_account_groups: [wheel, video, input]
