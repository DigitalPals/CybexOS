---
# PCI class 03xx with vendor 10de, read from sysfs. Shared with the image's
# offline installation, which records the result in /etc/cybexos/hardware.json.
- name: Detect NVIDIA display controllers
  ansible.builtin.script: cybexos-nvidia detect
  register: nvidia_detect_probe
  changed_when: false
  check_mode: false
  tags: [always]

- name: Record the NVIDIA hardware gate
  ansible.builtin.set_fact:
    nvidia_hardware: "{{ nvidia_detect_probe.stdout | from_json }}"
    nvidia_is_present: "{{ (nvidia_detect_probe.stdout | from_json).present | bool }}"
    nvidia_is_hybrid: "{{ (nvidia_detect_probe.stdout | from_json).hybrid | bool }}"
  tags: [always]

- name: Report a machine without an NVIDIA GPU
  ansible.builtin.debug:
    msg: NVIDIA role skipped; no NVIDIA display controller was detected.
  when: not nvidia_is_present | bool
  tags: [always]
